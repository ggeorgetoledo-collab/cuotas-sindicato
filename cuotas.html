/* ---------- Crear / ver plan ---------- */
function planCalendario(p){
  const out = []; const n = Number(p.cuotas) || 1;
  for(let k = 1; k <= n; k++){ const mes = idxToYm(ymToIdx(p.inicio) + k - 1); const ab = planAbono(p, k); const cu = p.incluyeCuota ? tarifaDe(mes) : 0; out.push({ k, mes, ab, cu, tot: ab + cu }); }
  return out;
}
function openPlanForm(socioId){
  const st = { socioId: socioId || null, busca: '', cuotas: 6, monto: 0, inicio: idxToYm(ymToIdx(curYm()) + 1), incluyeCuota: true, modo: 'cuotas' };
  // Deuda que cubre el plan. Si el plan descuenta también la cuota del mes, las cuotas de los meses
  // del plan que ya vencieron se pagan con esa cuota y no se cuentan dos veces.
  const deudaDe = sid=>{
    const s = getById('socios', sid); if(!s) return 0;
    const c = cuentaSocio(s);
    if(!st.incluyeCuota) return c.deuda;
    const ini = ymToIdx(st.inicio);
    const dup = c.items.filter(it=> it.tipo === 'cuota' && it.vencido && it.idx >= ini).reduce((a, it)=> a + (it.monto - (it.pagado || 0)), 0);
    return Math.max(0, c.deuda - dup);
  };
  const recalc = ()=>{
    const d = deudaDe(st.socioId);
    if(st.modo === 'cuotas'){ st.cuotas = Math.max(1, Math.min(36, st.cuotas || 1)); st.monto = Math.ceil(d / st.cuotas / 100) * 100; }
    else { st.monto = Math.max(100, st.monto || 0); st.cuotas = Math.max(1, Math.ceil(d / st.monto)); }
  };
  const m = openModal({
    wide: true,
    title: ()=> 'Nuevo plan de pago',
    body: ()=>{
      const s = st.socioId ? getById('socios', st.socioId) : null;
      if(!s){
        const deudores = sociosOrdenados().map(x=> ({ x, c: cuentaSocio(x) })).filter(o=> o.c.deuda > 0 && !planActivoDe(o.x.id) && (!st.busca || normTxt(o.x.nombre).includes(normTxt(st.busca))));
        return `<label class="f">Socio con deuda<input id="npBusca" type="search" placeholder="Buscar…" value="${esc(st.busca)}" autocomplete="off"></label>
          <div class="picker-list">${deudores.length ? deudores.map(o=> `<button type="button" data-sid="${o.x.id}"><span><b>${esc(o.x.nombre)}</b> <span class="dim small">${o.c.mesesAdeudados.length} meses</span></span><span class="val bad">${clp(o.c.deuda)}</span></button>`).join('') : '<div class="empty">No hay socios con deuda sin plan activo.</div>'}</div>`;
      }
      recalc();
      const d = deudaDe(s.id);
      const p = { inicio: st.inicio, cuotas: st.cuotas, montoCuota: st.monto, deudaInicial: d, incluyeCuota: st.incluyeCuota };
      const cal = planCalendario(p);
      const prom = cal.reduce((a, c)=> a + c.tot, 0) / cal.length;
      return `<div class="sel-socio"><div><div style="font-weight:800">${esc(s.nombre)}</div><div class="small">Deuda vencida a la fecha: <b>${clp(cuentaSocio(s).deuda)}</b>${d !== cuentaSocio(s).deuda ? ` · el plan cubre <b>${clp(d)}</b> (la cuota de ${esc(mesLabel(st.inicio))} se descuenta aparte)` : ''}${cuentaSocio(s).mesesAdeudados.length ? ' · ' + esc(mesesTxt(cuentaSocio(s).mesesAdeudados)) : ''}</div></div>${socioId ? '' : '<button class="btn sm" id="npCambiar">Cambiar</button>'}</div>
        <div class="seg" id="npModo" style="margin-top:12px"><button type="button" data-m="cuotas" class="${st.modo === 'cuotas' ? 'active' : ''}">Por número de cuotas</button><button type="button" data-m="monto" class="${st.modo === 'monto' ? 'active' : ''}">Por monto mensual</button></div>
        <div class="grid3" style="margin-top:10px">
          ${st.modo === 'cuotas' ? `<label class="f">N° de cuotas<input id="npN" type="number" min="1" max="36" value="${st.cuotas}"></label>` : `<label class="f">Abono mensual ($)<input id="npM" inputmode="numeric" value="${miles(st.monto)}"></label>`}
          <label class="f">Primer descuento<input id="npIni" type="month" value="${esc(st.inicio)}"></label>
          <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="npInc" ${st.incluyeCuota ? 'checked' : ''}> Descontar también la cuota del mes</label>
        </div>
        <div class="preview"><b>${st.cuotas} cuota${st.cuotas > 1 ? 's' : ''}</b> de ${clp(st.monto)}${cal.length > 1 && cal[cal.length - 1].ab !== st.monto ? ` (la última de ${clp(cal[cal.length - 1].ab)})` : ''}${st.incluyeCuota ? ` + cuota mensual · descuento total aprox. <b>${clp(prom)}</b> al mes` : ''}. Termina en ${esc(mesLabel(cal[cal.length - 1].mes))}.</div>
        <div class="table-wrap" style="margin-top:10px;max-height:34vh;overflow:auto"><table class="t"><thead><tr><th>Cuota</th><th>Mes</th><th class="r">Abono deuda</th><th class="r">Cuota del mes</th><th class="r">Total a descontar</th></tr></thead><tbody>
          ${cal.map(c=> `<tr><td>${c.k}</td><td>${esc(mesLabelCap(c.mes))}</td><td class="r">${clp(c.ab)}</td><td class="r">${c.cu ? clp(c.cu) : '—'}</td><td class="r"><b>${clp(c.tot)}</b></td></tr>`).join('')}
        </tbody></table></div>
        <label class="f" style="margin-top:10px">Notas (opcional)<input id="npNotas" placeholder="Ej: acordado en reunión del 28/10"></label>
        <div class="note small">Cada mes el descuento debe autorizarse. Si un mes no se autoriza, esa cuota se corre al mes siguiente. La deuda baja cuando marcas el mes como <b>Descontado</b>.</div>`;
    },
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button>${st.socioId ? '<button class="btn primary" id="npOk">Crear plan</button>' : ''}`,
    onMount: (el)=>{
      const b = $('#npBusca', el);
      if(b){ b.focus(); b.oninput = ()=>{ st.busca = b.value; const pos = b.selectionStart; drawModal(m); const n2 = $('#npBusca', m.el); n2.focus(); try{ n2.setSelectionRange(pos, pos); }catch(e){} }; }
      $$('.picker-list button[data-sid]', el).forEach(x=> x.onclick = ()=>{ st.socioId = x.dataset.sid; drawModal(m); });
      const c = $('#npCambiar', el); if(c) c.onclick = ()=>{ st.socioId = null; drawModal(m); };
      const md = $('#npModo', el); if(md) md.onclick = e=>{ const x = e.target.closest('button[data-m]'); if(x){ st.modo = x.dataset.m; drawModal(m); } };
      const n = $('#npN', el); if(n) n.onchange = ()=>{ st.cuotas = parseInt(n.value, 10) || 1; drawModal(m); };
      const mo = $('#npM', el); if(mo) mo.onchange = ()=>{ st.monto = parseMonto(mo.value); drawModal(m); };
      const ini = $('#npIni', el); if(ini) ini.onchange = ()=>{ st.inicio = ini.value || st.inicio; drawModal(m); };
      const inc = $('#npInc', el); if(inc) inc.onchange = ()=>{ st.incluyeCuota = inc.checked; drawModal(m); };
      const ok = $('#npOk', el);
      if(ok) ok.onclick = ()=>{
        recalc();
        const d = deudaDe(st.socioId);
        if(d <= 0){ toast('Este socio no tiene deuda vencida.', 'bad'); return; }
        const s = getById('socios', st.socioId);
        closeModal();
        upsert('planes', { id: uid(), socioId: st.socioId, inicio: st.inicio, cuotas: st.cuotas, montoCuota: st.monto, deudaInicial: d, incluyeCuota: st.incluyeCuota, notas: ($('#npNotas', el) || {}).value || '', creado: now(), por: yo() });
        toast(`✓ Plan creado para ${s.nombre}: ${st.cuotas} cuotas de ${clp(st.monto)}`, 'ok');
        refreshOpenModal();
      };
    },
  });
}
ACT['nuevo-plan'] = el=> openPlanForm(el.dataset.id || null);
ACT['ver-plan'] = el=>{
  const id = el.dataset.id;
  openModal({
    live: true, wide: true,
    title: ()=>{ const p = getById('planes', id); const s = p && getById('socios', p.socioId); return 'Plan de pago · ' + esc(s ? s.nombre : ''); },
    body: ()=>{
      const p = getById('planes', id); if(!p) return '<div class="empty">Plan eliminado.</div>';
      const r = planResumen(p);
      const ms = planMarcas(p);
      const filas = []; let k = 0, i = ymToIdx(p.inicio);
      while(k < r.n && filas.length < 60){
        const mes = idxToYm(i), mk = ms.find(a=> a.mes === mes);
        if(mk && mk.estado === 'rechazado'){ filas.push({ mes, k: null, mk }); }
        else { k++; filas.push({ mes, k, mk, ab: planAbono(p, k), cu: p.incluyeCuota ? tarifaDe(mes) : 0 }); }
        i++;
      }
      return `<div class="tiles">
        <div class="tile"><div class="num">${clp(p.deudaInicial)}</div><div class="lbl">Deuda del plan</div></div>
        <div class="tile"><div class="num ok">${r.pagadas} / ${r.n}</div><div class="lbl">Cuotas descontadas</div></div>
        <div class="tile"><div class="num">${clp(r.abonado)}</div><div class="lbl">Abonado</div></div>
        <div class="tile"><div class="num ${r.saldo ? 'bad' : 'ok'}">${clp(r.saldo)}</div><div class="lbl">Saldo del plan</div></div></div>
        ${p.notas ? `<div class="note small">${esc(p.notas)}</div>` : ''}
        <div class="table-wrap"><table class="t"><thead><tr><th>Mes</th><th>Cuota</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>
        ${filas.map(f=> `<tr><td>${esc(mesLabelCap(f.mes))}</td><td>${f.k ? f.k + ' de ' + r.n : '—'}</td><td class="r">${f.k ? clp(f.ab + f.cu) : ''}</td><td>${f.mk ? `<span class="chip ${PLAN_EST[f.mk.estado].chip}">${PLAN_EST[f.mk.estado].lbl}</span>` : (ymToIdx(f.mes) < ymToIdx(curYm()) ? '<span class="chip warn">Sin marcar</span>' : '<span class="chip neutral">Pendiente</span>')}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note small">Creado ${p.creado ? fdatetime(p.creado) : ''}${p.por ? ' por ' + esc(p.por) : ''}. Los pagos de los meses descontados quedan registrados en el historial del socio.</div>`;
    },
    foot: ()=>{ const p = getById('planes', id); return `<button class="btn danger" id="vpDel">${p && p.anulado ? 'Eliminar plan' : 'Anular plan'}</button><span style="flex:1"></span><button class="btn" data-act="close-modal">Cerrar</button>`; },
    onMount: (el)=>{
      const d = $('#vpDel', el);
      if(d) d.onclick = async ()=>{
        const p = getById('planes', id);
        if(!p.anulado){
          if(!await confirmar('¿Anular este plan? Los meses ya descontados se mantienen como pagos. Los meses siguientes dejarán de aparecer.', 'Anular', true)) return;
          const x = Object.assign({}, p, { anulado: true }); upsert('planes', x); refreshOpenModal();
        } else {
          if(!await confirmar('¿Eliminar el plan? Los pagos ya registrados se mantienen.', 'Eliminar', true)) return;
          closeModal(); removeRec('planes', id);
        }
      };
    },
  });
};

/* =====================================================================
   ACUERDO DEL MES: lista de socios con deuda, cuánto acepta abonar cada
   uno ese mes, y nómina en Word para que firmen la autorización.
   ===================================================================== */
function acuerdoDe(sid, mes){ return live('acuerdos').find(a=> a.socioId === sid && a.mes === mes) || null; }
function acuerdoMontoSugerido(s, mes){
  const pl = planActivoDe(s.id);
  if(pl){ const m = planMontoMes(pl, mes); if(m.k) return m.abono; }
  return 0;
}
function acuerdoFilas(mes){
  const i = ymToIdx(mes);
  return sociosOrdenados().filter(s=> ymToIdx(socioInicio(s)) <= i && (!s.mesTermino || ymToIdx(s.mesTermino) >= i) || acuerdoDe(s.id, mes))
    .map(s=> ({ s, c: cuentaSocio(s), a: acuerdoDe(s.id, mes) }))
    .map(r=> Object.assign(r, { deuda: r.c.deuda + (r.a && r.a.pagoId ? r.a.monto : 0) }))
    .filter(r=> r.deuda > 0 || r.a);
}
ui.acSoloConMonto = ui.acSoloConMonto || false;
function acuerdoHtml(){
  const mes = ui.planMes;
  let filas = acuerdoFilas(mes);
  const conMonto = filas.filter(r=> r.a && r.a.monto > 0);
  const total = conMonto.reduce((t, r)=> t + r.a.monto, 0);
  const desc = conMonto.filter(r=> r.a.pagoId);
  if(ui.acSoloConMonto) filas = conMonto;
  return `<div class="card">
    <div class="card-head"><h2>Acuerdo de abonos · ${esc(mesLabelCap(mes))}</h2>
      <div class="btn-row"><button class="btn primary sm" data-act="ac-word" ${conMonto.length ? '' : 'disabled'}>📄 Guardar y descargar Word</button></div></div>
    <p class="dim small">Escribe cuánto acepta abonar cada socio a su deuda este mes (además de su cuota mensual). Se guarda solo. Para poner el mismo monto a todos, escríbelo y toca "Aplicar a todos" (a quien debe menos se le pone el total de su deuda; con 0 se borran los montos). Al descargar el Word, la planilla queda guardada en el historial.</p>
    <div class="toolbar">
      <input id="acTodos" inputmode="numeric" placeholder="Ej: 5.000" style="width:120px">
      <button class="btn sm" data-act="ac-todos">Aplicar a todos</button>
      <label class="check"><input type="checkbox" id="acSolo" ${ui.acSoloConMonto ? 'checked' : ''}> Solo con monto</label>
      <span class="dim small" style="margin-left:auto">${conMonto.length} socio(s) · total <b>${clp(total)}</b>${desc.length ? ` · descontados ${desc.length}` : ''}</span>
    </div>
    ${filas.length ? `<div class="table-wrap"><table class="t" id="acTabla"><thead><tr><th>Socio</th><th class="r">Deuda vencida</th><th class="r" style="width:150px">Abona este mes</th></tr></thead><tbody>
      ${filas.map(r=>{
        const sug = acuerdoMontoSugerido(r.s, mes);
        const val = r.a ? r.a.monto : (sug || '');
        const pagado = !!(r.a && r.a.pagoId);
        return `<tr data-sid="${r.s.id}" class="${pagado ? 'done' : ''}"><td><a href="#" data-act="ficha" data-id="${r.s.id}"><b>${nombreHtml(r.s)}</b></a>${r.c.mesesAdeudados.length ? `<div class="tiny dim">${esc(mesesTxt(r.c.mesesAdeudados))}</div>` : ''}${!r.a && sug ? '<div class="tiny dim">Sugerido por su plan de pago</div>' : ''}</td>
          <td class="r val bad">${clp(r.deuda)}</td>
          <td class="r"><input class="acMonto" inputmode="numeric" value="${val ? miles(val) : ''}" placeholder="$0" style="text-align:right" ${pagado ? 'disabled' : ''}>${r.a && r.a.monto > 0 ? `<button type="button" class="pl-b ac-b ${pagado ? 'on descontado' : ''}" data-act="ac-desc" data-sid="${r.s.id}">💵 ${pagado ? 'Descontado' : 'Marcar descontado'}</button>` : ''}</td></tr>`;
      }).join('')}
    </tbody></table></div>` : `<div class="empty">No hay socios con deuda en ${esc(mesLabel(mes))}.</div>`}
  </div>`;
}
function acGuardar(sid, monto){
  const mes = ui.planMes;
  const a = acuerdoDe(sid, mes);
  if(a && a.pagoId) return;
  if(!monto){ if(a) removeRec('acuerdos', a.id, { noRender: true }); return; }
  upsert('acuerdos', Object.assign(a || { id: 'ac-' + sid + '-' + mes, socioId: sid, mes }, { monto, por: yo() }), { noRender: true });
}
const _viewPlanes = VIEWS.planes, _mountPlanes = VIEWS.planes.mount;
VIEWS.planes = function(){
  const h = _viewPlanes();
  // el acuerdo del mes va después de la tarjeta de descuentos (tras el selector de mes)
  const i = h.indexOf('<div class="card">', 10);
  return (i > 0 ? h.slice(0, i) + acuerdoHtml() + h.slice(i) : h + acuerdoHtml()) + historialHtml();
};
VIEWS.planes.mount = function(v){
  if(_mountPlanes) _mountPlanes(v);
  const solo = $('#acSolo', v); if(solo) solo.onchange = ()=>{ ui.acSoloConMonto = solo.checked; renderView(); };
  $$('.acMonto', v).forEach(inp=>{
    inp.addEventListener('blur', ()=>{ const n = parseMonto(inp.value); inp.value = n ? miles(n) : ''; const sid = inp.closest('tr').dataset.sid; const s0 = getById('socios', sid); const max = s0 ? cuentaSocio(s0).deuda : 0; let n2 = n; if(n2 > max){ n2 = max; toast('El abono no puede superar la deuda (' + clp(max) + ').'); } const a = acuerdoDe(sid, ui.planMes); if((a ? a.monto : 0) !== n2){ acGuardar(sid, n2); const y = window.scrollY; renderView(); window.scrollTo(0, y); } });
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); const all = $$('.acMonto'); const k = all.indexOf(inp); inp.blur(); setTimeout(()=>{ const nx = $$('.acMonto')[k + 1]; if(nx){ nx.focus(); nx.select(); } }, 50); } });
  });
};
ACT['ac-desc'] = async el=>{
  const sid = el.dataset.sid, mes = ui.planMes;
  const a = acuerdoDe(sid, mes); if(!a) return;
  if(a.pagoId){
    if(!await confirmar('¿Quitar el descuento? Se eliminará el pago registrado.', 'Quitar', true)) return;
    const p = S.pagos.find(x=> x.id === a.pagoId); if(p){ p.del = true; p.u = now(); }
    a.pagoId = null; a.u = now(); changed();
    return;
  }
  const pago = { id: uid(), socioId: sid, monto: a.monto, fecha: ui.planFecha || todayISO(), medio: 'Descuento por planilla', obs: 'Abono a deuda (acuerdo ' + mesLabel(mes) + ')', por: yo(), creado: now(), u: now() };
  S.pagos.push(pago); a.pagoId = pago.id; a.u = now();
  changed();
  toast(`✓ Abono de ${clp(a.monto)} registrado`, 'ok');
};

/* ---------- Word ---------- */
function loadDocx(){
  if(window.docx) return Promise.resolve(window.docx);
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
    sc.onload = ()=> window.docx ? res(window.docx) : rej(new Error('No se pudo preparar Word.'));
    sc.onerror = ()=> rej(new Error('No se pudo cargar el generador de Word (¿sin internet?).'));
    document.head.appendChild(sc);
  });
}
/* Genera el Word a partir de una planilla guardada (snapshot) */
async function nominaWord(nm){
  const mes = nm.mes;
  const filas = nm.filas.map(f=> ({ s: { nombre: f.nombre, rut: f.rut }, deuda: f.deuda, a: { monto: f.monto } }));
  try{
    const D = await loadDocx();
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle, HeightRule, VerticalAlign, PageOrientation } = D;
    const F = 'Calibri', SZ = 22;
    const t = (txt, o)=> new TextRun(Object.assign({ text: String(txt), font: F, size: SZ }, o || {}));
    const p = (runs, o)=> new Paragraph(Object.assign({ children: Array.isArray(runs) ? runs : [runs] }, o || {}));
    const b = { style: BorderStyle.SINGLE, size: 4, color: '000000' };
    const borders = { top: b, bottom: b, left: b, right: b };
    // ancho útil carta horizontal con márgenes de 1,5 cm ≈ 15000 dxa
    const W = [600, 4300, 1800, 2000, 2300, 4000];
    const cell = (content, i, o)=> new TableCell(Object.assign({ borders, width: { size: W[i], type: WidthType.DXA }, verticalAlign: VerticalAlign.CENTER, margins: { top: 60, bottom: 60, left: 100, right: 100 }, children: [p(content, { alignment: (o && o.align) || AlignmentType.LEFT })] }, (o && o.cell) || {}));
    const R = AlignmentType.RIGHT, C = AlignmentType.CENTER;
    const head = new TableRow({ tableHeader: true, children: [
      cell(t('N°', { bold: true }), 0, { align: C }), cell(t('Nombre', { bold: true }), 1), cell(t('RUT', { bold: true }), 2),
      cell(t('Deuda vencida', { bold: true }), 3, { align: R }), cell(t('Abono ' + mesLabel(mes), { bold: true }), 4, { align: R }), cell(t('Firma', { bold: true }), 5, { align: C }) ] });
    const rows = filas.map((r, i)=> new TableRow({ height: { value: 620, rule: HeightRule.ATLEAST }, children: [
      cell(t(i + 1), 0, { align: C }), cell(t(r.s.nombre), 1), cell(t(r.s.rut ? formatRut(r.s.rut) : ''), 2),
      cell(t(clp(r.deuda)), 3, { align: R }), cell(t(clp(r.a.monto)), 4, { align: R }), cell(t(''), 5) ] }));
    const total = filas.reduce((a, r)=> a + r.a.monto, 0);
    const tot = new TableRow({ children: [ cell(t(''), 0), cell(t('Total', { bold: true }), 1), cell(t(''), 2), cell(t(clp(filas.reduce((a, r)=> a + r.deuda, 0)), { bold: true }), 3, { align: R }), cell(t(clp(total), { bold: true }), 4, { align: R }), cell(t(''), 5) ] });
    const doc = new Document({
      styles: { default: { document: { run: { font: F, size: SZ } } } },
      sections: [{
        properties: { page: { size: { width: 12240, height: 15840, orientation: PageOrientation.LANDSCAPE }, margin: { top: 850, bottom: 850, left: 850, right: 850 } } },
        children: [
          p(t(S.config.nombre || 'Sindicato', { bold: true })),
          p(t('Autorización de descuento por planilla: abono a cuotas sindicales adeudadas · ' + mesLabelCap(mes), { bold: true }), { spacing: { after: 120 } }),
          p(t('Quienes firman autorizan que se descuente de su remuneración del mes de ' + mesLabel(mes) + ' el monto indicado en la columna "Abono", como pago de cuotas sindicales adeudadas. Este monto es adicional a la cuota sindical mensual.'), { spacing: { after: 200 } }),
          new Table({ width: { size: W.reduce((a, x)=> a + x, 0), type: WidthType.DXA }, columnWidths: W, rows: [head].concat(rows, [tot]) }),
          p(t(''), { spacing: { before: 400 } }),
          p(t('Fecha: ____ / ____ / ________        Firma tesorería: ______________________________')),
        ],
      }],
    });
    const blob = await Packer.toBlob(doc);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `autorizacion-abonos-${mes}${nm.n > 1 ? '-' + nm.n : ''}.docx`;
    a.click();
    setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
  }catch(e){ toast('⚠ ' + (e.message || e), 'bad'); }
}

/* ---------- Guardar planilla e historial ---------- */
function nominasDelMes(mes){ return live('nominas').filter(n=> n.mes === mes).sort((a, b)=> (a.creado || 0) - (b.creado || 0)); }
function guardarNomina(){
  const mes = ui.planMes;
  const filas = acuerdoFilas(mes).filter(r=> r.a && r.a.monto > 0).map(r=> ({ sid: r.s.id, nombre: r.s.nombre, rut: r.s.rut ? formatRut(r.s.rut) : '', deuda: r.deuda, monto: r.a.monto }));
  if(!filas.length) return null;
  const n = nominasDelMes(mes).length + 1;
  const nm = { id: uid(), mes, n, creado: now(), por: yo(), filas, total: filas.reduce((a, f)=> a + f.monto, 0) };
  upsert('nominas', nm, { noRender: true });
  return nm;
}
ACT['ac-word'] = async el=>{
  const nm = guardarNomina(); if(!nm) return;
  el.disabled = true;
  await nominaWord(nm);
  el.disabled = false;
  toast(`✓ Planilla de ${mesLabel(nm.mes)} guardada en el historial`, 'ok');
  const y = window.scrollY; renderView(); window.scrollTo(0, y);
};
ACT['ac-hist-word'] = async el=>{ const nm = getById('nominas', el.dataset.id); if(nm) await nominaWord(nm); };
ACT['ac-hist-ver'] = el=>{
  const id = el.dataset.id;
  openModal({
    wide: true,
    title: ()=>{ const nm = getById('nominas', id); return nm ? 'Planilla de abonos · ' + esc(mesLabelCap(nm.mes)) + (nm.n > 1 ? ' (' + nm.n + ')' : '') : 'Planilla'; },
    body: ()=>{
      const nm = getById('nominas', id); if(!nm) return '<div class="empty">Planilla eliminada.</div>';
      const est = f=>{ const a = acuerdoDe(f.sid, nm.mes); return a && a.pagoId ? '<span class="chip ok">Descontado</span>' : '<span class="chip neutral">Pendiente</span>'; };
      return `<div class="note small">Guardada el ${fdatetime(nm.creado)}${nm.por ? ' por ' + esc(nm.por) : ''} · ${nm.filas.length} socio(s) · total ${clp(nm.total)}</div>
        <div class="table-wrap"><table class="t"><thead><tr><th>N°</th><th>Nombre</th><th class="r">Deuda</th><th class="r">Abono</th><th>Estado</th></tr></thead><tbody>
        ${nm.filas.map((f, i)=> `<tr><td>${i + 1}</td><td>${esc(f.nombre)}</td><td class="r">${clp(f.deuda)}</td><td class="r"><b>${clp(f.monto)}</b></td><td>${est(f)}</td></tr>`).join('')}
        <tr><td></td><td><b>Total</b></td><td class="r">${clp(nm.filas.reduce((a, f)=> a + f.deuda, 0))}</td><td class="r"><b>${clp(nm.total)}</b></td><td></td></tr></tbody></table></div>`;
    },
    foot: ()=> `<button class="btn danger" id="nmDel">Eliminar del historial</button><span style="flex:1"></span><button class="btn" data-act="close-modal">Cerrar</button><button class="btn primary" data-act="ac-hist-word" data-id="${id}">📄 Descargar Word</button>`,
    onMount: (el)=>{
      $('#nmDel', el).onclick = async ()=>{ if(!await confirmar('¿Eliminar esta planilla del historial? No cambia los montos ni los pagos registrados.', 'Eliminar', true)) return; closeModal(); removeRec('nominas', id); };
    },
  });
};
function historialHtml(){
  const all = live('nominas').sort((a, b)=> (b.mes || '').localeCompare(a.mes || '') || (b.creado || 0) - (a.creado || 0));
  return `<div class="card"><h2>Historial de planillas de abonos (${all.length})</h2>
    ${all.length ? all.map(nm=> `<div class="row"><div class="main"><div class="title">${esc(mesLabelCap(nm.mes))}${nm.n > 1 ? ' · versión ' + nm.n : ''}</div><div class="sub">${nm.filas.length} socio(s) · total ${clp(nm.total)} · guardada el ${fdatetime(nm.creado)}${nm.por ? ' por ' + esc(nm.por) : ''}</div></div>
      <div class="btn-row"><button class="btn sm" data-act="ac-hist-ver" data-id="${nm.id}">Ver</button><button class="btn sm" data-act="ac-hist-word" data-id="${nm.id}">📄 Word</button></div></div>`).join('') : '<div class="empty">Aún no hay planillas guardadas. Se guardan al descargar la nómina en Word.</div>'}
  </div>`;
}

/* ---------- Mismo monto a todos ---------- */
ACT['ac-todos'] = ()=>{
  const v = parseMonto(($('#acTodos') || {}).value);
  const mes = ui.planMes;
  const filas = acuerdoFilas(mes).filter(r=> !(r.a && r.a.pagoId) && r.c.deuda > 0);
  if(!filas.length) return;
  let topados = 0;
  filas.forEach(r=>{
    const m = Math.min(v, r.c.deuda); if(v > r.c.deuda) topados++;
    const a = acuerdoDe(r.s.id, mes);
    if(!m){ if(a){ a.del = true; a.u = now(); } return; }
    if(a){ a.monto = m; a.por = yo(); a.u = now(); a.del = false; }
    else S.acuerdos.push({ id: 'ac-' + r.s.id + '-' + mes, socioId: r.s.id, mes, monto: m, por: yo(), u: now() });
  });
  changed();
  toast(v ? `✓ ${clp(v)} a ${filas.length} socio(s)${topados ? ` · ${topados} con el máximo de su deuda` : ''}` : '✓ Montos borrados', 'ok');
};

/* =====================================================================
   VISTA: PAGOS
   ===================================================================== */
VIEWS.pagos = function(){
  const all = live('pagos').slice().sort((a, b)=> (b.fecha || '').localeCompare(a.fecha || '') || b.u - a.u);
  const mesesSet = new Set(all.map(p=> (p.fecha || '').slice(0, 7)).filter(Boolean)); mesesSet.add(curYm());
  const meses = Array.from(mesesSet).sort().reverse();
  const q = normTxt(ui.pagosBusca);
  const list = all.filter(p=>{
    if(ui.pagosMes !== 'todos' && (p.fecha || '').slice(0, 7) !== ui.pagosMes) return false;
    if(q){ const s = getById('socios', p.socioId); if(!s || !normTxt(s.nombre + ' ' + (s.rut || '')).includes(q)) return false; }
    return true;
  });
  const total = list.reduce((a, p)=> a + (Number(p.monto) || 0), 0);
  const porMedio = {};
  list.forEach(p=> porMedio[p.medio || 'Otro'] = (porMedio[p.medio || 'Otro'] || 0) + (Number(p.monto) || 0));
  return `
  <div class="quick">
    <button class="btn primary" data-act="nuevo-pago">💵 Registrar pago</button>
    <button class="btn" data-act="pago-masivo">🗂️ Pago masivo del mes</button>
    <button class="btn" data-act="excel">📊 Exportar a Excel</button>
  </div>
  <div class="card">
    <div class="card-head"><h2>Pagos registrados</h2></div>
    <div class="toolbar">
      <select id="gMes"><option value="todos">Todos los meses</option>${meses.map(m=> `<option value="${m}" ${ui.pagosMes === m ? 'selected' : ''}>${esc(mesLabelCap(m))}</option>`).join('')}</select>
      <input type="search" id="gBusca" placeholder="Filtrar por socio…" value="${esc(ui.pagosBusca)}">
    </div>
    <div class="note"><b>${list.length}</b> pago(s) · Total <b>${clp(total)}</b>${Object.keys(porMedio).length > 1 ? ' · ' + Object.entries(porMedio).map(([k, v])=> esc(k) + ': ' + clp(v)).join(' · ') : ''}</div>
    ${list.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Fecha</th><th>Socio</th><th class="r">Monto</th><th>Medio</th><th>Registró</th><th></th></tr></thead><tbody>
      ${list.slice(0, 400).map(p=>{ const s = getById('socios', p.socioId); return `<tr>
        <td style="white-space:nowrap">${fdate(p.fecha)}</td>
        <td>${s ? `<a href="#" data-act="ficha" data-id="${s.id}">${nombreHtml(s, { chip: false })}</a>` : '<span class="dim">(eliminado)</span>'}${p.obs ? `<div class="tiny dim">${esc(p.obs)}</div>` : ''}</td>
        <td class="r"><b>${clp(p.monto)}</b></td><td class="small">${esc(p.medio || '')}</td><td class="small dim">${esc(p.por || '')}</td>
        <td class="r"><button class="btn ghost sm" data-act="editar-pago" data-id="${p.id}" title="Editar">✏️</button></td></tr>`; }).join('')}
    </tbody></table></div>${list.length > 400 ? '<div class="dim small" style="margin-top:6px">Se muestran los 400 más recientes. Usa el filtro por mes o exporta a Excel.</div>' : ''}` : `<div class="empty">No hay pagos con ese filtro.</div>`}
  </div>`;
};
VIEWS.pagos.mount = function(v){
  $('#gMes', v).onchange = e=>{ ui.pagosMes = e.target.value; renderView(); };
  const b = $('#gBusca', v);
  b.addEventListener('input', ()=>{ ui.pagosBusca = b.value; const pos = b.selectionStart; renderView(); const n = $('#gBusca'); n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} });
};

/* =====================================================================
   VISTA: CUOTAS (valor, vencimiento, cobros extraordinarios, recaudación)
   ===================================================================== */
VIEWS.cuotas = function(){
  const tarifas = live('tarifas').sort((a, b)=> ymToIdx(b.desde) - ymToIdx(a.desde));
  const cobros = live('cobros').sort((a, b)=> ymToIdx(b.mes) - ymToIdx(a.mes));
  // recaudación de los últimos 12 meses
  const cur = ymToIdx(curYm());
  const socios = live('socios');
  const filas = [];
  for(let i = cur; i > cur - 12; i--){
    const ym = idxToYm(i);
    let esperado = 0, cubierto = 0;
    socios.forEach(s=>{ cuentaSocio(s, cur).items.filter(it=> it.mes === ym && it.monto > 0).forEach(it=>{ esperado += it.monto; cubierto += it.pagado || 0; }); });
    const recaudado = live('pagos').filter(p=> (p.fecha || '').slice(0, 7) === ym).reduce((a, p)=> a + (Number(p.monto) || 0), 0);
    filas.push({ ym, esperado, cubierto, recaudado });
  }
  return `
  <div class="card">
    <h2>Valor de la cuota mensual</h2>
    <p class="dim small">Si la cuota cambia, agrega el nuevo valor indicando desde qué mes rige. Los meses anteriores conservan su valor.</p>
    ${tarifas.length ? tarifas.map((t, i)=> `<div class="row"><div class="main"><div class="title">${clp(t.monto)}</div><div class="sub">Desde ${esc(mesLabel(t.desde))}${i === 0 ? ' · vigente' : ''}</div></div><button class="btn ghost sm" data-act="borrar-tarifa" data-id="${t.id}" title="Quitar">🗑️</button></div>`).join('') : '<div class="empty">Aún no hay valor de cuota.</div>'}
    <div class="grid3" style="margin-top:10px">
      <label class="f">Nuevo valor ($)<input id="tMonto" inputmode="numeric" placeholder="Ej: 6.000"></label>
      <label class="f">Rige desde<input id="tDesde" type="month" value="${idxToYm(cur + 1)}"></label>
      <div style="display:flex;align-items:flex-end"><button class="btn primary" data-act="nueva-tarifa" style="width:100%">Agregar valor</button></div>
    </div>
  </div>
  <div class="card">
    <h2>Vencimiento y socios nuevos</h2>
    <div class="grid2">
      <label class="f">Día de vencimiento de cada mes<input id="cDia" type="number" min="1" max="28" value="${diaVenc()}"></label>
      <label class="f">Mes de inicio por defecto para socios nuevos<input id="cIni" type="month" value="${esc(S.config.mesInicioDefault || curYm())}"></label>
    </div>
    <p class="dim small">Antes del día de vencimiento, la cuota del mes en curso aparece como "por vencer" y no cuenta como deuda.</p>
    <button class="btn" data-act="guardar-venc">Guardar</button>
  </div>
  <div class="card">
    <div class="card-head"><h2>Cobros extraordinarios</h2><button class="btn primary sm" data-act="nuevo-cobro">+ Nuevo cobro</button></div>
    <p class="dim small">Ej: aporte para un evento, cuota extraordinaria acordada en asamblea. Se suma a la deuda de los socios indicados.</p>
    ${cobros.length ? cobros.map(c=>{
      const n = c.socios === 'todos' ? live('socios').filter(s=> { const i = ymToIdx(c.mes); return ymToIdx(socioInicio(s)) <= i && (!s.mesTermino || ymToIdx(s.mesTermino) >= i); }).length : (c.socios || []).length;
      let pagados = 0; live('socios').forEach(s=>{ const it = cuentaSocio(s, ymToIdx(c.mes)).items.find(x=> x.ref === c.id); if(it && it.estado === 'pagado') pagados++; });

};
ACT['nueva-tarifa'] = ()=>{

  if(monto <= 0 || !desde){ toast('Indica el valor y el mes desde el que rige.', 'bad'); return; }
  const ex = live('tarifas').find(t=> t.desde === desde);
  if(ex){ ex.monto = monto; upsert('tarifas', ex); } else upsert('tarifas', { id: uid(), desde, monto });
  toast('✓ Valor de cuota guardado', 'ok');
};
ACT['borrar-tarifa'] = async el=>{
  if(live('tarifas').length === 1){ toast('Debe quedar al menos un valor de cuota.', 'bad'); return; }
  if(!await confirmar('¿Quitar este valor de cuota? La deuda de todos los socios se recalculará con los valores restantes.', 'Quitar', true)) return;

ACT['guardar-venc'] = ()=>{

function openCobro(id){
  const c = id ? Object.assign({}, getById('cobros', id)) : { id: uid(), concepto: '', monto: 0, mes: curYm(), socios: 'todos' };
  const st = { todos: c.socios === 'todos', sel: new Set(Array.isArray(c.socios) ? c.socios : []), busca: '' };
  const m = openModal({
    title: ()=> id ? 'Editar cobro extraordinario' : 'Nuevo cobro extraordinario',
    body: ()=> `<div class="grid3">
        <label class="f span2" style="grid-column:span 2">Concepto<input id="kCon" value="${esc(c.concepto)}" placeholder="Ej: Aporte aniversario"></label>
        <label class="f">Monto por socio ($)<input id="kMonto" inputmode="numeric" value="${c.monto ? miles(c.monto) : ''}"></label>
        <label class="f">Mes del cobro<input id="kMes" type="month" value="${esc(c.mes)}"></label>
      </div>
      <div class="seg" id="kA" style="margin-top:12px"><button type="button" data-v="1" class="${st.todos ? 'active' : ''}">Todos los socios activos</button><button type="button" data-v="0" class="${!st.todos ? 'active' : ''}">Elegir socios</button></div>
      ${st.todos ? '' : `<div style="margin-top:10px">${sociosOrdenados().filter(socioActivo).map(s=> `<label class="check" style="padding:5px 0"><input type="checkbox" class="kChk" value="${s.id}" ${st.sel.has(s.id) ? 'checked' : ''}> ${esc(s.nombre)}</label>`).join('')}</div>`}`,
    foot: ()=> `${id ? '<button class="btn danger" id="kDel">Eliminar</button><span style="flex:1"></span>' : ''}<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="kOk">Guardar</button>`,
    onMount: (el)=>{
      const keep = ()=>{ c.concepto = $('#kCon', el).value; c.monto = parseMonto($('#kMonto', el).value); c.mes = $('#kMes', el).value; $$('.kChk', el).forEach(x=> x.checked ? st.sel.add(x.value) : st.sel.delete(x.value)); };
      $('#kA', el).onclick = e=>{ const b = e.target.closest('button[data-v]'); if(b){ keep(); st.todos = b.dataset.v === '1'; drawModal(m); } };
      $('#kOk', el).onclick = ()=>{
        keep();
        if(!c.concepto.trim() || c.monto <= 0 || !c.mes){ toast('Completa concepto, monto y mes.', 'bad'); return; }
        if(!st.todos && !st.sel.size){ toast('Elige al menos un socio.', 'bad'); return; }
        c.concepto = c.concepto.trim();
        c.socios = st.todos ? 'todos' : Array.from(st.sel);
        closeModal(); upsert('cobros', c); toast('✓ Cobro guardado', 'ok');
      };
      const d = $('#kDel', el);
      if(d) d.onclick = async ()=>{ if(!await confirmar('¿Eliminar este cobro? Se quitará de la deuda de todos los socios (los pagos ya hechos quedarán como abono a otras cuotas).', 'Eliminar', true)) return; closeModal(); removeRec('cobros', id); };
    },
  });
}
ACT['nuevo-cobro'] = ()=> openCobro(null);
ACT['editar-cobro'] = el=> openCobro(el.dataset.id);

VIEWS.portal.mount = function(v){

};
ACT['publicar'] = async el=>{
  el.disabled = true;
  const prog = $('#pubProg');

    await syncNow({ silent: true });

   EXCEL
   ===================================================================== */
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=> res(window.XLSX); sc.onerror = ()=> rej(new Error('No se pudo cargar el generador de Excel (¿sin internet?).'));
    document.head.appendChild(sc);
  });
}
ACT['excel'] = async ()=>{
  try{
    const XLSX = await loadXLSX();
    const wb = XLSX.utils.book_new();
    const socios = sociosOrdenados();
    const res = socios.map(s=>{ const c = cuentaSocio(s); return { 'Nombre': s.nombre, 'RUT': s.rut ? formatRut(s.rut) : '', 'Socio desde': mesLabelCap(socioInicio(s)), 'Retiro': s.mesTermino ? mesLabelCap(s.mesTermino) : '', 'Estado': c.deuda > 0 ? 'Con deuda' : 'Al día', 'N° meses adeudados': c.mesesAdeudados.length, 'Meses adeudados': c.mesesAdeudados.map(m=> mesLabel(m, true)).join(', '), 'Deuda vencida': c.deuda, 'Saldo a favor': c.saldoFavor, 'Total pagado': c.totalPagos, 'Último pago': c.ultimoPago ? fdate(c.ultimoPago.fecha) : '', 'Teléfono': s.telefono || '', 'Correo': s.email || '' }; });
    const ws1 = XLSX.utils.json_to_sheet(res);
    ws1['!cols'] = [{ wch: 32 }, { wch: 13 }, { wch: 16 }, { wch: 14 }, { wch: 11 }, { wch: 10 }, { wch: 40 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 26 }];
    XLSX.utils.book_append_sheet(wb, ws1, 'Resumen socios');
    const pagos = live('pagos').slice().sort((a, b)=> (a.fecha || '').localeCompare(b.fecha || '')).map(p=>{ const s = getById('socios', p.socioId); return { 'Fecha': fdate(p.fecha), 'Socio': s ? s.nombre : '(eliminado)', 'RUT': s && s.rut ? formatRut(s.rut) : '', 'Monto': Number(p.monto) || 0, 'Medio': p.medio || '', 'Observación': p.obs || '', 'Registró': p.por || '' }; });
    const ws2 = XLSX.utils.json_to_sheet(pagos.length ? pagos : [{ 'Fecha': '', 'Socio': '', 'Monto': '' }]);
    ws2['!cols'] = [{ wch: 11 }, { wch: 32 }, { wch: 13 }, { wch: 10 }, { wch: 22 }, { wch: 30 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, ws2, 'Pagos');
    const y = new Date().getFullYear();
    [y, y - 1].forEach(yr=>{
      const rows = socios.filter(s=> ymToIdx(socioInicio(s)) <= ymToIdx(yr + '-12')).map(s=>{ const r = { 'Nombre': s.nombre }; estadoMeses(s, yr).forEach(m=> r[MESES_C[Number(m.ym.slice(5)) - 1]] = m.txt); r['Deuda vencida total'] = cuentaSocio(s).deuda; return r; });
      if(rows.length){ const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [{ wch: 32 }].concat(Array(12).fill({ wch: 13 })).concat([{ wch: 14 }]); XLSX.utils.book_append_sheet(wb, ws, 'Cuotas ' + yr); }
    });
    const cob = live('cobros').map(c=> ({ 'Mes': mesLabelCap(c.mes), 'Concepto': c.concepto, 'Monto por socio': Number(c.monto) || 0, 'Aplica a': c.socios === 'todos' ? 'Todos' : (c.socios || []).map(id=> (getById('socios', id) || {}).nombre).filter(Boolean).join(', ') }));
    if(cob.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cob), 'Cobros extraordinarios');
    XLSX.writeFile(wb, `cuotas-${normTxt(S.config.nombre || 'sindicato').replace(/[^a-z0-9]+/g, '-').slice(0, 30)}-${todayISO()}.xlsx`);
  }catch(e){ toast('⚠ ' + (e.message || e), 'bad'); }
};

/* =====================================================================
   GOOGLE DRIVE (sincronización con tu cuenta de Google)
   Guarda una copia de los datos en la carpeta privada de la app dentro de
   tu Google Drive (no se ve en "Mi unidad" y nadie más puede leerla).
   Sirve para tener los mismos datos en tu computador y tu celular con tu
   correo. Para compartir con otros dirigentes se usa el repositorio.
   ===================================================================== */
const GD_DEFAULT_CLIENT_ID = '305499160088-dk14k2puhdaso68o8hv7500kkct5savn.apps.googleusercontent.com';
const GD_FILE = 'cuotas-sindicato-data.json';
const GD_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
function gdClientId(){ return lsGet('cs_gd_client', '') || GD_DEFAULT_CLIENT_ID; }
function gdToken(){ try{ return JSON.parse(lsGet('cs_gd_token', 'null') || 'null'); }catch(e){ return null; } }
function gdTokenValid(){ const t = gdToken(); return !!(t && t.access_token && Date.now() < t.expires_at - 60000); }
function gdEnabled(){ return lsGet('cs_gd_on', '0') === '1'; }
function gdEmail(){ return lsGet('cs_gd_email', ''); }
let gdState = { st: 'off', msg: '', at: Number(lsGet('cs_gd_last', '0')) || 0 };
let gdTimer = null, gdRunning = null, gdAgain = false, gdTokenClient = null;

function gdLoadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = ()=> res(); s.onerror = ()=> rej(new Error('No se pudo cargar el inicio de sesión de Google (¿sin internet?).'));
    document.head.appendChild(s);
  });
}
/* Pide permiso a Google. Debe llamarse desde un toque del usuario (abre una ventana). */
async function gdLogin(forceConsent){
  await gdLoadGis();
  return new Promise((resolve, reject)=>{
    gdTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(),
      scope: GD_SCOPE,
      callback: async (resp)=>{
        if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
        lsSet('cs_gd_token', JSON.stringify({ access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600) * 1000 }));
        try{
          const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } });
          const u = await r.json();
          if(u.email) lsSet('cs_gd_email', u.email);
        }catch(e){}
        lsSet('cs_gd_on', '1');
        resolve();
      },
      error_callback: (err)=> reject(new Error(err && err.type === 'popup_closed' ? 'Se cerró la ventana de Google antes de terminar.' : 'Google no permitió el inicio de sesión.')),
    });
    gdTokenClient.requestAccessToken({ prompt: forceConsent || !gdEmail() ? 'consent' : '', login_hint: gdEmail() || undefined });
  });
}
async function gdFetch(url, opts){
  const t = gdToken();
  const res = await fetch(url, Object.assign({}, opts || {}, { headers: Object.assign({ Authorization: 'Bearer ' + (t && t.access_token) }, (opts && opts.headers) || {}) }));
  if(res.status === 401){ lsSet('cs_gd_token', null); throw Object.assign(new Error('La sesión de Google venció. Toca "Reconectar Google Drive".'), { auth: true }); }
  if(!res.ok){ let m = ''; try{ m = (await res.json()).error.message; }catch(e){} throw new Error('Error de Google Drive (' + res.status + ')' + (m ? ': ' + m : '')); }
  return res;
}
async function gdFindFile(){
  const q = encodeURIComponent(`name='${GD_FILE}'`);
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const j = await r.json();
  return (j.files && j.files[0]) || null;
}
async function gdDownload(id){ const r = await gdFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); return r.json(); }
async function gdUpload(id, obj){
  const body = JSON.stringify(obj);
  if(id){
    await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    return id;
  }
  const boundary = 'cs' + Math.random().toString(36).slice(2);
  const meta = { name: GD_FILE, parents: ['appDataFolder'], mimeType: 'application/json' };
  const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const r = await gdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
  return (await r.json()).id;
}
function gdSet(st, msg){ gdState.st = st; gdState.msg = msg || ''; if(st === 'ok'){ gdState.at = now(); lsSet('cs_gd_last', String(gdState.at)); } updateChip(); }
async function gdSyncNow(opts){
  if(!gdEnabled()) return false;
  if(!gdTokenValid()){ gdSet('auth', 'Hay que volver a conectar Google Drive.'); return false; }
  if(!navigator.onLine){ gdSet('error', 'Sin conexión a internet.'); return false; }
  if(gdRunning){ gdAgain = true; return gdRunning; }
  gdRunning = (async ()=>{
    gdSet('busy');
    const seq = changeSeq;
    const before = canonical(S);
    try{
      const f = await gdFindFile();
      let remote = null;
      if(f){ const data = await gdDownload(f.id); remote = normalizeState(data && data.datos ? data.datos : data); }
      S = remote ? mergeStates(S, remote) : normalizeState(S);
      saveLocal();
      if(!remote || canonical(S) !== canonical(remote)){
        await gdUpload(f && f.id, { app: 'cuotas-sindicales-drive', actualizado: new Date().toISOString(), datos: S });
      }
      if(changeSeq === seq && !connected()) lsSet('cs_dirty', '0');
      gdSet('ok');
      invalidate();
      if(canonical(S) !== before) softRender();
      return true;
    }catch(e){
      gdSet(e.auth ? 'auth' : 'error', e.message || String(e));
      if(!(opts && opts.silent)) toast('⚠ ' + (e.message || e), 'bad');
      return false;
    }finally{
      gdRunning = null;
      if(gdAgain){ gdAgain = false; gdSchedule(400); }
    }
  })();
  return gdRunning;
}
function gdSchedule(delay){ if(!gdEnabled()) return; clearTimeout(gdTimer); gdTimer = setTimeout(()=> gdSyncNow({ silent: true }), delay == null ? 2000 : delay); }

/* Se engancha a los cambios y al indicador de sincronización */
const _scheduleSyncGh = scheduleSync;
scheduleSync = function(delay){ _scheduleSyncGh(delay); gdSchedule(delay == null ? 2000 : delay + 300); };
const _updateChipGh = updateChip;
updateChip = function(){
  _updateChipGh();
  const el = $('#syncChip'); if(!el || connected() || !gdEnabled()) return;
  el.className = 'sync-chip';
  if(gdState.st === 'busy'){ el.classList.add('busy'); el.textContent = '⟳ Drive…'; }
  else if(gdState.st === 'auth'){ el.classList.add('bad'); el.textContent = '⚠ Reconectar Drive'; }
  else if(gdState.st === 'error'){ el.classList.add('bad'); el.textContent = '⚠ Drive sin sincronizar'; el.title = gdState.msg; }
  else { el.classList.add('ok'); el.textContent = '✓ Drive'; el.title = gdEmail() + (gdState.at ? ' · ' + fdatetime(gdState.at) : ''); }
};
ACT['sync-now'] = async ()=>{
  if(connected()) syncNow();
  if(gdEnabled()){
    if(!gdTokenValid()){ try{ await gdLogin(false); }catch(e){ toast('⚠ ' + e.message, 'bad'); return; } }
    gdSyncNow();
  }
  if(!connected() && !gdEnabled()){ goTab('ajustes'); toast('Conecta Google Drive o el repositorio para no depender de este equipo.'); }
};

ACT['gd-desconectar'] = async ()=>{
  if(!await confirmar('¿Desconectar Google Drive en este equipo? Los datos quedan en este equipo y en tu Drive, pero dejarán de sincronizarse aquí.', 'Desconectar', true)) return;
  const t = gdToken();
  try{ if(t && window.google && google.accounts) google.accounts.oauth2.revoke(t.access_token, ()=>{}); }catch(e){}
  ['cs_gd_token', 'cs_gd_on'].forEach(k=> lsSet(k, null));

ACT['gd-client'] = ()=>{
  const v = prompt('Client ID de Google (déjalo vacío para usar el predeterminado):', lsGet('cs_gd_client', ''));
  if(v === null) return;
  lsSet('cs_gd_client', v.trim() || null); lsSet('cs_gd_token', null); renderView();
};
function gdCardHtml(){
  const on = gdEnabled(), valid = gdTokenValid();
  return `<div class="card">
    <h2>Google Drive (tu correo)</h2>
    ${on ? `
      <div class="note ${gdState.st === 'error' || gdState.st === 'auth' || !valid ? 'warn' : 'ok'}">${valid ? '✓' : '⚠'} Conectado con <b>${esc(gdEmail() || 'tu cuenta de Google')}</b>. ${gdState.at ? 'Última sincronización: ' + fdatetime(gdState.at) + '.' : ''} ${!valid ? 'La sesión de Google venció: toca "Reconectar".' : ''}${gdState.st === 'error' ? ' ' + esc(gdState.msg) : ''}</div>
      <div class="btn-row"><button class="btn primary" data-act="gd-conectar">${valid ? '⟳ Sincronizar ahora' : '🔑 Reconectar Google Drive'}</button><button class="btn danger" data-act="gd-desconectar">Desconectar</button></div>` : `
      <p class="dim small">Guarda una copia automática en tu Google Drive y tendrás los mismos datos en tu computador y en tu celular, entrando con tu correo. Es tu copia personal: no se ve en "Mi unidad" ni la pueden leer otros.</p>
      <div class="btn-row"><button class="btn primary" data-act="gd-conectar">🔗 Conectar Google Drive</button></div>`}
    <details class="adv" style="margin-top:10px"><summary>Opciones avanzadas</summary>
      <p class="dim tiny">Client ID actual: ${esc(gdClientId())}</p><button class="btn sm" data-act="gd-client">Cambiar Client ID</button></details>
  </div>`;
}
/* Agrega la tarjeta de Drive en Ajustes, antes de "Compartir con otros dirigentes" */
const _viewAjustes = VIEWS.ajustes, _mountAjustes = VIEWS.ajustes.mount;
VIEWS.ajustes = function(){ const h = _viewAjustes(); const i = h.indexOf('<div class="card">', 10); return i > 0 ? h.slice(0, i) + gdCardHtml() + h.slice(i) : h + gdCardHtml(); };
VIEWS.ajustes.mount = _mountAjustes;
/* Al abrir la app: sincroniza si la sesión de Google sigue vigente */
if(gdEnabled()){ if(gdTokenValid()) setTimeout(()=> gdSyncNow({ silent: true }), 600); else gdSet('auth'); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && gdEnabled() && gdTokenValid()) gdSchedule(500); });
setInterval(()=>{ if(document.visibilityState === 'visible' && gdEnabled() && gdTokenValid() && !gdRunning) gdSyncNow({ silent: true }); }, 120000);
renderView();

</script>
</body>
</html>
