/* ---------- Crear / ver plan ---------- */
function planCalendario(p){
  const out = []; const n = Number(p.cuotas) || 1;
  for(let k = 1; k <= n; k++){ const mes = idxToYm(ymToIdx(p.inicio) + k - 1); const ab = planAbono(p, k); const cu = p.incluyeCuota ? tarifaDe(mes) : 0; out.push({ k, mes, ab, cu, tot: ab + cu }); }
  return out;
}
function openPlanForm(socioId){
  const st = { socioId: socioId || null, busca: '', cuotas: 6, monto: 0, inicio: idxToYm(ymToIdx(curYm()) + 1), incluyeCuota: true, modo: 'cuotas' };
  // Deuda que cubre el plan. Si el plan descuenta también la cuota del mes, las cuotas de los meses
  // del plan que ya vencieron se pagan con esa cuota y no se cuentan dos veces.
  const deudaDe = sid=>{
    const s = getById('socios', sid); if(!s) return 0;
    const c = cuentaSocio(s);
    if(!st.incluyeCuota) return c.deuda;
    const ini = ymToIdx(st.inicio);
    const dup = c.items.filter(it=> it.tipo === 'cuota' && it.vencido && it.idx >= ini).reduce((a, it)=> a + (it.monto - (it.pagado || 0)), 0);
    return Math.max(0, c.deuda - dup);
  };
  const recalc = ()=>{
    const d = deudaDe(st.socioId);
    if(st.modo === 'cuotas'){ st.cuotas = Math.max(1, Math.min(36, st.cuotas || 1)); st.monto = Math.ceil(d / st.cuotas / 100) * 100; }
    else { st.monto = Math.max(100, st.monto || 0); st.cuotas = Math.max(1, Math.ceil(d / st.monto)); }
  };
  const m = openModal({
    wide: true,
    title: ()=> 'Nuevo plan de pago',
    body: ()=>{
      const s = st.socioId ? getById('socios', st.socioId) : null;
      if(!s){
        const deudores = sociosOrdenados().map(x=> ({ x, c: cuentaSocio(x) })).filter(o=> o.c.deuda > 0 && !planActivoDe(o.x.id) && (!st.busca || normTxt(o.x.nombre).includes(normTxt(st.busca))));
        return `<label class="f">Socio con deuda<input id="npBusca" type="search" placeholder="Buscar…" value="${esc(st.busca)}" autocomplete="off"></label>
          <div class="picker-list">${deudores.length ? deudores.map(o=> `<button type="button" data-sid="${o.x.id}"><span><b>${esc(o.x.nombre)}</b> <span class="dim small">${o.c.mesesAdeudados.length} meses</span></span><span class="val bad">${clp(o.c.deuda)}</span></button>`).join('') : '<div class="empty">No hay socios con deuda sin plan activo.</div>'}</div>`;
      }
      recalc();
      const d = deudaDe(s.id);
      const p = { inicio: st.inicio, cuotas: st.cuotas, montoCuota: st.monto, deudaInicial: d, incluyeCuota: st.incluyeCuota };
      const cal = planCalendario(p);
      const prom = cal.reduce((a, c)=> a + c.tot, 0) / cal.length;
      return `<div class="sel-socio"><div><div style="font-weight:800">${esc(s.nombre)}</div><div class="small">Deuda vencida a la fecha: <b>${clp(cuentaSocio(s).deuda)}</b>${d !== cuentaSocio(s).deuda ? ` · el plan cubre <b>${clp(d)}</b> (la cuota de ${esc(mesLabel(st.inicio))} se descuenta aparte)` : ''}${cuentaSocio(s).mesesAdeudados.length ? ' · ' + esc(mesesTxt(cuentaSocio(s).mesesAdeudados)) : ''}</div></div>${socioId ? '' : '<button class="btn sm" id="npCambiar">Cambiar</button>'}</div>
        <div class="seg" id="npModo" style="margin-top:12px"><button type="button" data-m="cuotas" class="${st.modo === 'cuotas' ? 'active' : ''}">Por número de cuotas</button><button type="button" data-m="monto" class="${st.modo === 'monto' ? 'active' : ''}">Por monto mensual</button></div>
        <div class="grid3" style="margin-top:10px">
          ${st.modo === 'cuotas' ? `<label class="f">N° de cuotas<input id="npN" type="number" min="1" max="36" value="${st.cuotas}"></label>` : `<label class="f">Abono mensual ($)<input id="npM" inputmode="numeric" value="${miles(st.monto)}"></label>`}
          <label class="f">Primer descuento<input id="npIni" type="month" value="${esc(st.inicio)}"></label>
          <label class="check" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="npInc" ${st.incluyeCuota ? 'checked' : ''}> Descontar también la cuota del mes</label>
        </div>
        <div class="preview"><b>${st.cuotas} cuota${st.cuotas > 1 ? 's' : ''}</b> de ${clp(st.monto)}${cal.length > 1 && cal[cal.length - 1].ab !== st.monto ? ` (la última de ${clp(cal[cal.length - 1].ab)})` : ''}${st.incluyeCuota ? ` + cuota mensual · descuento total aprox. <b>${clp(prom)}</b> al mes` : ''}. Termina en ${esc(mesLabel(cal[cal.length - 1].mes))}.</div>
        <div class="table-wrap" style="margin-top:10px;max-height:34vh;overflow:auto"><table class="t"><thead><tr><th>Cuota</th><th>Mes</th><th class="r">Abono deuda</th><th class="r">Cuota del mes</th><th class="r">Total a descontar</th></tr></thead><tbody>
          ${cal.map(c=> `<tr><td>${c.k}</td><td>${esc(mesLabelCap(c.mes))}</td><td class="r">${clp(c.ab)}</td><td class="r">${c.cu ? clp(c.cu) : '—'}</td><td class="r"><b>${clp(c.tot)}</b></td></tr>`).join('')}
        </tbody></table></div>
        <label class="f" style="margin-top:10px">Notas (opcional)<input id="npNotas" placeholder="Ej: acordado en reunión del 28/10"></label>
        <div class="note small">Cada mes el descuento debe autorizarse. Si un mes no se autoriza, esa cuota se corre al mes siguiente. La deuda baja cuando marcas el mes como <b>Descontado</b>.</div>`;
    },
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button>${st.socioId ? '<button class="btn primary" id="npOk">Crear plan</button>' : ''}`,
    onMount: (el)=>{
      const b = $('#npBusca', el);
      if(b){ b.focus(); b.oninput = ()=>{ st.busca = b.value; const pos = b.selectionStart; drawModal(m); const n2 = $('#npBusca', m.el); n2.focus(); try{ n2.setSelectionRange(pos, pos); }catch(e){} }; }
      $$('.picker-list button[data-sid]', el).forEach(x=> x.onclick = ()=>{ st.socioId = x.dataset.sid; drawModal(m); });
      const c = $('#npCambiar', el); if(c) c.onclick = ()=>{ st.socioId = null; drawModal(m); };
      const md = $('#npModo', el); if(md) md.onclick = e=>{ const x = e.target.closest('button[data-m]'); if(x){ st.modo = x.dataset.m; drawModal(m); } };
      const n = $('#npN', el); if(n) n.onchange = ()=>{ st.cuotas = parseInt(n.value, 10) || 1; drawModal(m); };
      const mo = $('#npM', el); if(mo) mo.onchange = ()=>{ st.monto = parseMonto(mo.value); drawModal(m); };
      const ini = $('#npIni', el); if(ini) ini.onchange = ()=>{ st.inicio = ini.value || st.inicio; drawModal(m); };
      const inc = $('#npInc', el); if(inc) inc.onchange = ()=>{ st.incluyeCuota = inc.checked; drawModal(m); };
      const ok = $('#npOk', el);
      if(ok) ok.onclick = ()=>{
        recalc();
        const d = deudaDe(st.socioId);
        if(d <= 0){ toast('Este socio no tiene deuda vencida.', 'bad'); return; }
        const s = getById('socios', st.socioId);
        closeModal();
        upsert('planes', { id: uid(), socioId: st.socioId, inicio: st.inicio, cuotas: st.cuotas, montoCuota: st.monto, deudaInicial: d, incluyeCuota: st.incluyeCuota, notas: ($('#npNotas', el) || {}).value || '', creado: now(), por: yo() });
        toast(`✓ Plan creado para ${s.nombre}: ${st.cuotas} cuotas de ${clp(st.monto)}`, 'ok');
        refreshOpenModal();
      };
    },
  });
}
ACT['nuevo-plan'] = el=> openPlanForm(el.dataset.id || null);
ACT['ver-plan'] = el=>{
  const id = el.dataset.id;
  openModal({
    live: true, wide: true,
    title: ()=>{ const p = getById('planes', id); const s = p && getById('socios', p.socioId); return 'Plan de pago · ' + esc(s ? s.nombre : ''); },
    body: ()=>{
      const p = getById('planes', id); if(!p) return '<div class="empty">Plan eliminado.</div>';
      const r = planResumen(p);
      const ms = planMarcas(p);
      const filas = []; let k = 0, i = ymToIdx(p.inicio);
      while(k < r.n && filas.length < 60){
        const mes = idxToYm(i), mk = ms.find(a=> a.mes === mes);
        if(mk && mk.estado === 'rechazado'){ filas.push({ mes, k: null, mk }); }
        else { k++; filas.push({ mes, k, mk, ab: planAbono(p, k), cu: p.incluyeCuota ? tarifaDe(mes) : 0 }); }
        i++;
      }
      return `<div class="tiles">
        <div class="tile"><div class="num">${clp(p.deudaInicial)}</div><div class="lbl">Deuda del plan</div></div>
        <div class="tile"><div class="num ok">${r.pagadas} / ${r.n}</div><div class="lbl">Cuotas descontadas</div></div>
        <div class="tile"><div class="num">${clp(r.abonado)}</div><div class="lbl">Abonado</div></div>
        <div class="tile"><div class="num ${r.saldo ? 'bad' : 'ok'}">${clp(r.saldo)}</div><div class="lbl">Saldo del plan</div></div></div>
        ${p.notas ? `<div class="note small">${esc(p.notas)}</div>` : ''}
        <div class="table-wrap"><table class="t"><thead><tr><th>Mes</th><th>Cuota</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>
        ${filas.map(f=> `<tr><td>${esc(mesLabelCap(f.mes))}</td><td>${f.k ? f.k + ' de ' + r.n : '—'}</td><td class="r">${f.k ? clp(f.ab + f.cu) : ''}</td><td>${f.mk ? `<span class="chip ${PLAN_EST[f.mk.estado].chip}">${PLAN_EST[f.mk.estado].lbl}</span>` : (ymToIdx(f.mes) < ymToIdx(curYm()) ? '<span class="chip warn">Sin marcar</span>' : '<span class="chip neutral">Pendiente</span>')}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note small">Creado ${p.creado ? fdatetime(p.creado) : ''}${p.por ? ' por ' + esc(p.por) : ''}. Los pagos de los meses descontados quedan registrados en el historial del socio.</div>`;
    },
    foot: ()=>{ const p = getById('planes', id); return `<button class="btn danger" id="vpDel">${p && p.anulado ? 'Eliminar plan' : 'Anular plan'}</button><span style="flex:1"></span><button class="btn" data-act="close-modal">Cerrar</button>`; },
    onMount: (el)=>{
      const d = $('#vpDel', el);
      if(d) d.onclick = async ()=>{
        const p = getById('planes', id);
        if(!p.anulado){
          if(!await confirmar('¿Anular este plan? Los meses ya descontados se mantienen como pagos. Los meses siguientes dejarán de aparecer.', 'Anular', true)) return;
          const x = Object.assign({}, p, { anulado: true }); upsert('planes', x); refreshOpenModal();
        } else {
          if(!await confirmar('¿Eliminar el plan? Los pagos ya registrados se mantienen.', 'Eliminar', true)) return;
          closeModal(); removeRec('planes', id);
        }
      };
    },
  });
};

/* =====================================================================
   ACUERDO DEL MES: lista de socios con deuda, cuánto acepta abonar cada
   uno ese mes, y nómina en Word para que firmen la autorización.
   ===================================================================== */
function acuerdoDe(sid, mes){ return live('acuerdos').find(a=> a.socioId === sid && a.mes === mes) || null; }
function acuerdoMontoSugerido(s, mes){
  const pl = planActivoDe(s.id);
  if(pl){ const m = planMontoMes(pl, mes); if(m.k) return m.abono; }
  return 0;
}
function acuerdoFilas(mes){
  const i = ymToIdx(mes);
  return sociosOrdenados().filter(s=> ymToIdx(socioInicio(s)) <= i && (!s.mesTermino || ymToIdx(s.mesTermino) >= i) || acuerdoDe(s.id, mes))
    .map(s=> ({ s, c: cuentaSocio(s), a: acuerdoDe(s.id, mes) }))
    .map(r=> Object.assign(r, { deuda: r.c.deuda + (r.a && r.a.pagoId ? r.a.monto : 0) }))
    .filter(r=> r.deuda > 0 || r.a);
}
ui.acSoloConMonto = ui.acSoloConMonto || false;
function acuerdoHtml(){
  const mes = ui.planMes;
  let filas = acuerdoFilas(mes);
  const conMonto = filas.filter(r=> r.a && r.a.monto > 0);
  const total = conMonto.reduce((t, r)=> t + r.a.monto, 0);
  const desc = conMonto.filter(r=> r.a.pagoId);
  if(ui.acSoloConMonto) filas = conMonto;
  return `<div class="card">
    <div class="card-head"><h2>Acuerdo de abonos · ${esc(mesLabelCap(mes))}</h2>
      <div class="btn-row"><button class="btn primary sm" data-act="ac-word" ${(ui.acBlanco ? acuerdoFilas(mes).length : conMonto.length) ? '' : 'disabled'}>📄 Guardar y descargar Word</button></div></div>
    <p class="dim small">Escribe cuánto acepta abonar cada socio a su deuda este mes (además de su cuota mensual). Se guarda solo. Para poner el mismo monto a todos, escríbelo y toca "Aplicar a todos" (a quien debe menos se le pone el total de su deuda; con 0 se borran los montos). Al descargar el Word, la planilla queda guardada en el historial.</p>
    <div class="toolbar">
      <input id="acTodos" inputmode="numeric" placeholder="Ej: 5.000" style="width:120px">
      <button class="btn sm" data-act="ac-todos">Aplicar a todos</button>
      <label class="check"><input type="checkbox" id="acSolo" ${ui.acSoloConMonto ? 'checked' : ''}> Solo con monto</label>
      <label class="check"><input type="checkbox" id="acBlanco" ${ui.acBlanco ? 'checked' : ''}> Word con abono en blanco (se llena a mano)</label>
      <span class="dim small" style="margin-left:auto">${conMonto.length} socio(s) · total <b>${clp(total)}</b>${desc.length ? ` · descontados ${desc.length}` : ''}</span>
    </div>
    ${filas.length ? `<div class="table-wrap"><table class="t" id="acTabla"><thead><tr><th>Socio</th><th class="r">Deuda vencida</th><th class="r" style="width:150px">Abona este mes</th></tr></thead><tbody>
      ${filas.map(r=>{
        const sug = acuerdoMontoSugerido(r.s, mes);
        const val = r.a ? r.a.monto : (sug || '');
        const pagado = !!(r.a && r.a.pagoId);
        return `<tr data-sid="${r.s.id}" class="${pagado ? 'done' : ''}"><td><a href="#" data-act="ficha" data-id="${r.s.id}"><b>${nombreHtml(r.s)}</b></a>${r.c.mesesAdeudados.length ? `<div class="tiny dim">${esc(mesesTxt(r.c.mesesAdeudados))}</div>` : ''}${!r.a && sug ? '<div class="tiny dim">Sugerido por su plan de pago</div>' : ''}</td>
          <td class="r val bad">${clp(r.deuda)}</td>
          <td class="r"><input class="acMonto" inputmode="numeric" value="${val ? miles(val) : ''}" placeholder="$0" style="text-align:right" ${pagado ? 'disabled' : ''}>${r.a && r.a.monto > 0 ? `<button type="button" class="pl-b ac-b ${pagado ? 'on descontado' : ''}" data-act="ac-desc" data-sid="${r.s.id}">💵 ${pagado ? 'Descontado' : 'Marcar descontado'}</button>` : ''}</td></tr>`;
      }).join('')}
    </tbody></table></div>` : `<div class="empty">No hay socios con deuda en ${esc(mesLabel(mes))}.</div>`}
  </div>`;
}
function acGuardar(sid, monto){
  const mes = ui.planMes;
  const a = acuerdoDe(sid, mes);
  if(a && a.pagoId) return;
  if(!monto){ if(a) removeRec('acuerdos', a.id, { noRender: true }); return; }
  upsert('acuerdos', Object.assign(a || { id: 'ac-' + sid + '-' + mes, socioId: sid, mes }, { monto, por: yo() }), { noRender: true });
}

/* ---------- Word ---------- */
function loadDocx(){
  if(window.docx) return Promise.resolve(window.docx);
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
    sc.onload = ()=> window.docx ? res(window.docx) : rej(new Error('No se pudo preparar Word.'));
    sc.onerror = ()=> rej(new Error('No se pudo cargar el generador de Word (¿sin internet?).'));
    document.head.appendChild(sc);
  });
}
/* Genera el Word a partir de una planilla guardada (snapshot) */
async function nominaWord(nm){
  const mes = nm.mes;
  const filas = nm.filas.map(f=> ({ s: { nombre: f.nombre, rut: f.rut }, deuda: f.deuda, a: { monto: f.monto } }));
  try{
    const D = await loadDocx();
    const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle, HeightRule, VerticalAlign, PageOrientation } = D;
    const F = 'Calibri', SZ = 22;
    const t = (txt, o)=> new TextRun(Object.assign({ text: String(txt), font: F, size: SZ }, o || {}));
    const p = (runs, o)=> new Paragraph(Object.assign({ children: Array.isArray(runs) ? runs : [runs] }, o || {}));
    const b = { style: BorderStyle.SINGLE, size: 4, color: '000000' };
    const borders = { top: b, bottom: b, left: b, right: b };
    // ancho útil carta horizontal con márgenes de 1,5 cm ≈ 15000 dxa
    const fe = nm.creado ? new Date(nm.creado) : new Date();
    const mesEmi = MESES[fe.getMonth()] + ' ' + fe.getFullYear();
    const W = [500, 3900, 1600, 1800, 2740];
    const cell = (content, i, o)=> new TableCell(Object.assign({ borders, width: { size: W[i], type: WidthType.DXA }, verticalAlign: VerticalAlign.CENTER, margins: { top: 40, bottom: 40, left: 80, right: 80 }, children: [p(content, { alignment: (o && o.align) || AlignmentType.LEFT })] }, (o && o.cell) || {}));
    const R = AlignmentType.RIGHT, C = AlignmentType.CENTER;
    const head = new TableRow({ tableHeader: true, children: [
      cell(t('N°', { bold: true }), 0, { align: C }), cell(t('Nombre', { bold: true }), 1), cell(t('RUT', { bold: true }), 2),
      cell(t('Abono ($)', { bold: true }), 3, { align: R }), cell(t('Firma', { bold: true }), 4, { align: C }) ] });
    const rows = filas.map((r, i)=> new TableRow({ height: { value: 500, rule: HeightRule.ATLEAST }, children: [
      cell(t(i + 1), 0, { align: C }), cell(t(r.s.nombre), 1), cell(t(r.s.rut ? formatRut(r.s.rut) : ''), 2),

function nominasDelMes(mes){ return live('nominas').filter(n=> n.mes === mes).sort((a, b)=> (a.creado || 0) - (b.creado || 0)); }
function guardarNomina(){
  const mes = ui.planMes;
  const blanco = !!ui.acBlanco;
  const filas = acuerdoFilas(mes).filter(r=> blanco || (r.a && r.a.monto > 0)).map(r=> ({ sid: r.s.id, nombre: r.s.nombre, rut: r.s.rut ? formatRut(r.s.rut) : '', deuda: r.deuda, monto: blanco ? null : r.a.monto }));
  if(!filas.length) return null;
  const n = nominasDelMes(mes).length + 1;
  const nm = { id: uid(), mes, n, creado: now(), por: yo(), filas, blanco, total: blanco ? null : filas.reduce((a, f)=> a + f.monto, 0) };
  upsert('nominas', nm, { noRender: true });
  return nm;
}

/* ---------- Mismo monto a todos ---------- */
ACT['ac-todos'] = ()=>{
  const v = parseMonto(($('#acTodos') || {}).value);
  const mes = ui.planMes;
  const filas = acuerdoFilas(mes).filter(r=> !(r.a && r.a.pagoId) && r.c.deuda > 0);
  if(!filas.length) return;
  let topados = 0;
  filas.forEach(r=>{
    const m = Math.min(v, r.c.deuda); if(v > r.c.deuda) topados++;
    const a = acuerdoDe(r.s.id, mes);
    if(!m){ if(a){ a.del = true; a.u = now(); } return; }
    if(a){ a.monto = m; a.por = yo(); a.u = now(); a.del = false; }
    else S.acuerdos.push({ id: 'ac-' + r.s.id + '-' + mes, socioId: r.s.id, mes, monto: m, por: yo(), u: now() });
  });
  changed();
  toast(v ? `✓ ${clp(v)} a ${filas.length} socio(s)${topados ? ` · ${topados} con el máximo de su deuda` : ''}` : '✓ Montos borrados', 'ok');
};

   FINANZAS: Gastos, Ingresos (cuotas + otras actividades) y el resumen
   mensual de recaudado y adeudado en Inicio.
   ===================================================================== */
const CAT_GASTO = ['Celebraciones y actividades', 'Materiales y oficina', 'Trámites y legales', 'Ayudas a socios', 'Alimentación', 'Transporte', 'Otro'];
const CAT_INGRESO = ['Actividad (rifa, venta, evento)', 'Donación o aporte', 'Saldo inicial / traspaso', 'Intereses', 'Otro'];
ui.finAnio = ui.finAnio || String(new Date().getFullYear());

/* ---------- Cálculos por mes ---------- */
function ingresosCuotasMes(ym){
  let cuotas = 0, extras = 0;
  live('pagos').forEach(p=>{
    if((p.fecha || '').slice(0, 7) !== ym) return;
    const m = Number(p.monto) || 0;
    if(p.imp === 'extra') extras += m; else cuotas += m;
  });
  return { cuotas, extras, total: cuotas + extras };
}
function otrosIngresosMes(ym){ return live('ingresos').filter(x=> (x.fecha || '').slice(0, 7) === ym).reduce((a, x)=> a + (Number(x.monto) || 0), 0); }
function gastosMes(ym){ return live('gastos').filter(x=> (x.fecha || '').slice(0, 7) === ym).reduce((a, x)=> a + (Number(x.monto) || 0), 0); }
function deudaPorMes(){
  // adeudado: lo que falta pagar de lo cobrado en cada mes (cuotas, cuotas extraordinarias y cargos), ya vencido
  const out = {};
  live('socios').forEach(s=> cuentaSocio(s).items.forEach(it=>{
    if(!it.vencido || it.monto <= 0) return;
    const o = out[it.mes] || (out[it.mes] = { cobrado: 0, pendiente: 0 });
    o.cobrado += it.monto; o.pendiente += it.monto - (it.pagado || 0);
  }));
  return out;
}
function mesesRango(){
  const ids = [];
  live('pagos').forEach(p=> p.fecha && ids.push(ymToIdx(p.fecha.slice(0, 7))));
  live('gastos').forEach(p=> p.fecha && ids.push(ymToIdx(p.fecha.slice(0, 7))));
  live('ingresos').forEach(p=> p.fecha && ids.push(ymToIdx(p.fecha.slice(0, 7))));
  live('socios').forEach(s=> ids.push(ymToIdx(socioInicio(s))));
  const cur = ymToIdx(curYm());
  const min = ids.filter(x=> !isNaN(x)).reduce((a, b)=> Math.min(a, b), cur);
  const out = []; for(let i = cur; i >= min; i--) out.push(idxToYm(i));
  return out;
}

const MODULOS = [
  ['socios', '👥', 'Socios', ()=> `${live('socios').filter(s=> !socioBaja(s)).length} activos`],
  ['pagos', '💵', 'Pagos', ()=> `${clp(ingresosCuotasMes(curYm()).total)} este mes`],

  ['cuotas', '📅', 'Cobros', ()=> `Cuota ${clp(tarifaActual())}`],
  ['gastos', '🧾', 'Gastos', ()=> `${clp(gastosMes(curYm()))} este mes`],
  ['ingresos', '📈', 'Ingresos', ()=>{ const m = curYm(); return clp(ingresosCuotasMes(m).total + otrosIngresosMes(m)) + ' este mes'; }],
  ['portal', '🪪', 'Portal', ()=> 'Tarjetas QR'],
  ['ajustes', '⚙️', 'Ajustes', ()=> connected() || (typeof gdEnabled === 'function' && gdEnabled()) ? 'Sincronizado' : 'Solo este equipo'],
];
function modulosHtml(){

}
function cajaTotal(){
  const ing = live('pagos').reduce((t, p)=> t + (Number(p.monto) || 0), 0) + live('ingresos').reduce((t, x)=> t + (Number(x.monto) || 0), 0);
  const gas = live('gastos').reduce((t, x)=> t + (Number(x.monto) || 0), 0);
  return { ing, gas, saldo: ing - gas };
}
function cajaHtml(){
  const c = cajaTotal();
  return `<div class="caja"><div><div class="caja-l">💰 En posesión del sindicato</div><div class="caja-n ${c.saldo < 0 ? 'neg' : ''}">${clp(c.saldo)}</div>
    <div class="caja-s">Ingresos ${clp(c.ing)} − gastos ${clp(c.gas)}</div></div>
    <div class="btn-row"><button class="btn sm" data-act="go" data-tab="ingresos">📈 Ingresos</button><button class="btn sm" data-act="go" data-tab="gastos">🧾 Gastos</button></div></div>`;
}
function resumenMensualHtml(n){
  const deu = deudaPorMes();
  const meses = mesesRango().slice(0, n || 12);
  const filas = meses.map(ym=>{ const r = ingresosCuotasMes(ym), o = otrosIngresosMes(ym), d = deu[ym] || { cobrado: 0, pendiente: 0 }; return { ym, rec: r.total + o, pendiente: d.pendiente }; });
  const T = filas.reduce((a, f)=> ({ rec: a.rec + f.rec, pen: a.pen + f.pendiente }), { rec: 0, pen: 0 });
  const max = Math.max(1, ...filas.map(f=> Math.max(f.rec, f.pendiente)));
  return `<div class="card"><div class="card-head"><h2>Balance mensual: recaudado y adeudado</h2><button class="btn ghost" data-act="go" data-tab="ingresos">Ver ingresos</button></div>
    <div class="table-wrap"><table class="t mtab"><thead><tr><th>Mes</th><th class="r">Recaudado</th><th class="r">Adeudado</th><th class="r">Balance</th><th class="bar-col"></th></tr></thead><tbody>
    ${filas.map(f=>{ const b = f.rec - f.pendiente; return `<tr><td style="white-space:nowrap">${esc(mesLabel(f.ym, true))}</td><td class="r val ok">${clp(f.rec)}</td><td class="r ${f.pendiente ? 'val bad' : 'dim'}">${clp(f.pendiente)}</td><td class="r val ${b < 0 ? 'bad' : 'ok'}">${clp(b)}</td>
      <td class="bar-col"><div class="bars"><span class="b-ok" style="width:${Math.round(f.rec / max * 100)}%"></span><span class="b-bad" style="width:${Math.round(f.pendiente / max * 100)}%"></span></div></td></tr>`; }).join('')}
    <tr><td><b>Total</b></td><td class="r"><b>${clp(T.rec)}</b></td><td class="r"><b>${clp(T.pen)}</b></td><td class="r val ${T.rec - T.pen < 0 ? 'bad' : 'ok'}"><b>${clp(T.rec - T.pen)}</b></td><td></td></tr>
    </tbody></table></div>
    <p class="dim tiny" style="margin-top:6px"><b>Recaudado:</b> dinero que entró ese mes (pagos de socios y otros ingresos). <b>Adeudado:</b> lo que falta pagar de lo que se cobró ese mes. <b>Balance:</b> recaudado menos adeudado.</p></div>`;
}

    foot: ()=> `${id ? '<button class="btn danger" id="mvDel">Eliminar</button><span style="flex:1"></span>' : ''}<button class="btn" data-act="close-modal">Cancelar</button>${id ? '' : '<button class="btn" id="mvOtro">Guardar y otro</button>'}<button class="btn primary" id="mvOk">Guardar</button>`,
    onMount: (el)=>{
      $('#mvI', el).focus();
      const mi = $('#mvM', el); mi.onblur = ()=>{ const n = parseMonto(mi.value); mi.value = n ? miles(n) : ''; };
      const save = otro=>{
        const rec = Object.assign(x, { fecha: $('#mvF', el).value, monto: parseMonto($('#mvM', el).value), item: $('#mvI', el).value.trim(), categoria: $('#mvC', el).value, responsable: $('#mvR', el).value.trim(), detalle: $('#mvD', el).value.trim(), por: yo() });
        if(!rec.fecha || !rec.item || rec.monto <= 0){ toast('Completa fecha, ítem y monto.', 'bad'); return; }
        ui.finAnio = rec.fecha.slice(0, 4);
        upsert(col, Object.assign({}, rec));
        toast('✓ Guardado', 'ok');
        if(otro){ closeModal(); openMovimiento(col, null); } else closeModal();
      };
      $('#mvOk', el).onclick = ()=> save(false);

      const d = $('#mvDel', el); if(d) d.onclick = async ()=>{ if(!await confirmar('¿Eliminar este registro?', 'Eliminar', true)) return; closeModal(); removeRec(col, id); };
    },
  });
}
ACT['mv-nuevo'] = el=> openMovimiento(el.dataset.col, null);
ACT['mv-editar'] = el=> openMovimiento(el.dataset.col, el.dataset.id);
ACT['mv-excel'] = async el=>{
  const col = el.dataset.col, anio = ui.finAnio;
  try{
    const XLSX = await loadXLSX();
    const wb = XLSX.utils.book_new();
    const rows = live(col).filter(x=> (x.fecha || '').slice(0, 4) === anio).sort((a, b)=> (a.fecha || '').localeCompare(b.fecha || '')).map(x=> ({ 'Fecha': fdate(x.fecha), 'Ítem': x.item, 'Categoría': x.categoria || '', 'Monto': Number(x.monto) || 0, 'Responsable': x.responsable || '', 'Detalle': x.detalle || '' }));
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'Fecha': '', 'Ítem': '', 'Monto': '' }]);
    ws['!cols'] = [{ wch: 11 }, { wch: 34 }, { wch: 24 }, { wch: 11 }, { wch: 18 }, { wch: 34 }];
    XLSX.utils.book_append_sheet(wb, ws, col === 'gastos' ? 'Gastos' : 'Otros ingresos');
    if(col === 'ingresos' || col === 'gastos'){
      const bal = [];
      for(let m = 1; m <= 12; m++){ const ym = anio + '-' + pad2(m); const r = ingresosCuotasMes(ym), o = otrosIngresosMes(ym), g = gastosMes(ym); bal.push({ 'Mes': mesLabelCap(ym), 'Cuotas sindicales': r.cuotas, 'Extraordinarias e incorporación': r.extras, 'Otras actividades': o, 'Total ingresos': r.total + o, 'Gastos': g, 'Balance': r.total + o - g }); }
      const wb2 = XLSX.utils.json_to_sheet(bal); wb2['!cols'] = [{ wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 12 }];
      XLSX.utils.book_append_sheet(wb, wb2, 'Balance ' + anio);
    }
    XLSX.writeFile(wb, `${col}-${anio}.xlsx`);
  }catch(e){ toast('⚠ ' + (e.message || e), 'bad'); }
};

/* =====================================================================
   VISTA: PAGOS
   ===================================================================== */
VIEWS.pagos = function(){
  const all = live('pagos').slice().sort((a, b)=> (b.fecha || '').localeCompare(a.fecha || '') || b.u - a.u);
  const mesesSet = new Set(all.map(p=> (p.fecha || '').slice(0, 7)).filter(Boolean)); mesesSet.add(curYm());
  const meses = Array.from(mesesSet).sort().reverse();
  const q = normTxt(ui.pagosBusca);
  const list = all.filter(p=>{
    if(ui.pagosMes !== 'todos' && (p.fecha || '').slice(0, 7) !== ui.pagosMes) return false;
    if(q){ const s = getById('socios', p.socioId); if(!s || !normTxt(s.nombre + ' ' + (s.rut || '')).includes(q)) return false; }
    return true;
  });
  const total = list.reduce((a, p)=> a + (Number(p.monto) || 0), 0);
  const porMedio = {};
  list.forEach(p=> porMedio[p.medio || 'Otro'] = (porMedio[p.medio || 'Otro'] || 0) + (Number(p.monto) || 0));
  return `
  <div class="quick">
    <button class="btn primary" data-act="nuevo-pago">💵 Registrar pago</button>
    <button class="btn" data-act="pago-masivo">🗂️ Pago masivo del mes</button>
    <button class="btn" data-act="excel">📊 Exportar a Excel</button>
  </div>
  <div class="card">
    <div class="card-head"><h2>Pagos registrados</h2></div>
    <div class="toolbar">
      <select id="gMes"><option value="todos">Todos los meses</option>${meses.map(m=> `<option value="${m}" ${ui.pagosMes === m ? 'selected' : ''}>${esc(mesLabelCap(m))}</option>`).join('')}</select>
      <input type="search" id="gBusca" placeholder="Filtrar por socio…" value="${esc(ui.pagosBusca)}">
    </div>
    <div class="note"><b>${list.length}</b> pago(s) · Total <b>${clp(total)}</b>${Object.keys(porMedio).length > 1 ? ' · ' + Object.entries(porMedio).map(([k, v])=> esc(k) + ': ' + clp(v)).join(' · ') : ''}</div>
    ${list.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Fecha</th><th>Socio</th><th class="r">Monto</th><th>Medio</th><th>Registró</th><th></th></tr></thead><tbody>
      ${list.slice(0, 400).map(p=>{ const s = getById('socios', p.socioId); return `<tr>
        <td style="white-space:nowrap">${fdate(p.fecha)}</td>
        <td>${s ? `<a href="#" data-act="ficha" data-id="${s.id}">${nombreHtml(s, { chip: false })}</a>` : '<span class="dim">(eliminado)</span>'}${p.obs ? `<div class="tiny dim">${esc(p.obs)}</div>` : ''}</td>
        <td class="r"><b>${clp(p.monto)}</b></td><td class="small">${esc(p.medio || '')}</td><td class="small dim">${esc(p.por || '')}</td>
        <td class="r"><button class="btn ghost sm" data-act="editar-pago" data-id="${p.id}" title="Editar">✏️</button></td></tr>`; }).join('')}
    </tbody></table></div>${list.length > 400 ? '<div class="dim small" style="margin-top:6px">Se muestran los 400 más recientes. Usa el filtro por mes o exporta a Excel.</div>' : ''}` : `<div class="empty">No hay pagos con ese filtro.</div>`}
  </div>`;
};
VIEWS.pagos.mount = function(v){
  $('#gMes', v).onchange = e=>{ ui.pagosMes = e.target.value; renderView(); };
  const b = $('#gBusca', v);
  b.addEventListener('input', ()=>{ ui.pagosBusca = b.value; const pos = b.selectionStart; renderView(); const n = $('#gBusca'); n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} });
};

/* =====================================================================
   VISTA: CUOTAS (valor, vencimiento, cobros extraordinarios, recaudación)
   ===================================================================== */
VIEWS.cuotas = function(){
  const tarifas = live('tarifas').sort((a, b)=> ymToIdx(b.desde) - ymToIdx(a.desde));
  const cobros = live('cobros').sort((a, b)=> ymToIdx(b.mes) - ymToIdx(a.mes));
  // recaudación de los últimos 12 meses
  const cur = ymToIdx(curYm());
  const socios = live('socios');
  const filas = [];
  for(let i = cur; i > cur - 12; i--){
    const ym = idxToYm(i);
    let esperado = 0, cubierto = 0;
    socios.forEach(s=>{ cuentaSocio(s, cur).items.filter(it=> it.mes === ym && it.monto > 0).forEach(it=>{ esperado += it.monto; cubierto += it.pagado || 0; }); });
    const recaudado = live('pagos').filter(p=> (p.fecha || '').slice(0, 7) === ym).reduce((a, p)=> a + (Number(p.monto) || 0), 0);
    filas.push({ ym, esperado, cubierto, recaudado });
  }
  return `
  <div class="card">
    <h2>Valor de la cuota mensual</h2>
    <p class="dim small">Si la cuota cambia, agrega el nuevo valor indicando desde qué mes rige. Los meses anteriores conservan su valor.</p>
    ${tarifas.length ? tarifas.map((t, i)=> `<div class="row"><div class="main"><div class="title">${clp(t.monto)}</div><div class="sub">Desde ${esc(mesLabel(t.desde))}${i === 0 ? ' · vigente' : ''}</div></div><button class="btn ghost sm" data-act="borrar-tarifa" data-id="${t.id}" title="Quitar">🗑️</button></div>`).join('') : '<div class="empty">Aún no hay valor de cuota.</div>'}
    <div class="grid3" style="margin-top:10px">
      <label class="f">Nuevo valor ($)<input id="tMonto" inputmode="numeric" placeholder="Ej: 6.000"></label>
      <label class="f">Rige desde<input id="tDesde" type="month" value="${idxToYm(cur + 1)}"></label>
      <div style="display:flex;align-items:flex-end"><button class="btn primary" data-act="nueva-tarifa" style="width:100%">Agregar valor</button></div>
    </div>
  </div>
  <div class="card">
    <h2>Vencimiento y socios nuevos</h2>
    <div class="grid2">
      <label class="f">Día de vencimiento de cada mes<input id="cDia" type="number" min="1" max="28" value="${diaVenc()}"></label>
      <label class="f">Mes de inicio por defecto para socios nuevos<input id="cIni" type="month" value="${esc(S.config.mesInicioDefault || curYm())}"></label>
    </div>
    <p class="dim small">Antes del día de vencimiento, la cuota del mes en curso aparece como "por vencer" y no cuenta como deuda.</p>
    <button class="btn" data-act="guardar-venc">Guardar</button>
  </div>
  <div class="card">
    <div class="card-head"><h2>Cuotas extraordinarias</h2><button class="btn primary sm" data-act="nuevo-cobro">+ Nueva cuota extraordinaria</button></div>
    <p class="dim small">Cuotas extraordinarias votadas en asamblea (ej: aporte para un evento). Se suman a la deuda de los socios indicados.</p>
    ${cobros.length ? cobros.map(c=>{
      const n = c.socios === 'todos' ? live('socios').filter(s=> { const i = ymToIdx(c.mes); return ymToIdx(socioInicio(s)) <= i && (!s.mesTermino || ymToIdx(s.mesTermino) >= i); }).length : (c.socios || []).length;
      let pagados = 0; live('socios').forEach(s=>{ const it = cuentaSocio(s, ymToIdx(c.mes)).items.find(x=> x.ref === c.id); if(it && it.estado === 'pagado') pagados++; });
      return `<div class="row"><div class="main"><div class="title">${esc(c.concepto)} · ${clp(c.monto)}</div><div class="sub">${esc(mesLabelCap(c.mes))} · ${c.socios === 'todos' ? 'todos los socios' : 'socios seleccionados'} (${n}) · pagado por ${pagados}</div></div><button class="btn ghost sm" data-act="editar-cobro" data-id="${c.id}">✏️</button></div>`;
    }).join('') : '<div class="empty">Sin cobros extraordinarios.</div>'}
  </div>
  <div class="card">
    <h2>Recaudación de los últimos 12 meses</h2>
    <div class="table-wrap"><table class="t"><thead><tr><th>Mes</th><th class="r">Cobrado (cuotas y cobros)</th><th class="r">Pagado de ese mes</th><th class="r">%</th><th class="r">Dinero recibido en el mes</th></tr></thead><tbody>
      ${filas.map(f=> `<tr><td>${esc(mesLabelCap(f.ym))}</td><td class="r">${clp(f.esperado)}</td><td class="r">${clp(f.cubierto)}</td><td class="r">${f.esperado ? Math.round(f.cubierto / f.esperado * 100) + '%' : '—'}</td><td class="r"><b>${clp(f.recaudado)}</b></td></tr>`).join('')}
    </tbody></table></div>
    <p class="dim tiny">"Pagado de ese mes" considera los pagos imputados a las cuotas de ese mes (aunque se hayan pagado después). "Dinero recibido" es lo que efectivamente entró en ese mes.</p>
  </div>`;
};
ACT['nueva-tarifa'] = ()=>{
  const monto = parseMonto($('#tMonto').value), desde = $('#tDesde').value;
  if(monto <= 0 || !desde){ toast('Indica el valor y el mes desde el que rige.', 'bad'); return; }
  const ex = live('tarifas').find(t=> t.desde === desde);
  if(ex){ ex.monto = monto; upsert('tarifas', ex); } else upsert('tarifas', { id: uid(), desde, monto });
  toast('✓ Valor de cuota guardado', 'ok');
};
ACT['borrar-tarifa'] = async el=>{
  if(live('tarifas').length === 1){ toast('Debe quedar al menos un valor de cuota.', 'bad'); return; }
  if(!await confirmar('¿Quitar este valor de cuota? La deuda de todos los socios se recalculará con los valores restantes.', 'Quitar', true)) return;
  removeRec('tarifas', el.dataset.id);
};
ACT['guardar-venc'] = ()=>{
  const d = Math.min(28, Math.max(1, parseInt($('#cDia').value, 10) || 10));
  setConfig({ diaVencimiento: d, mesInicioDefault: $('#cIni').value || curYm() });
  toast('✓ Guardado', 'ok');
};
function openCobro(id){
  const c = id ? Object.assign({}, getById('cobros', id)) : { id: uid(), concepto: '', monto: 0, mes: curYm(), socios: 'todos' };
  const st = { todos: c.socios === 'todos', sel: new Set(Array.isArray(c.socios) ? c.socios : []), busca: '' };
  const m = openModal({
    title: ()=> id ? 'Editar cobro extraordinario' : 'Nuevo cobro extraordinario',
    body: ()=> `<div class="grid3">
        <label class="f span2" style="grid-column:span 2">Concepto<input id="kCon" value="${esc(c.concepto)}" placeholder="Ej: Aporte aniversario"></label>
        <label class="f">Monto por socio ($)<input id="kMonto" inputmode="numeric" value="${c.monto ? miles(c.monto) : ''}"></label>
        <label class="f">Mes del cobro<input id="kMes" type="month" value="${esc(c.mes)}"></label>
      </div>
      <div class="seg" id="kA" style="margin-top:12px"><button type="button" data-v="1" class="${st.todos ? 'active' : ''}">Todos los socios activos</button><button type="button" data-v="0" class="${!st.todos ? 'active' : ''}">Elegir socios</button></div>
      ${st.todos ? '' : `<div style="margin-top:10px">${sociosOrdenados().filter(socioActivo).map(s=> `<label class="check" style="padding:5px 0"><input type="checkbox" class="kChk" value="${s.id}" ${st.sel.has(s.id) ? 'checked' : ''}> ${esc(s.nombre)}</label>`).join('')}</div>`}`,
    foot: ()=> `${id ? '<button class="btn danger" id="kDel">Eliminar</button><span style="flex:1"></span>' : ''}<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="kOk">Guardar</button>`,
    onMount: (el)=>{
      const keep = ()=>{ c.concepto = $('#kCon', el).value; c.monto = parseMonto($('#kMonto', el).value); c.mes = $('#kMes', el).value; $$('.kChk', el).forEach(x=> x.checked ? st.sel.add(x.value) : st.sel.delete(x.value)); };
      $('#kA', el).onclick = e=>{ const b = e.target.closest('button[data-v]'); if(b){ keep(); st.todos = b.dataset.v === '1'; drawModal(m); } };
      $('#kOk', el).onclick = ()=>{
        keep();
        if(!c.concepto.trim() || c.monto <= 0 || !c.mes){ toast('Completa concepto, monto y mes.', 'bad'); return; }
        if(!st.todos && !st.sel.size){ toast('Elige al menos un socio.', 'bad'); return; }
        c.concepto = c.concepto.trim();
        c.socios = st.todos ? 'todos' : Array.from(st.sel);
        closeModal(); upsert('cobros', c); toast('✓ Cobro guardado', 'ok');
      };
      const d = $('#kDel', el);
      if(d) d.onclick = async ()=>{ if(!await confirmar('¿Eliminar este cobro? Se quitará de la deuda de todos los socios (los pagos ya hechos quedarán como abono a otras cuotas).', 'Eliminar', true)) return; closeModal(); removeRec('cobros', id); };
    },
  });
}
ACT['nuevo-cobro'] = ()=> openCobro(null);
ACT['editar-cobro'] = el=> openCobro(el.dataset.id);

ACT['publicar'] = async el=>{
  el.disabled = true;

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=> res(window.XLSX); sc.onerror = ()=> rej(new Error('No se pudo cargar el generador de Excel (¿sin internet?).'));
    document.head.appendChild(sc);
  });
}
ACT['excel'] = async ()=>{
  try{
    const XLSX = await loadXLSX();
    const wb = XLSX.utils.book_new();
    const socios = sociosOrdenados();
    const res = socios.map(s=>{ const c = cuentaSocio(s); return { 'Nombre': s.nombre, 'RUT': s.rut ? formatRut(s.rut) : '', 'Socio desde': mesLabelCap(socioInicio(s)), 'Retiro': s.mesTermino ? mesLabelCap(s.mesTermino) : '', 'Estado': c.deuda > 0 ? 'Con deuda' : 'Al día', 'N° meses adeudados': c.mesesAdeudados.length, 'Meses adeudados': c.mesesAdeudados.map(m=> mesLabel(m, true)).join(', '), 'Deuda vencida': c.deuda, 'Saldo a favor': c.saldoFavor, 'Total pagado': c.totalPagos, 'Último pago': c.ultimoPago ? fdate(c.ultimoPago.fecha) : '', 'Teléfono': s.telefono || '', 'Correo': s.email || '' }; });
    const ws1 = XLSX.utils.json_to_sheet(res);
    ws1['!cols'] = [{ wch: 32 }, { wch: 13 }, { wch: 16 }, { wch: 14 }, { wch: 11 }, { wch: 10 }, { wch: 40 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 26 }];
    XLSX.utils.book_append_sheet(wb, ws1, 'Resumen socios');
    const pagos = live('pagos').slice().sort((a, b)=> (a.fecha || '').localeCompare(b.fecha || '')).map(p=>{ const s = getById('socios', p.socioId); return { 'Fecha': fdate(p.fecha), 'Socio': s ? s.nombre : '(eliminado)', 'RUT': s && s.rut ? formatRut(s.rut) : '', 'Monto': Number(p.monto) || 0, 'Medio': p.medio || '', 'Observación': p.obs || '', 'Registró': p.por || '' }; });
    const ws2 = XLSX.utils.json_to_sheet(pagos.length ? pagos : [{ 'Fecha': '', 'Socio': '', 'Monto': '' }]);
    ws2['!cols'] = [{ wch: 11 }, { wch: 32 }, { wch: 13 }, { wch: 10 }, { wch: 22 }, { wch: 30 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, ws2, 'Pagos');
    const y = new Date().getFullYear();
    [y, y - 1].forEach(yr=>{
      const rows = socios.filter(s=> ymToIdx(socioInicio(s)) <= ymToIdx(yr + '-12')).map(s=>{ const r = { 'Nombre': s.nombre }; estadoMeses(s, yr).forEach(m=> r[MESES_C[Number(m.ym.slice(5)) - 1]] = m.txt); r['Deuda vencida total'] = cuentaSocio(s).deuda; return r; });
      if(rows.length){ const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [{ wch: 32 }].concat(Array(12).fill({ wch: 13 })).concat([{ wch: 14 }]); XLSX.utils.book_append_sheet(wb, ws, 'Cuotas ' + yr); }
    });
    const cob = live('cobros').map(c=> ({ 'Mes': mesLabelCap(c.mes), 'Concepto': c.concepto, 'Monto por socio': Number(c.monto) || 0, 'Aplica a': c.socios === 'todos' ? 'Todos' : (c.socios || []).map(id=> (getById('socios', id) || {}).nombre).filter(Boolean).join(', ') }));
    if(cob.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cob), 'Cobros extraordinarios');
    XLSX.writeFile(wb, `cuotas-${normTxt(S.config.nombre || 'sindicato').replace(/[^a-z0-9]+/g, '-').slice(0, 30)}-${todayISO()}.xlsx`);
  }catch(e){ toast('⚠ ' + (e.message || e), 'bad'); }
};

VIEWS.ajustes.mount = function(v){
  $('#aTema', v).onclick = e=>{ const b = e.target.closest('button[data-v]'); if(!b) return; lsSet('cs_tema', b.dataset.v); window.aplicarTema(); renderView(); };
  $('#aPal', v).onclick = e=>{ const b = e.target.closest('button[data-p]'); if(!b) return; lsSet('cs_paleta', b.dataset.p); window.aplicarTema(); renderView(); };
  $('#aRest', v).onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const st = data.app === 'cuotas-sindicales-respaldo' ? data.datos : data;
      if(!st || !Array.isArray(st.socios)) throw new Error('El archivo no es un respaldo de esta app.');
      if(!await confirmar(`El respaldo tiene ${st.socios.filter(x=> !x.del).length} socios y ${(st.pagos || []).filter(x=> !x.del).length} pagos. ¿Combinarlo con los datos actuales?`, 'Combinar')) return;
      // Si un registro del respaldo fue borrado aquí antes (por ejemplo al "empezar de nuevo"), el respaldo lo restaura
      const t0 = now(), st2 = normalizeState(st);
      COLS.forEach(c=> st2[c].forEach(x=>{ const cur = S[c].find(y=> y.id === x.id); if(cur && cur.del && !x.del) x.u = t0; }));
      if(st2.config && (S.config.u || 0) >= (st2.config.u || 0) && !S.config.nombre) st2.config.u = t0;
      S = mergeStates(S, st2);
      changed();
      toast('✓ Respaldo combinado', 'ok');
    }catch(err){ toast('⚠ ' + err.message, 'bad'); }
    e.target.value = '';
  };
};

ACT['borrar-todo'] = async ()=>{
  const n = live('socios').length, np = live('pagos').length;
  const ok = await new Promise(resolve=>{
    openModal({
      title: ()=> 'Borrar todos los datos',
      body: ()=> `<p>Se borrarán <b>${n} socios</b>, <b>${np} pagos</b> y todo lo demás (cuotas, cobros, ajustes, planes y el nombre del sindicato).</p>

/* ---------- Configurar repositorio ---------- */
ACT['conectar'] = ()=>{
  const guess = (location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i) || [])[1] || '';
  const repoGuess = guess ? (location.pathname.split('/').filter(Boolean)[0] || '') : '';
  openModal({
    title: ()=> 'Configurar repositorio',
    sticky: true,
    body: ()=> `<p class="dim small">Esto se hace <b>una sola vez</b>. Después invitas a los demás dirigentes con un enlace.</p>
      <div class="grid2">
        <label class="f">Usuario u organización de GitHub<input id="cOwner" value="${esc(guess)}" autocomplete="off"></label>
        <label class="f">Repositorio<input id="cRepo" value="${esc(repoGuess.endsWith('.html') ? '' : repoGuess)}" autocomplete="off" placeholder="cuotas-sindicato"></label>
        <label class="f span2">Llave de acceso (fine-grained token)<input id="cTok" type="password" autocomplete="off" placeholder="github_pat_…"></label>
        <label class="f">Clave compartida de los dirigentes<input id="cK1" type="password" autocomplete="new-password" placeholder="Mínimo 10 caracteres"></label>
        <label class="f">Repite la clave<input id="cK2" type="password" autocomplete="new-password"></label>
      </div>
      <details class="adv"><summary>Opciones avanzadas</summary><div class="grid2">
        <label class="f">Carpeta dentro del repositorio<input id="cFolder" placeholder="(vacío = raíz)"></label>
        <label class="f">Rama<input id="cBranch" placeholder="(vacío = principal)"></label>
        <label class="f span2">Dirección del portal (si no es la predeterminada)<input id="cPortal" placeholder="https://…/portal.html"></label>
      </div></details>
      <div class="note warn small">Anota la clave compartida en un lugar seguro: si se pierde, los datos cifrados no se pueden recuperar (salvo desde un respaldo).</div>
      <div id="cMsg"></div>`,
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="cOk">Conectar</button>`,
    onMount: (el)=>{
      $('#cOk', el).onclick = async ()=>{
        const owner = $('#cOwner', el).value.trim(), repo = $('#cRepo', el).value.trim().replace(/\.git$/, ''), token = $('#cTok', el).value.trim();
        const k1 = $('#cK1', el).value, k2 = $('#cK2', el).value;
        if(!owner || !repo || !token){ toast('Completa usuario, repositorio y llave.', 'bad'); return; }
        if(k1.length < 10){ toast('La clave compartida debe tener al menos 10 caracteres.', 'bad'); return; }
        if(k1 !== k2){ toast('Las claves no coinciden.', 'bad'); return; }
        const btn = $('#cOk', el); btn.disabled = true; btn.textContent = 'Probando…';
        const prevConn = conn();
        setConn({ owner, repo, token, clave: k1, fileId: randomId(10), folder: $('#cFolder', el).value.trim(), branch: $('#cBranch', el).value.trim(), portalUrl: $('#cPortal', el).value.trim() });
        try{
          const r = await gh(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
          if(!r.res.ok) throw new Error(ghError(r.res, r.body));
          if(r.body && r.body.permissions && !r.body.permissions.push) throw new Error('La llave no tiene permiso de escritura en ese repositorio.');
          if(r.body && r.body.private) toast('Ojo: el repositorio es privado. GitHub Pages en repositorios privados requiere plan pagado; el portal podría no verse.', '', 10000);
          const ok = await syncNow();
          if(!ok) throw new Error(syncState.msg || 'No se pudo subir los datos.');
          closeModal();
          toast('✓ Conectado. Ahora puedes invitar a otros dirigentes.', 'ok');
          renderView();
        }catch(e){
          setConn(prevConn);
          btn.disabled = false; btn.textContent = 'Conectar';
          const det = e instanceof TypeError ? ' [' + String(e.stack || '').split('\n').slice(1, 3).join(' ').replace(/https?:\/\/[^ )]+\//g, '').trim() + ']' : '';
          $('#cMsg', el).innerHTML = `<div class="note bad">${esc((e.message || e) + det)}</div>`;
          updateChip();
        }
      };
    },
  });
};

/* ---------- Invitación (enlace con los datos de conexión) ---------- */
function invitacionUrl(){
  const c = conn();
  const data = { o: c.owner, r: c.repo, b: c.branch || '', d: c.folder || '', f: c.fileId, t: c.token, k: c.clave, p: c.portalUrl || '', n: S.config.nombre || '' };
  const base = /^https?:/.test(location.protocol) ? location.href.split('#')[0].split('?')[0] : 'cuotas.html';
  return base + '#unir=' + b64url(JSON.stringify(data));
}

function parseInvitacion(str){

  return null;
}

/* =====================================================================
   CORREOS: envía a cada socio su estado de cuenta desde tu Gmail.
   - Envío masivo con un toque (con vista previa y plantilla editable).
   - Recordatorio mensual: desde el día elegido, Inicio avisa que toca
     enviar y queda listo en un toque (opcionalmente se abre solo).
   ===================================================================== */
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
let gmailTok = null;
const CORREO_ASUNTO_DEF = 'Estado de cuenta de cuotas sindicales · {mes}';
const CORREO_CUERPO_DEF = `Hola {nombre}:

Te enviamos tu estado de cuenta de cuotas sindicales al {fecha}.

{resumen}

{detalle}

{plan}
{enlace}

Si ya pagaste o crees que hay un error, responde este correo y lo revisamos.

Saludos,
{sindicato}`;
function correoCfg(){
  const c = S.config;
  return { asunto: c.correoAsunto || CORREO_ASUNTO_DEF, cuerpo: c.correoCuerpo || CORREO_CUERPO_DEF, diaAuto: Number(c.correoDia) || 0, soloDeuda: c.correoSoloDeuda !== false, abrirSolo: !!c.correoAbrirSolo };
}
function emailValido(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e || '').trim()); }

/* ---------- Texto del correo para un socio ---------- */
function correoDatos(s){
  const c = cuentaSocio(s);
  const pend = c.items.filter(it=> it.vencido && it.monto > 0 && it.estado !== 'pagado');
  const pl = typeof planActivoDe === 'function' ? planActivoDe(s.id) : null;
  const resumen = c.deuda > 0
    ? `Tu deuda vencida es de ${clp(c.deuda)}${c.mesesAdeudados.length ? ` (${c.mesesAdeudados.length === 1 ? '1 mes' : c.mesesAdeudados.length + ' meses'}: ${c.mesesAdeudados.map(m=> mesLabel(m, true)).join(', ')})` : ''}.`
    : `Estás al día con tus cuotas. ¡Gracias!${c.saldoFavor ? ` Tienes ${clp(c.saldoFavor)} a favor.` : ''}`;
  const detalle = pend.length ? 'Detalle de lo pendiente:\n' + pend.map(it=> `  • ${it.concepto}: ${clp(it.monto - it.pagado)}`).join('\n') + `\n  Total: ${clp(c.deuda)}` : '';
  let plan = '';
  if(pl){ const r = planResumen(pl); plan = `Plan de pago: llevas ${r.pagadas} de ${r.n} cuotas descontadas; saldo del plan ${clp(r.saldo)}.\n`; }
  const enlace = (connected() && s.token && portalBaseUrl()) ? `Puedes revisar tu estado de cuenta en cualquier momento aquí${S.config.portalPin ? ' (necesitas tu PIN)' : ''}:\n${socioPortalUrl(s)}\n` : '';
  const ult = c.ultimoPago ? `Último pago registrado: ${fdate(c.ultimoPago.fecha)} por ${clp(c.ultimoPago.monto)}.` : '';
  return { c, pend, resumen, detalle, plan, enlace, ult };
}
function correoRender(tpl, s, d){
  const rep = {
    nombre: s.nombre, primer_nombre: s.nombre.split(/\s+/).slice(-1)[0], deuda: clp(d.c.deuda),
    meses: d.c.mesesAdeudados.map(m=> mesLabel(m, true)).join(', ') || 'ninguno',
    resumen: d.resumen + (d.ult ? '\n' + d.ult : ''), detalle: d.detalle, plan: d.plan, enlace: d.enlace,
    sindicato: S.config.nombre || 'La directiva', fecha: fdate(todayISO()), mes: mesLabel(curYm()), cuota: clp(tarifaActual()),
  };
  return tpl.replace(/\{(\w+)\}/g, (m, k)=> rep[k] !== undefined ? rep[k] : m).replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- Gmail ---------- */
function getGmailToken(){
  return new Promise((resolve, reject)=>{
    if(gmailTok && gmailTok.expires_at > Date.now() + 60000){ resolve(gmailTok.access_token); return; }
    if(!(window.google && google.accounts && google.accounts.oauth2)){ gdLoadGis().catch(()=>{}); reject(new Error('Cargando Google… espera 2 segundos y toca de nuevo.')); return; }
    const cfg = {
      client_id: gdClientId(), scope: GMAIL_SCOPE, prompt: '',
      callback: resp=>{
        if(resp.error){ reject(new Error('Google no dio el permiso (' + (resp.error_description || resp.error) + ')')); return; }
        if(!google.accounts.oauth2.hasGrantedAllScopes(resp, GMAIL_SCOPE)){ reject(new Error('No se marcó el permiso "Enviar correo electrónico en tu nombre".')); return; }
        gmailTok = { access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600) * 1000 };
        resolve(resp.access_token);
      },
      error_callback: err=>{ const t = err && err.type; reject(new Error(t === 'popup_closed' ? 'Se cerró la ventana de Google sin dar el permiso.' : t === 'popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google.' : 'No se pudo abrir la ventana de Google.')); },
    };
    if(gdEmail()) cfg.login_hint = gdEmail();
    google.accounts.oauth2.initTokenClient(cfg).requestAccessToken();
  });
}
function b64u8(str){ return btoa(unescape(encodeURIComponent(str))); }
function hdr(str){ return /^[\x20-\x7E]*$/.test(str) ? str : '=?UTF-8?B?' + b64u8(str) + '?='; }
function textoAHtml(t){
  return '<div style="font-family:Calibri,Arial,sans-serif;font-size:15px;color:#111;line-height:1.5">' + esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>').replace(/\n/g, '<br>') + '</div>';
}
function mimeCorreo(to, asunto, texto){
  const b = 'cs_' + Math.random().toString(36).slice(2);
  const wrap = s=> s.replace(/.{1,76}/g, '$&\r\n');
  const from = S.config.nombre ? hdr(S.config.nombre) + (gdEmail() ? ' <' + gdEmail() + '>' : '') : '';
  return ['MIME-Version: 1.0', from && gdEmail() ? 'From: ' + from : '', 'To: ' + to, 'Subject: ' + hdr(asunto),
    'Content-Type: multipart/alternative; boundary="' + b + '"', '',
    '--' + b, 'Content-Type: text/plain; charset="UTF-8"', 'Content-Transfer-Encoding: base64', '', wrap(b64u8(texto.replace(/\r?\n/g, '\r\n'))),
    '--' + b, 'Content-Type: text/html; charset="UTF-8"', 'Content-Transfer-Encoding: base64', '', wrap(b64u8(textoAHtml(texto))),
    '--' + b + '--', ''].filter((x, i)=> !(i === 1 && !x)).join('\r\n');
}
async function gmailSend(token, mime){
  const res = await fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'message/rfc822' }, body: mime });
  if(res.ok) return;
  let msg = ''; try{ msg = (await res.json()).error.message || ''; }catch(e){}
  if(res.status === 401){ gmailTok = null; throw Object.assign(new Error('El permiso de Google venció. Vuelve a tocar "Enviar".'), { fatal: true }); }
  if(res.status === 403 && /not been used|disabled|not enabled/i.test(msg)) throw Object.assign(new Error('La Gmail API no está habilitada en el proyecto de Google Cloud.'), { fatal: true });
  if(res.status === 403 && /insufficient|scope/i.test(msg)){ gmailTok = null; throw Object.assign(new Error('Falta el permiso para enviar correos.'), { fatal: true }); }
  if(res.status === 429) throw Object.assign(new Error('Google limitó los envíos por ahora. Intenta más tarde.'), { fatal: true });
  throw new Error('Gmail (' + res.status + ')' + (msg ? ': ' + msg : ''));
}

/* ---------- Pegar correos en lote ---------- */
function matchSocio(nombre){
  const n = normTxt(nombre).replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
  let best = null, bs = 0;
  live('socios').forEach(s=>{
    const t = normTxt(s.nombre).replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
    const sc = t.filter(w=> n.includes(w)).length / Math.max(t.length, 1);
    if(sc > bs){ bs = sc; best = s; }
  });
  return bs >= 0.99 || (best && bs >= 0.5 && normTxt(best.nombre).split(/\s+/).filter(w=> n.includes(w)).length >= 2) ? best : null;
}

   WHATSAPP: abre WhatsApp con el mensaje listo para cada socio.
   (WhatsApp no permite envíos masivos automáticos sin su API de pago;
    aquí se toca "Enviar" en WhatsApp por cada socio.)

const WA_DEF = `Hola {primer_nombre} 👋
Te escribimos de {sindicato}.

{detalle}

{enlace}

function waTpl(){ return S.config.waTexto || WA_DEF; }
function normFono(t){
  let d = String(t || '').replace(/\D/g, '');
  if(d.startsWith('00')) d = d.slice(2);
  if(d.length === 8) d = '569' + d;
  else if(d.length === 9 && d[0] === '9') d = '56' + d;
  return d.length >= 10 && d.length <= 15 ? d : '';
}
function waTexto(s){
  const d = correoDatos(s);
  const t = correoRender(waTpl(), s, d).replace(/Detalle de lo pendiente:/, '*Detalle de lo pendiente:*').replace(/  • /g, '• ');
  return t.replace(/\n{3,}/g, '\n\n').trim();
}

        <p class="dim tiny">El texto se edita en ⚙️ Ajustes → Correos a los socios → Texto de WhatsApp.</p>`;

/* =====================================================================
   IMPORTAR NÚMEROS DESDE UN CHAT EXPORTADO DE WHATSAPP
   WhatsApp no deja exportar la lista de participantes, pero sí el chat
   (Más → Exportar chat → Sin archivos). En ese archivo aparecen los números
   de quienes no tienes guardados; los guardados aparecen con su nombre.
   ===================================================================== */
function parseChatWA(txt){
  const nums = new Map(), nombres = new Map();
  const head = /^\[?\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[ap]\.?\s?m\.?)?\]?\s*(?:-\s*)?([^:]{1,60}):\s/i;
  const telRe = /\+?\d[\d\s ().-]{7,}\d/g;
  txt.split(/\r?\n/).forEach(l=>{
    l = l.replace(/[‎‏‪-‮]/g, '');
    const m = l.match(head);
    if(m){
      const who = m[1].trim().replace(/^~\s*/, '');
      const t = who.match(telRe);
      if(t && normFono(t[0])){ const k = normFono(t[0]); nums.set(k, nums.get(k) || { tel: t[0].trim(), n: 0 }); nums.get(k).n++; }
      else if(who && !/^(tú|tu|you)$/i.test(who)) nombres.set(who, (nombres.get(who) || 0) + 1);
    } else {
      (l.match(telRe) || []).forEach(t=>{ const k = normFono(t); if(k && !nums.has(k)) nums.set(k, { tel: t.trim(), n: 0 }); });
    }
  });

const LOCK_ITER = 120000;
const ACT_LIBRES = new Set(['close-modal', 'ficha', 'go', 'go-ajustes-close', 'sync-now', 'excel', 'excel-socios', 'mv-excel', 'print-estado', 'print-estados', 'print-tarjetas', 'print-pins', 'plan-mes', 'plan-nomina', 'ver-plan', 'ac-hist-ver', 'ac-hist-word', 'tarjeta', 'ver-deudores', 'respaldo', 'gd-conectar', 'gd-desconectar', 'gd-client', 'conectar', 'unirse', 'desconectar', 'lk-desbloquear', 'lk-bloquear', 'borrar-local']);
function lockCfg(cfg){ const c = (cfg || S.config).bloqueo; return c && c.on && Array.isArray(c.usuarios) && c.usuarios.length ? c : null; }
function lockGuardado(){ try{ const p = JSON.parse(lsGet('cs_state', 'null') || 'null'); return lockCfg((p && p.config) || {}); }catch(e){ return null; } }

/* ---------- PIN ---------- */
async function pinHash(pin, saltB64){
  const base = await crypto.subtle.importKey('raw', TE.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64ToBytes(saltB64), iterations: LOCK_ITER, hash: 'SHA-256' }, base, 256);
  return bytesToB64(new Uint8Array(bits));
}
async function pinNuevo(pin){ const salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16))); return { salt, hash: await pinHash(pin, salt) }; }

/* ---------- Huella (WebAuthn, autenticador del propio equipo) ---------- */
async function huellaDisponible(){ try{ return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
function huellaKey(idx){ const c = lockCfg(); return 'cs_bio::' + ((c && c.usuarios[idx] && c.usuarios[idx].id) || idx); }
function huellaId(idx){ return lsGet(huellaKey(idx), ''); }
async function huellaRegistrar(idx){
  const u = lockCfg().usuarios[idx];
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)),
    rp: { name: 'Gestión Sindical' },
    user: { id: crypto.getRandomValues(new Uint8Array(16)), name: u.nombre || 'tesorero', displayName: (u.nombre || 'Tesorero') + ' · ' + (S.config.nombre || 'Sindicato') },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000, attestation: 'none',
  } });
  lsSet(huellaKey(idx), bytesToB64(new Uint8Array(cred.rawId)));
}
async function huellaVerificar(idx){
  const id = huellaId(idx); if(!id) throw new Error('No hay huella registrada en este equipo.');
  const r = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: b64ToBytes(id) }], userVerification: 'required', timeout: 60000 } });
  if(!r || !r.response || !(r.response.authenticatorData && (new Uint8Array(r.response.authenticatorData)[32] & 0x04))) throw new Error('La huella no fue verificada.');
  return true;
}

    },
  });
}

   - Actas escritas en la app y/o con archivos adjuntos (PDF, fotos).
     Los archivos se suben cifrados al repositorio.

const ESTADOS_T = { pendiente: ['Pendiente', '', 'neutral'], curso: ['En curso', '⏳', 'info'], cumplida: ['Cumplida', '✓', 'ok'] };
['acta-ver', 'acta-archivo', 'acta-word', 'tarea-ver', 'tf-estado', 'tf-quien'].forEach(a=> ACT_LIBRES.add(a));

/* ---------- Llave común (actas/tareas públicas y archivos) ---------- */
function gkB64(){ return S.config.gk || ''; }
function ensureGk(){ if(!S.config.gk){ S.config.gk = bytesToB64(crypto.getRandomValues(new Uint8Array(32))); S.config.u = now(); } return S.config.gk; }
async function gkKey(b64, uso){ return crypto.subtle.importKey('raw', b64ToBytes(b64 || gkB64()), 'AES-GCM', false, uso || ['encrypt', 'decrypt']); }

/* ---------- Archivos cifrados en el repositorio ---------- */
function archivoNombre(id){ return 'archivos-' + conn().fileId + '/' + id + '.bin'; }
async function comprimirImagen(file){
  if(!/^image\//.test(file.type) || file.size < 350000) return file;
  const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=> res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 2000 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  URL.revokeObjectURL(img.src);
  const b = await new Promise(r=> cv.toBlob(r, 'image/jpeg', 0.82));
  return new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}
async function subirArchivo(file){
  if(!connected()) throw new Error('Para adjuntar archivos conecta el repositorio en Ajustes.');
  file = await comprimirImagen(file);
  if(file.size > 20 * 1024 * 1024) throw new Error('El archivo pesa más de 20 MB.');
  const id = randomId(12);
  const key = await gkKey(ensureGk());
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await file.arrayBuffer()));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  const c = conn();
  const payload = { message: 'Archivo de acta (' + yo() + ')', content: bytesToB64(all) };
  if(c.branch) payload.branch = c.branch;
  const { res, body } = await gh(ghContentsPath(archivoNombre(id)), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error(ghError(res, body));
  return { id, nombre: file.name, tipo: file.type || 'application/octet-stream', size: file.size };
}
async function bajarArchivo(a){
  let bytes = null;
  try{ const r = await fetch(archivoNombre(a.id) + '?_=' + Date.now(), { cache: 'no-store' }); if(r.ok) bytes = new Uint8Array(await r.arrayBuffer()); }catch(e){}
  if(!bytes && connected()){
    const c = conn();
    const { res, body } = await gh(ghContentsPath(archivoNombre(a.id)) + (c.branch ? '?ref=' + encodeURIComponent(c.branch) : ''));
    if(!res.ok) throw new Error(ghError(res, body));
    let b64 = body.content;
    if(!b64 || body.encoding !== 'base64'){ const r2 = await gh(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/blobs/${body.sha}`); b64 = r2.body && r2.body.content; }
    bytes = b64ToBytes(String(b64).replace(/\s/g, ''));
  }
  if(!bytes) throw new Error('No se pudo descargar el archivo.');
  const key = await gkKey(gkB64(), ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  return new Blob([plain], { type: a.tipo });
}
async function borrarArchivoRepo(a){
  try{ const c = conn(); const { res, body } = await gh(ghContentsPath(archivoNombre(a.id))); if(!res.ok) return; await gh(ghContentsPath(archivoNombre(a.id)), { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Borra archivo de acta', sha: body.sha, branch: c.branch || undefined }) }); }catch(e){}
}

};

        if(t.estado === 'cumplida' && !t.cumplidaEl) t.cumplidaEl = todayISO();
        if(t.publico) ensureGk();

      };

}

/* ---------- Portal: contenido común + tareas propias ---------- */
function comunName(){ return 'comun-' + conn().fileId + '.json'; }
function tareaPortal(t){ const ac = t.actaId ? getById('actas', t.actaId) : null; return { id: t.id, x: t.texto, e: t.estado || 'pendiente', p: t.plazo || '', r: respTxt(t), a: ac && ac.publico ? (ac.titulo || ac.tipo) : '', c: t.cumplidaEl || '' }; }
const _bpp = buildPortalPayload;
buildPortalPayload = function(s){
  const p = _bpp(s);
  if(gkB64()) p.gk = gkB64();
  const mias = live('tareas').filter(t=> (t.responsables || []).some(r=> r.socioId === s.id));
  if(mias.length) p.mt = mias.map(tareaPortal);
  return p;
};
async function publicarComun(){
  if(!connected() || !gkB64()) return;
  const data = {
    actas: live('actas').filter(a=> a.publico).sort((a, b)=> (b.fecha || '').localeCompare(a.fecha || '')).map(a=> ({ id: a.id, f: a.fecha, t: a.titulo || a.tipo, ti: a.tipo, q: a.quorum || '', as: a.asistentes || '', c: a.contenido || '', ac: (a.acuerdos || []).map(x=> x.texto), ar: (a.archivos || []).map(f=> ({ id: f.id, n: f.nombre, ty: f.tipo, s: f.size })) })),
    tareas: live('tareas').filter(t=> t.publico).map(tareaPortal),
    avisos: typeof avisosPortal === 'function' ? avisosPortal() : [],
  };
  if(typeof filtrarComun === 'function') filtrarComun(data);
  const hash = hex(await shaBytes(JSON.stringify(data) + gkB64())).slice(0, 20);
  if(hash === lsGet('cs_comun_hash::' + conn().fileId, '')) return;
  const key = await gkKey(gkB64());
  const enc = await aesEncrypt(key, JSON.stringify(data));
  const file = JSON.stringify({ v: 1, app: 'gestion-comun', generado: new Date().toISOString(), iv: enc.iv, ct: enc.ct });
  let sha = null; try{ const cur = await ghGetFile(comunName()); sha = cur && cur.sha; }catch(e){}
  await ghPutFile(comunName(), file, sha, 'Actas y acuerdos (' + yo() + ')');
  lsSet('cs_comun_hash::' + conn().fileId, hash);
}
const _pubPortal = publishPortal;
publishPortal = async function(force, onProgress, silent){
  const r = await _pubPortal(force, onProgress, silent);
  try{ await publicarComun(); }catch(e){ if(!silent) toast('⚠ Actas: ' + (e.message || e), 'bad'); }
  return r;
};

/* =====================================================================
   AVISOS Y COMUNICADOS
   - Avisos con fecha (asambleas, reuniones, actividades, plazos) y
     comunicados sin fecha.
   - Agenda: próximas fechas de avisos + plazos de tareas abiertas.
   - Lo público se publica en el portal de socios (archivo común).
   ===================================================================== */
const TIPOS_AVISO = {
  asamblea: ['🗳️', 'Asamblea'], reunion: ['👥', 'Reunión de directiva'], actividad: ['🎉', 'Actividad'],
  plazo: ['⏰', 'Plazo / recordatorio'], comunicado: ['📢', 'Comunicado'],
};
const DIAS_S = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES_A = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
['aviso-ver', 'av-wa'].forEach(a=> ACT_LIBRES.add(a));

function fechaLarga(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return ''; const d = new Date(+m[1], +m[2] - 1, +m[3]); return `${DIAS_S[d.getDay()]} ${+m[3]} de ${MESES[+m[2] - 1]}`; }
function diasHasta(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; const h = new Date(); h.setHours(0, 0, 0, 0); return Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - h) / 86400000); }
function cuandoTxt(iso){ const n = diasHasta(iso); if(n == null) return ''; if(n === 0) return 'hoy'; if(n === 1) return 'mañana'; if(n === -1) return 'ayer'; return n > 0 ? 'en ' + n + ' días' : 'hace ' + (-n) + ' días'; }
function fechaChip(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `<div class="dchip"><b>${+m[3]}</b><span>${MESES_A[+m[2] - 1]}</span></div>` : '<div class="dchip sin">📢</div>'; }

/* Agenda combinada: avisos con fecha + plazos de tareas abiertas */
function agendaItems(soloPublico){
  const hoy = todayISO();
  const av = live('avisos').filter(a=> a.fecha && a.fecha >= hoy && (!soloPublico || a.publico)).map(a=> ({ k: 'a', f: a.fecha, h: a.hora || '', a }));
  const ts = live('tareas').filter(t=> t.estado !== 'cumplida' && t.plazo && (!soloPublico || t.publico)).map(t=> ({ k: 't', f: t.plazo, h: '', t }));
  return av.concat(ts).sort((x, y)=> (x.f + x.h).localeCompare(y.f + y.h));
}
function agendaRow(it){
  if(it.k === 'a'){
    const a = it.a, tp = TIPOS_AVISO[a.tipo] || TIPOS_AVISO.comunicado;
    return `<div class="row click" data-act="aviso-ver" data-id="${a.id}">${fechaChip(a.fecha)}<div class="main"><div class="title">${tp[0]} ${esc(a.titulo)}</div>
      <div class="sub">${esc(fechaLarga(a.fecha))}${a.hora ? ', ' + esc(a.hora) + ' h' : ''}${a.lugar ? ' · 📍 ' + esc(a.lugar) : ''} · ${cuandoTxt(a.fecha)}</div></div>
      ${a.publico ? '<span class="chip ok">Socios</span>' : '<span class="chip neutral">Directiva</span>'}</div>`;
  }
  const t = it.t, venc = t.plazo < todayISO();
  return `<div class="row click" data-act="tarea-ver" data-id="${t.id}">${fechaChip(t.plazo)}<div class="main"><div class="title">✅ ${esc(t.texto)}</div>
    <div class="sub">Plazo de tarea${respTxt(t) ? ' · 👤 ' + esc(respTxt(t)) : ''} · ${venc ? '<b style="color:var(--bad)">venció ' + cuandoTxt(t.plazo) + '</b>' : cuandoTxt(t.plazo)}</div></div>
    <span class="chip ${ESTADOS_T[t.estado || 'pendiente'][2]}">${ESTADOS_T[t.estado || 'pendiente'][0]}</span></div>`;
}

    <div class="card"><div class="card-head"><h2>📢 Comunicados</h2><button class="btn sm" data-act="aviso-nuevo" data-tipo="comunicado">+ Comunicado</button></div>
      ${com.length ? com.map(a=> `<div class="row click" data-act="aviso-ver" data-id="${a.id}">${fechaChip('')}<div class="main"><div class="title">${esc(a.titulo)}</div><div class="sub">${a.texto ? esc(a.texto.slice(0, 110)) + (a.texto.length > 110 ? '…' : '') + ' · ' : ''}publicado ${fdate(a.creado)}</div></div>${a.publico ? '<span class="chip ok">Socios</span>' : '<span class="chip neutral">Directiva</span>'}</div>`).join('') : '<div class="dim small">Sin comunicados.</div>'}

/* =====================================================================
   DIRECTIVA CON CUENTAS DE GOOGLE + APROBACIÓN DEL TESORERO
   - Cada dirigente se identifica con su cuenta de Google (correo verificado
     por Google). Solo los correos de la lista pueden hacer cambios.
   - Actas, tareas y avisos: cualquier dirigente edita libremente.
   - Finanzas (socios, pagos, cobros, planes, gastos, ingresos, ajustes…):
     los cambios de otros dirigentes quedan "por aprobar" y no cuentan
     hasta que el tesorero los aprueba.
   - Ajustes de la directiva y del bloqueo: solo el tesorero.
   ===================================================================== */
const FIN_COLS = ['tarifas', 'socios', 'pagos', 'cobros', 'ajustes', 'planes', 'autoriz', 'acuerdos', 'nominas', 'gastos', 'ingresos'];
const CFG_PROTEGIDA = ['directiva', 'bloqueo', 'diaVencimiento', 'mesInicioDefault'];
const ID_SCOPE = 'openid email profile';
const ID_DIAS = 30;
['id-login', 'id-logout', 'prop-ver', 'tf-prop', 'abrir-mod'].forEach(a=> ACT_LIBRES.add(a));

/* ---------- Identidad ---------- */
function idTok(){ try{ return JSON.parse(lsGet('cs_id', 'null') || 'null'); }catch(e){ return null; } }
function idEmail(){ const t = idTok(); return t && t.email && Date.now() < t.hasta ? t.email : ''; }
function dirCfg(cfg){ const d = (cfg || S.config).directiva; return d && d.on && d.tesorero ? d : null; }
function dirGuardada(){ try{ const p = JSON.parse(lsGet('cs_state', 'null') || 'null'); return dirCfg((p && p.config) || {}); }catch(e){ return null; } }
function dirOn(){ return !!dirCfg(); }
function miembroDe(email, d){ d = d || dirCfg(); email = String(email || '').toLowerCase(); if(!d || !email) return null; if(email === d.tesorero) return Object.assign({ email, cargo: 'Tesorero' }, (d.miembros || []).find(m=> m.email === email) || {}, { tesorero: true }); return (d.miembros || []).find(m=> m.email === email) || null; }
function esTesorero(){ const d = dirGuardada() || dirCfg(); return !d || idEmail() === d.tesorero; }
function soyMiembro(){ return !!miembroDe(idEmail(), dirGuardada() || dirCfg()); }
function nombreDe(m){ return m ? (m.nombre || m.email) + (m.cargo ? ' (' + m.cargo + ')' : '') : ''; }

function idLogin(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){ gdLoadGis().catch(()=>{}); return Promise.reject(new Error('Cargando Google… espera 2 segundos y toca de nuevo.')); }
  return new Promise((resolve, reject)=>{
    const prev = idTok();
    google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(), scope: ID_SCOPE,
      callback: async resp=>{
        if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
        try{
          const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } });
          const u = await r.json();
          if(!u.email || u.email_verified === false) throw new Error('Google no entregó un correo verificado.');
          lsSet('cs_id', JSON.stringify({ email: u.email.toLowerCase(), name: u.name || '', hasta: Date.now() + ID_DIAS * 86400000 }));
          resolve(u.email.toLowerCase());
        }catch(e){ reject(e); }
      },
      error_callback: err=> reject(new Error(err && err.type === 'popup_closed' ? 'Se cerró la ventana de Google.' : 'No se pudo abrir la ventana de Google.')),
    }).requestAccessToken({ prompt: prev && prev.email ? '' : 'select_account', login_hint: prev && prev.email ? prev.email : undefined });
  });
}
ACT['id-login'] = ()=> idLogin().then(e=>{ const m = miembroDe(e, dirGuardada() || dirCfg()); toast(m ? '✓ Sesión iniciada: ' + nombreDe(m) : `La cuenta ${e} no está en la directiva: solo puedes mirar.`, m ? 'ok' : 'bad', 8000); renderView(); refreshOpenModal(); }).catch(e=> toast('⚠ ' + e.message, 'bad'));
ACT['id-logout'] = ()=>{ lsSet('cs_id', null); renderView(); };
setTimeout(()=>{ if(dirOn() && typeof gdLoadGis === 'function') gdLoadGis().catch(()=>{}); }, 1500);

/* ---------- Permisos: se integran con el bloqueo existente ---------- */
const _puedeCambiarD = puedeCambiar;
puedeCambiar = function(){
  const d = dirGuardada(); if(!d) return _puedeCambiarD();
  const e = idEmail(); if(!e || !miembroDe(e, d)) return false;
  if(e === d.tesorero) return !lockGuardado() || desbloqueado();
  return true;
};
const _abrirDesbloqueoD = abrirDesbloqueo;
abrirDesbloqueo = function(despues){
  const d = dirGuardada();
  if(!d || (idEmail() === d.tesorero)) return _abrirDesbloqueoD(despues);
  if(modalStack.some(m=> m.el._idm)) return;
  const e = idEmail();
  openModal({
    title: ()=> '👤 Identifícate para hacer cambios',
    body: ()=> e && !miembroDe(e, d)
      ? `<div class="note bad small">La cuenta <b>${esc(e)}</b> no está en la lista de la directiva, así que solo puedes mirar. Si eres dirigente, pide al tesorero que agregue tu correo de Google.</div>`
      : `<p class="small">Inicia sesión con tu cuenta de Google. Tu nombre quedará registrado en cada cambio que hagas.</p><p class="dim tiny">Los cambios en Finanzas quedan pendientes hasta que el tesorero los apruebe.</p>`,
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="idmGo">${e && !miembroDe(e, d) ? 'Usar otra cuenta' : 'Iniciar sesión con Google'}</button>`,
    onMount: el=>{
      el._idm = true;
      $('#idmGo', el).onclick = ()=>{
        if(e && !miembroDe(e, d)) lsSet('cs_id', null);
        idLogin().then(em=>{
          closeModal();
          if(!miembroDe(em, d)){ toast(`La cuenta ${em} no está en la directiva.`, 'bad', 8000); renderView(); return; }
          if(em === d.tesorero && lockGuardado() && !desbloqueado()){ renderView(); _abrirDesbloqueoD(despues); return; }
          toast('✓ Hola, ' + nombreDe(miembroDe(em, d)), 'ok'); renderView(); if(despues) setTimeout(despues, 50);
        }).catch(err=> toast('⚠ ' + err.message, 'bad'));
      };
    },
  });
};
const _yoD = yo;
yo = function(){ const d = dirGuardada() || dirCfg(); if(d){ const m = miembroDe(idEmail(), d); if(m) return nombreDe(m); } return _yoD(); };
const _lockCardD = lockCardHtml;
