<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2E7553">
<title>Cuotas Sindicales</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<script>
  window.PALETAS = {
    bosque:   ['Bosque',    '#2E7553', '#1F573D', '#E6F2EC', '#BFDCCD', '#6FC49A', '#A3DCC0'],
    indigo:   ['Índigo',    '#4453C4', '#2F3B99', '#ECEEFB', '#C9CEF2', '#9AA6F2', '#C3CAF7'],
    oceano:   ['Océano',    '#1D6A88', '#134E66', '#E4F0F5', '#BBD7E3', '#6BB8D6', '#A3D4E8'],
    ciruela:  ['Ciruela',   '#764689', '#573266', '#F2EBF5', '#DCC8E4', '#C29AD4', '#DCC3E6'],
    terracota:['Terracota', '#A9512F', '#7F3B21', '#F8EBE5', '#EBCBBE', '#E39A7C', '#EFC0AC'],
    rosa:     ['Rosa',      '#B4386C', '#86264F', '#FBEAF1', '#F0C6D8', '#EE8FB5', '#F5BCD3'],
    grafito:  ['Grafito',   '#3A4250', '#232933', '#ECEEF1', '#CDD2DA', '#AEB6C4', '#D2D7E0'],
  };
  window.aplicarTema = function(){
    var tema = 'claro', pal = 'bosque';
    try{ tema = localStorage.getItem('cs_tema') || 'claro'; pal = localStorage.getItem('cs_paleta') || 'bosque'; }catch(e){}
    var v = window.PALETAS[pal] || window.PALETAS.bosque;
    var dark = tema === 'oscuro';
    var de = document.documentElement;
    de.setAttribute('data-theme', dark ? 'dark' : 'light');
    var rgba = function(h, a){ return 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')'; };
    de.style.setProperty('--primary', dark ? v[5] : v[1]);
    de.style.setProperty('--primary-dark', dark ? v[6] : v[2]);
    de.style.setProperty('--primary-light', dark ? rgba(v[5], 0.16) : v[3]);
    de.style.setProperty('--primary-line', dark ? rgba(v[5], 0.4) : v[4]);
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', dark ? '#15181E' : v[1]);
  };
  window.aplicarTema();
</script>
<style>
:root{
  --primary:#2E7553; --primary-dark:#1F573D; --primary-light:#E6F2EC; --primary-line:#BFDCCD;
  --bg:#F4F5F7; --card:#FFFFFF; --text:#1B2130; --dim:#586174; --border:#E2E5EA; --input:#FFFFFF;
  --ok:#1C6B44; --ok-bg:#E5F4EC; --warn:#7A4F00; --warn-bg:#FBF0D9; --bad:#A3241C; --bad-bg:#FBE9E7; --neutral-bg:#ECEEF1; --info:#1D5A88; --info-bg:#E4EFF8;
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#15181E; --card:#1E222A; --text:#E8EAEF; --dim:#A3AAB8; --border:#2D323C; --input:#171A20;
  --ok:#34D399; --ok-bg:rgba(52,211,153,0.14); --warn:#FBBF24; --warn-bg:rgba(251,191,36,0.14); --bad:#F87171; --bad-bg:rgba(248,113,113,0.14); --neutral-bg:rgba(255,255,255,0.06); --info:#7CC0F0; --info-bg:rgba(124,192,240,0.14);
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:16px; line-height:1.45; }
h1,h2,h3,.num,.brand{ font-family:Manrope,'Source Sans 3',sans-serif; }
button{ font:inherit; }
.topbar{ position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--border); }
.topbar-in{ max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px 6px; }
.brand{ font-weight:800; font-size:1.05rem; color:var(--primary-dark); display:flex; align-items:center; gap:8px; min-width:0; }
.brand span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.brand-ico{ width:30px; height:30px; border-radius:9px; background:var(--primary); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:1rem; flex:none; }
.sync-chip{ border:1px solid var(--border); background:var(--bg); color:var(--dim); border-radius:999px; padding:5px 11px; font-size:0.8rem; font-weight:700; cursor:pointer; white-space:nowrap; flex:none; }
.sync-chip.ok{ color:var(--ok); background:var(--ok-bg); border-color:transparent; }
.sync-chip.busy{ color:var(--info); background:var(--info-bg); border-color:transparent; }
.sync-chip.bad{ color:var(--bad); background:var(--bad-bg); border-color:transparent; }
.tabs{ max-width:980px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; padding:0 12px 8px; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ flex:none; border:none; background:transparent; color:var(--dim); font-weight:700; font-size:0.92rem; padding:8px 12px; border-radius:10px; cursor:pointer; white-space:nowrap; }
.tabs button.active{ background:var(--primary-light); color:var(--primary-dark); }
main{ max-width:980px; margin:0 auto; padding:16px 16px 60px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.card > h2:first-child, .card > .card-head:first-child{ margin-top:0; }
h2{ font-size:1.08rem; margin:0 0 10px; font-weight:800; }
h3{ font-size:0.98rem; margin:14px 0 8px; font-weight:700; }
.card-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.card-head h2{ margin:0; }
.dim{ color:var(--dim); } .small{ font-size:0.85rem; } .tiny{ font-size:0.78rem; }
.tiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
@media (max-width:720px){ .tiles{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.tile{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; min-width:0; }
.tile .num{ font-size:1.55rem; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.tile .lbl{ color:var(--dim); font-size:0.8rem; font-weight:600; margin-top:2px; }
.tile.accent{ background:var(--primary); border-color:var(--primary); color:#fff; }
.tile.accent .lbl{ color:rgba(255,255,255,0.88); }
:root[data-theme="dark"] .tile.accent{ color:#10141a; } :root[data-theme="dark"] .tile.accent .lbl{ color:rgba(16,20,26,0.75); }
.num.ok{ color:var(--ok); } .num.bad{ color:var(--bad); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:8px 14px; border-radius:11px; border:1px solid var(--border); background:var(--card); color:var(--text); font-weight:700; cursor:pointer; text-decoration:none; font-size:0.95rem; }
.btn.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
:root[data-theme="dark"] .btn.primary{ color:#10141a; }
.btn.danger{ color:var(--bad); border-color:var(--bad-bg); background:var(--bad-bg); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--primary); padding:6px 8px; min-height:34px; }
.btn.sm{ min-height:34px; padding:5px 10px; font-size:0.85rem; border-radius:9px; }
.btn:disabled{ opacity:0.5; cursor:default; }
.btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
.quick{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:10px; margin-bottom:14px; }
.quick .btn{ min-height:52px; font-size:1rem; }
label.f{ display:flex; flex-direction:column; gap:4px; font-size:0.82rem; font-weight:700; color:var(--dim); min-width:0; }
input, select, textarea{ font:inherit; font-size:1rem; color:var(--text); background:var(--input); border:1px solid var(--border); border-radius:10px; padding:9px 11px; width:100%; min-width:0; }
input:focus, select:focus, textarea:focus{ outline:2px solid var(--primary-line); border-color:var(--primary); }
textarea{ min-height:90px; resize:vertical; }
.grid2{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 12px; }
.grid3{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px 12px; }
@media (max-width:600px){ .grid2, .grid3{ grid-template-columns:1fr; } }
.span2{ grid-column:1 / -1; }
.check{ display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer; }
.check input{ width:20px; height:20px; flex:none; accent-color:var(--primary); }
.row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.row:last-child{ border-bottom:none; }
.row .main{ min-width:0; flex:1; }
.row .title{ font-weight:700; overflow-wrap:anywhere; }
.row .sub{ color:var(--dim); font-size:0.82rem; }
.row.click{ cursor:pointer; }
.row.click:hover .title{ color:var(--primary-dark); }
.val{ font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
.val.bad{ color:var(--bad); } .val.ok{ color:var(--ok); }
.chip{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:0.78rem; font-weight:700; white-space:nowrap; }
.chip.ok{ background:var(--ok-bg); color:var(--ok); }
.chip.warn{ background:var(--warn-bg); color:var(--warn); }
.chip.bad{ background:var(--bad-bg); color:var(--bad); }
.chip.info{ background:var(--info-bg); color:var(--info); }
.chip.neutral{ background:var(--neutral-bg); color:var(--dim); }
.chip.primary{ background:var(--primary-light); color:var(--primary-dark); }
.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.toolbar input[type=search]{ flex:1 1 200px; }
.toolbar select{ width:auto; flex:0 1 auto; }
.seg{ display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button{ border:none; background:transparent; color:var(--dim); font-weight:700; font-size:0.85rem; padding:6px 10px; border-radius:8px; cursor:pointer; }
.seg button.active{ background:var(--card); color:var(--primary-dark); box-shadow:0 1px 2px rgba(0,0,0,0.12); }
.empty{ color:var(--dim); text-align:center; padding:18px 8px; }
.note{ background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:10px 12px; font-size:0.88rem; color:var(--dim); margin:10px 0; }
.note.warn{ background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.note.bad{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
.note.ok{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
.table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:11px; }
table.t{ width:100%; border-collapse:collapse; font-size:0.9rem; }
table.t th, table.t td{ padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; }
table.t th{ font-size:0.78rem; color:var(--dim); font-weight:800; background:var(--bg); position:sticky; top:0; white-space:nowrap; }
table.t tr:last-child td{ border-bottom:none; }
table.t td.r, table.t th.r{ text-align:right; font-variant-numeric:tabular-nums; }
table.t input{ padding:6px 8px; font-size:0.95rem; }
table.t tr.done td{ opacity:0.55; }
.months{ display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px; }
@media (max-width:420px){ .months{ grid-template-columns:repeat(4, minmax(0,1fr)); } }
.mcell{ border-radius:10px; padding:7px 4px; text-align:center; font-size:0.78rem; font-weight:700; line-height:1.2; border:1px solid transparent; }
.mcell b{ display:block; font-size:0.85rem; text-transform:capitalize; }
.mcell.pagado{ background:var(--ok-bg); color:var(--ok); }
.mcell.parcial{ background:var(--warn-bg); color:var(--warn); }
.mcell.adeuda{ background:var(--bad-bg); color:var(--bad); }
.mcell.porvencer{ background:var(--info-bg); color:var(--info); }
.mcell.adelantado{ background:var(--primary-light); color:var(--primary-dark); }
.mcell.exento, .mcell.nosocio{ background:var(--neutral-bg); color:var(--dim); }
.legend{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.yearbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.yearbar b{ font-family:Manrope,sans-serif; font-size:1.05rem; min-width:52px; text-align:center; }
.modal-bg{ position:fixed; inset:0; z-index:50; background:rgba(15,18,25,0.5); display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 12px; }
.modal{ width:100%; max-width:640px; background:var(--card); color:var(--text); border-radius:18px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,0.25); }
.modal.wide{ max-width:860px; }
.modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
.modal-head h2{ margin:0; font-size:1.2rem; }
.x{ width:38px; height:38px; flex:none; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer; font-size:1.1rem; }
.modal-foot{ display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; margin-top:16px; }
@media (max-width:600px){ .modal-bg{ padding:0; align-items:stretch; } .modal{ border-radius:0; min-height:100%; } }
#toasts{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; width:min(92vw, 460px); }
.toast{ background:#1B2130; color:#fff; border-radius:12px; padding:11px 14px; font-weight:600; font-size:0.92rem; display:flex; gap:10px; align-items:flex-start; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
.toast span{ flex:1; }
.toast button{ background:transparent; border:none; color:#fff; cursor:pointer; font-size:1rem; padding:0 2px; }
.toast.bad{ background:#8E1F18; } .toast.ok{ background:#1F573D; }
.preview{ background:var(--primary-light); color:var(--primary-dark); border-radius:11px; padding:10px 12px; font-size:0.88rem; margin-top:10px; }
.picker-list{ max-height:280px; overflow-y:auto; border:1px solid var(--border); border-radius:11px; margin-top:6px; }
.picker-list button{ display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left; border:none; border-bottom:1px solid var(--border); background:transparent; color:var(--text); padding:10px 12px; cursor:pointer; }
.picker-list button:last-child{ border-bottom:none; }
.picker-list button:hover, .picker-list button.sel{ background:var(--primary-light); }
.sel-socio{ display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--primary-line); background:var(--primary-light); border-radius:11px; padding:10px 12px; }
.qrbox{ background:#fff; border-radius:12px; padding:10px; width:200px; max-width:100%; }
.qrbox svg{ width:100%; height:auto; display:block; }
.pin{ font-family:Manrope,monospace; font-size:1.6rem; font-weight:800; letter-spacing:0.2em; }
.copy-box{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.78rem; word-break:break-all; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; max-height:120px; overflow:auto; }
.steps{ margin:6px 0 0; padding-left:20px; } .steps li{ margin:4px 0; }
details.adv > summary{ cursor:pointer; color:var(--primary); font-weight:700; padding:6px 0; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:0.92rem; }
.kv dt{ color:var(--dim); font-weight:600; } .kv dd{ margin:0; font-weight:700; overflow-wrap:anywhere; }
.welcome{ max-width:560px; margin:30px auto; }
.welcome .big{ font-size:2.6rem; }
.pl-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.pl-row:last-child{ border-bottom:none; }
.pl-main{ min-width:0; flex:1 1 260px; }
.pl-main .title{ font-weight:800; color:var(--text); text-decoration:none; overflow-wrap:anywhere; }
.pl-main .sub{ color:var(--dim); font-size:0.84rem; }
.pl-btns{ display:flex; gap:6px; flex-wrap:wrap; }
.pl-b{ min-height:40px; padding:6px 11px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--dim); font-weight:700; font-size:0.85rem; cursor:pointer; white-space:nowrap; }
.pl-b.on.autorizado{ background:var(--info-bg); color:var(--info); border-color:transparent; }
.pl-b.on.descontado{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
.pl-b.on.rechazado{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
@media (max-width:520px){ .pl-btns{ width:100%; flex-wrap:nowrap; } .pl-b{ flex:1 1 0; min-width:0; padding:6px 2px; font-size:0.76rem; white-space:normal; line-height:1.15; } }
#acTabla a{ color:var(--text); text-decoration:none; }
#acTabla .ac-b{ margin-top:6px; width:100%; min-height:34px; font-size:0.8rem; }
#acTabla tr.done td{ opacity:1; } #acTabla tr.done input{ opacity:0.6; }
@media (max-width:520px){ #acTabla th, #acTabla td{ padding:7px 6px; } #acTabla td:first-child{ font-size:0.9rem; } }
#printArea{ display:none; }
@media print{
  body > *:not(#printArea){ display:none !important; }
  #printArea{ display:block !important; color:#000; font-family:Calibri, Carlito, Arial, sans-serif; font-size:11pt; }
  body{ background:#fff; }
  @page{ size:letter; margin:12mm; }
  .p-cards{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8mm; }
  .p-card{ border:1px dashed #888; border-radius:4mm; padding:5mm; display:flex; gap:5mm; align-items:center; break-inside:avoid; height:58mm; }
  .p-card .q{ width:44mm; flex:none; } .p-card .q svg{ width:100%; height:auto; display:block; }
  .p-card .n{ font-weight:700; font-size:13pt; } .p-card .s{ font-size:9.5pt; color:#333; margin-top:2mm; }
  .p-pins{ display:grid; grid-template-columns:repeat(3, 1fr); gap:4mm; }
  .p-pin{ border:1px dashed #888; padding:4mm; break-inside:avoid; }
  .p-pin b{ display:block; font-size:16pt; letter-spacing:2pt; margin-top:1mm; }
  table.p{ width:100%; border-collapse:collapse; margin:3mm 0; }
  table.p th, table.p td{ border:1px solid #000; padding:1.5mm 2.5mm; text-align:left; font-size:10pt; }
  table.p td.r, table.p th.r{ text-align:right; }
  .p-break{ break-after:page; }
  h1.p{ font-size:14pt; margin:0 0 2mm; } h2.p{ font-size:12pt; margin:5mm 0 2mm; }
}
.n-baja{ color:var(--dim); text-decoration:line-through; text-decoration-thickness:1.5px; font-weight:600; }
.n-susp{ display:inline-flex; align-items:center; gap:6px; }
.dot-susp{ width:9px; height:9px; border-radius:50%; background:#D92D20; flex:none; display:inline-block; }
:root[data-theme="dark"] .dot-susp{ background:#F87171; }
.n-chip{ font-size:0.7rem; padding:2px 7px; vertical-align:middle; }

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-ico" aria-hidden="true">✊</span><span id="brandName">Cuotas Sindicales</span></div>
    <button type="button" class="sync-chip" id="syncChip" data-act="sync-now">Sin conexión</button>
  </div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="inicio">🏠 Inicio</button>
    <button type="button" data-tab="socios">👥 Socios</button>
    <button type="button" data-tab="pagos">💵 Pagos</button>
    <button type="button" data-tab="planes">🤝 Planes de pago</button>
    <button type="button" data-tab="cuotas">📅 Cuotas</button>
    <button type="button" data-tab="portal">🪪 Portal</button>
    <button type="button" data-tab="ajustes">⚙️ Ajustes</button>
  </nav>
</header>
<main id="view"></main>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   CUOTAS SINDICALES — administración de cuotas y deuda de socios
   Un solo archivo. Datos locales en el dispositivo + sincronización
   cifrada entre dirigentes a través de un repositorio de GitHub.
   ===================================================================== */

/* ---------- Utilidades ---------- */
const $ = (s, el)=> (el || document).querySelector(s);
const $$ = (s, el)=> Array.from((el || document).querySelectorAll(s));
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = ()=> Date.now();
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function miles(n){ const v = Math.round(Math.abs(Number(n) || 0)); return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function clp(n){ n = Math.round(Number(n) || 0); return (n < 0 ? '-$' : '$') + miles(n); }
function parseMonto(str){ const s = String(str == null ? '' : str).replace(/[^\d-]/g, ''); const n = parseInt(s, 10); return isNaN(n) ? 0 : n; }
function pad2(n){ return String(n).padStart(2, '0'); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function curYm(){ return todayISO().slice(0, 7); }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function ymToIdx(ym){ const m = String(ym || '').match(/^(\d{4})-(\d{2})/); if(!m) return NaN; return Number(m[1]) * 12 + Number(m[2]) - 1; }
function idxToYm(i){ const y = Math.floor(i / 12), m = i % 12 + 1; return y + '-' + pad2(m); }
function mesLabel(ym, corto){ const i = ymToIdx(ym); if(isNaN(i)) return ''; const m = i % 12, y = Math.floor(i / 12); return corto ? `${MESES_C[m]} ${y}` : `${MESES[m]} ${y}`; }
function mesLabelCap(ym){ const s = mesLabel(ym); return s.charAt(0).toUpperCase() + s.slice(1); }
function fdate(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function fdatetime(ts){ if(!ts) return ''; const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function normTxt(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : v; }catch(e){ return def; } }
function lsSet(k, v){ try{ if(v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
const TOKEN_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function randomToken(len){ const b = crypto.getRandomValues(new Uint8Array(len)); let s = ''; for(const x of b) s += TOKEN_ALPHA[x % TOKEN_ALPHA.length]; return s; }
function randomPin(){ const b = crypto.getRandomValues(new Uint32Array(1)); return String(b[0] % 10000).padStart(4, '0'); }
function randomId(len){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; const b = crypto.getRandomValues(new Uint8Array(len)); let s = ''; for(const x of b) s += a[x % a.length]; return s; }
function formatRut(r){
  const c = String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
  if(c.length < 2) return String(r || '').trim();
  const body = c.slice(0, -1), dv = c.slice(-1);
  return body.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
}
function rutValido(r){
  const c = String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
  if(c.length < 2) return false;
  const body = c.slice(0, -1), dv = c.slice(-1);
  let s = 0, m = 2;
  for(let i = body.length - 1; i >= 0; i--){ s += Number(body[i]) * m; m = m === 7 ? 2 : m + 1; }
  const r2 = 11 - (s % 11);
  const exp = r2 === 11 ? '0' : r2 === 10 ? 'K' : String(r2);
  return exp === dv;
}

/* ---------- Estado ----------
   Cada registro lleva id, u (última modificación, ms) y del (borrado lógico).
   Así los cambios de varios dirigentes se combinan registro por registro sin pisarse. */
const COLS = ['tarifas', 'socios', 'pagos', 'cobros', 'ajustes', 'planes', 'autoriz', 'acuerdos', 'nominas'];
const MEDIOS = ['Efectivo', 'Transferencia', 'Descuento por planilla', 'Depósito', 'Otro'];
function emptyState(){
  return { v: 1, config: { nombre: '', diaVencimiento: 10, mesInicioDefault: curYm(), portalAuto: true, u: 0 }, tarifas: [], socios: [], pagos: [], cobros: [], ajustes: [] };
}
function normalizeState(s){
  const e = emptyState();
  if(!s || typeof s !== 'object') return e;
  const out = { v: 1, config: Object.assign({}, e.config, s.config || {}) };
  COLS.forEach(c=> out[c] = Array.isArray(s[c]) ? s[c].filter(x=> x && x.id) : []);
  return out;
}
let S = normalizeState(JSON.parse(lsGet('cs_state', 'null') || 'null'));
function saveLocal(){ lsSet('cs_state', JSON.stringify(S)); }
function live(col){ return S[col].filter(x=> !x.del); }
function getById(col, id){ return S[col].find(x=> x.id === id && !x.del) || null; }

let _cache = new Map();
function invalidate(){ _cache = new Map(); }
function upsert(col, obj, opts){
  obj.u = now();
  const i = S[col].findIndex(x=> x.id === obj.id);
  if(i >= 0) S[col][i] = obj; else S[col].push(obj);
  changed(opts);
}
function removeRec(col, id, opts){
  const x = S[col].find(r=> r.id === id);
  if(x){ x.del = true; x.u = now(); changed(opts); }
}
function setConfig(patch, opts){ Object.assign(S.config, patch); S.config.u = now(); changed(opts); }
let changeSeq = 0;
function changed(opts){
  changeSeq++;
  invalidate();
  saveLocal();
  lsSet('cs_dirty', '1');
  scheduleSync();
  if(!(opts && opts.noRender)) renderView();
}

/* Combina dos estados: por cada registro gana la versión más reciente */
function mergeStates(a, b){
  a = normalizeState(a); b = normalizeState(b);
  const out = { v: 1, config: (b.config.u || 0) > (a.config.u || 0) ? b.config : a.config };
  COLS.forEach(c=>{
    const map = new Map();
    a[c].forEach(x=> map.set(x.id, x));
    b[c].forEach(x=>{ const y = map.get(x.id); if(!y || (x.u || 0) > (y.u || 0)) map.set(x.id, x); });
    out[c] = Array.from(map.values());
  });
  return out;
}
function canonical(s){
  const o = { config: s.config };
  COLS.forEach(c=> o[c] = s[c].slice().sort((x, y)=> x.id < y.id ? -1 : 1));
  return JSON.stringify(o);
}

/* ---------- Cálculo de cuotas y deuda ----------
   La deuda de cada socio se calcula sola: cuotas mensuales desde su mes de ingreso,
   más cobros extraordinarios y cargos, menos pagos y descuentos.
   Los pagos se imputan primero a lo más antiguo (FIFO). */
function tarifaDe(ym){
  const i = ymToIdx(ym);
  let best = null;
  live('tarifas').forEach(t=>{ const ti = ymToIdx(t.desde); if(!isNaN(ti) && ti <= i && (!best || ti > ymToIdx(best.desde))) best = t; });
  return best ? Number(best.monto) || 0 : 0;
}
function tarifaActual(){ return tarifaDe(curYm()); }
function diaVenc(){ const d = Number(S.config.diaVencimiento); return d >= 1 && d <= 31 ? d : 10; }
/* Último mes ya vencido (índice). Si hoy no llega al día de vencimiento, el mes en curso aún no vence. */
function dueIdx(){ const d = new Date(); const cur = ymToIdx(curYm()); return d.getDate() >= diaVenc() ? cur : cur - 1; }
function itemClave(it){ return it.tipo + '|' + it.mes + '|' + (it.ref || ''); }
function socioInicio(s){ return s.mesInicio || S.config.mesInicioDefault || curYm(); }
function suspEn(s, i){ if(!s.suspDesde) return false; const a = ymToIdx(s.suspDesde), b = s.suspHasta ? ymToIdx(s.suspHasta) : Infinity; return i >= a && i <= b; }
function socioSuspendido(s){ return suspEn(s, ymToIdx(curYm())); }
function socioBaja(s){ return !!s.mesTermino; }
/* Nombre con su estado: dados de baja en gris tachado; suspendidos con punto rojo */
function nombreHtml(s, opts){
  if(!s) return '<span class="dim">(eliminado)</span>';
  const n = esc(s.nombre);
  if(socioBaja(s)) return `<span class="n-baja" title="Dado de baja (último mes: ${esc(mesLabel(s.mesTermino))})">${n}</span>`;
  if(socioSuspendido(s)) return `<span class="n-susp" title="Suspendido">${n}<span class="dot-susp" aria-label="Suspendido"></span></span>${opts && opts.chip === false ? '' : ' <span class="chip bad n-chip">Suspendido</span>'}`;
  return n;
}
function socioActivo(s){ return !s.mesTermino || ymToIdx(s.mesTermino) >= ymToIdx(curYm()); }
function cobroAplica(c, s){
  if(c.socios === 'todos') return true;
  return Array.isArray(c.socios) && c.socios.includes(s.id);
}
function cuentaSocio(s, hastaIdx){
  const due = dueIdx();
  const until = Math.max(due, hastaIdx == null ? due : hastaIdx);
  const key = s.id + '|' + until;
  if(_cache.has(key)) return _cache.get(key);
  const start = ymToIdx(socioInicio(s));
  const endSocio = s.mesTermino ? ymToIdx(s.mesTermino) : Infinity;
  const end = Math.min(endSocio, until);
  const aj = live('ajustes').filter(a=> a.socioId === s.id);
  const exentos = new Map(aj.filter(a=> a.tipo === 'exencion').map(a=> [a.mes, a]));
  const items = [];
  for(let i = start; i <= end; i++){
    const ym = idxToYm(i);
    if(suspEn(s, i)){ items.push({ tipo: 'exento', mes: ym, idx: i, monto: 0, concepto: 'Cuota ' + mesLabel(ym) + ' (suspendido)', motivo: 'Suspendido', susp: true }); continue; }
    if(exentos.has(ym)){ items.push({ tipo: 'exento', mes: ym, idx: i, monto: 0, concepto: 'Cuota ' + mesLabel(ym) + ' (exenta)', motivo: exentos.get(ym).concepto || '' }); continue; }
    const m = tarifaDe(ym);
    if(m > 0) items.push({ tipo: 'cuota', mes: ym, idx: i, monto: m, concepto: 'Cuota ' + mesLabel(ym) });
  }
  live('cobros').forEach(c=>{
    const i = ymToIdx(c.mes);
    if(isNaN(i) || i < start || i > endSocio || i > until) return;
    if(!cobroAplica(c, s) || suspEn(s, i)) return;
    items.push({ tipo: 'cobro', mes: c.mes, idx: i, monto: Number(c.monto) || 0, concepto: c.concepto || 'Cobro extraordinario', ref: c.id });
  });
  aj.filter(a=> a.tipo === 'cargo').forEach(a=>{
    const i = ymToIdx(a.mes);
    if(isNaN(i) || i > until) return;
    items.push({ tipo: 'cargo', mes: a.mes, idx: i, monto: Number(a.monto) || 0, concepto: a.concepto || 'Cargo', ref: a.id });
  });
  // dentro de un mes, los cobros y cargos se imputan antes que la cuota (así un aporte pagado junto a la cuota no queda como deuda)
  const ORD = { cobro: 0, cargo: 1, cuota: 2, exento: 2 };
  // Condonaciones: dejan en $0 cuotas, cobros o cargos específicos
  const cond = new Map(aj.filter(a=> a.tipo === 'condonacion').map(a=> [a.clave, a]));
  items.forEach(it=>{ const k = itemClave(it); if(it.monto > 0 && cond.has(k)){ it.montoOriginal = it.monto; it.monto = 0; it.condonado = true; it.condId = cond.get(k).id; it.concepto += ' (condonada)'; } });
  items.sort((x, y)=> x.idx - y.idx || ORD[x.tipo] - ORD[y.tipo]);
  const pagos = live('pagos').filter(p=> p.socioId === s.id);
  const descuentos = aj.filter(a=> a.tipo === 'descuento');
  const totalPagos = pagos.reduce((a, p)=> a + (Number(p.monto) || 0), 0);
  const totalDesc = descuentos.reduce((a, d)=> a + (Number(d.monto) || 0), 0);
  const creditos = totalPagos + totalDesc;
  // 1) Pagos asignados a un mes (p.mes): cubren primero la cuota de ese mes (o sus cobros si p.imp === 'extra').
  // 2) El resto de los pagos y descuentos se imputa a lo más antiguo.
  items.forEach(it=>{ it.pagado = 0; });
  let rem = totalDesc;
  pagos.forEach(p=>{
    let m = Number(p.monto) || 0;
    if(p.mes){
      const delMes = items.filter(it=> it.mes === p.mes && it.monto > 0);
      const orden = p.imp === 'extra' ? delMes.filter(it=> it.tipo === 'cargo').concat(delMes.filter(it=> it.tipo === 'cobro'), delMes.filter(it=> it.tipo === 'cuota')) : delMes.filter(it=> it.tipo === 'cuota').concat(delMes.filter(it=> it.tipo !== 'cuota'));
      orden.forEach(it=>{ const a = Math.min(m, it.monto - it.pagado); if(a > 0){ it.pagado += a; m -= a; } });
    }
    rem += m;
  });
  let totalVencido = 0, deuda = 0;
  const mesesAdeudados = [];
  items.forEach(it=>{
    it.vencido = it.idx <= due;
    if(it.monto <= 0){ it.pagado = 0; it.estado = 'exento'; return; }
    const a = Math.min(rem, it.monto - it.pagado); rem -= a;
    const p = it.pagado + a;
    it.pagado = p;
    it.estado = p >= it.monto ? 'pagado' : (p > 0 ? 'parcial' : 'pendiente');
    if(it.vencido){
      totalVencido += it.monto;
      deuda += it.monto - p;
      if(it.tipo === 'cuota' && it.estado !== 'pagado') mesesAdeudados.push(it.mes);
    }
  });
  const res = {
    items, pagos, descuentos, creditos, totalPagos, totalDesc, totalVencido,
    deuda: Math.max(0, deuda),
    saldoFavor: Math.max(0, creditos - totalVencido),
    mesesAdeudados,
    alDia: deuda <= 0,
    ultimoPago: pagos.slice().sort((a, b)=> (b.fecha || '').localeCompare(a.fecha || ''))[0] || null,
  };
  _cache.set(key, res);
  return res;
}
/* Estado de cada mes de un año para la grilla del socio */
function estadoMeses(s, year){
  const until = ymToIdx(year + '-12');
  const c = cuentaSocio(s, until);
  const due = dueIdx();
  const start = ymToIdx(socioInicio(s));
  const endSocio = s.mesTermino ? ymToIdx(s.mesTermino) : Infinity;
  const out = [];
  for(let m = 1; m <= 12; m++){
    const ym = year + '-' + pad2(m), i = ymToIdx(ym);
    const it = c.items.find(x=> x.mes === ym && (x.tipo === 'cuota' || x.tipo === 'exento'));
    let st, txt = '';
    if(i < start || i > endSocio){ st = 'nosocio'; txt = '—'; }
    else if(!it){ st = 'exento'; txt = 'Sin cuota'; }
    else if(it.tipo === 'exento'){ st = 'exento'; txt = it.susp ? 'Suspendido' : 'Exento'; }
    else if(it.condonado){ st = 'exento'; txt = 'Condonada'; }
    else if(it.estado === 'pagado'){ st = i > due ? 'adelantado' : 'pagado'; txt = i > due ? 'Adelantado' : 'Pagado'; }
    else if(i > due){ st = 'porvencer'; txt = it.estado === 'parcial' ? 'Abono ' + clp(it.pagado) : 'Por vencer'; }
    else if(it.estado === 'parcial'){ st = 'parcial'; txt = 'Debe ' + clp(it.monto - it.pagado); }
    else { st = 'adeuda'; txt = 'Debe ' + clp(it.monto); }
    out.push({ ym, st, txt, item: it });
  }
  return out;
}
/* Qué cubriría un pago nuevo de cierto monto (vista previa antes de guardar) */
function previewPago(s, monto){
  const base = cuentaSocio(s, ymToIdx(curYm()) + 24);
  let rem = monto, covered = [], partial = null;
  for(const it of base.items){
    if(it.monto <= 0 || it.pagado >= it.monto) continue;
    if(rem <= 0) break;
    const a = Math.min(rem, it.monto - it.pagado); rem -= a;
    const p = it.pagado + a;
    if(p >= it.monto) covered.push(it); else partial = { it, p };
  }
  return { covered, partial, sobrante: Math.max(0, rem) };
}
function sociosOrdenados(lista){ return (lista || live('socios')).slice().sort((a, b)=> normTxt(a.nombre).localeCompare(normTxt(b.nombre))); }
function resumenGeneral(){
  const socios = live('socios').filter(socioActivo);
  let deudaTotal = 0, conDeuda = 0, alDia = 0;
  socios.forEach(s=>{ const c = cuentaSocio(s); deudaTotal += c.deuda; if(c.deuda > 0) conDeuda++; else alDia++; });
  // deuda de socios retirados que quedó pendiente
  let deudaRetirados = 0;
  live('socios').filter(s=> !socioActivo(s)).forEach(s=> deudaRetirados += cuentaSocio(s).deuda);
  const mes = curYm();
  const recaudadoMes = live('pagos').filter(p=> (p.fecha || '').slice(0, 7) === mes).reduce((a, p)=> a + (Number(p.monto) || 0), 0);
  return { activos: socios.length, deudaTotal, conDeuda, alDia, recaudadoMes, deudaRetirados };
}

/* =====================================================================
   CIFRADO
   ===================================================================== */
const TE = new TextEncoder(), TD = new TextDecoder();
function bytesToB64(bytes){
  let bin = '';
  const CH = 0x8000;
  for(let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function b64ToBytes(b64){ const bin = atob(b64); const out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function utf8ToB64(str){ return bytesToB64(TE.encode(str)); }
function b64ToUtf8(b64){ return TD.decode(b64ToBytes(String(b64).replace(/\s/g, ''))); }
function b64url(str){ return utf8ToB64(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64url(s){ s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return b64ToUtf8(s); }
async function shaBytes(str){ return new Uint8Array(await crypto.subtle.digest('SHA-256', TE.encode(str))); }
function hex(bytes){ return Array.from(bytes, b=> b.toString(16).padStart(2, '0')).join(''); }
async function pbkdf2Key(secret, saltBytes, iter){
  const base = await crypto.subtle.importKey('raw', TE.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: saltBytes, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function aesEncrypt(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, TE.encode(text)));
  return { iv: bytesToB64(iv), ct: bytesToB64(ct) };
}
async function aesDecrypt(key, iv, ct){
  return TD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(iv) }, key, b64ToBytes(ct)));
}
const ADMIN_ITER = 250000;
let _adminKey = null;
async function adminKey(salt, iter){
  const c = conn();
  const tag = c.clave + '|' + salt + '|' + iter;
  if(_adminKey && _adminKey.tag === tag) return _adminKey.key;
  const key = await pbkdf2Key(c.clave, b64ToBytes(salt), iter);
  _adminKey = { tag, key };
  return key;
}
async function encryptAdminState(state, salt){
  const key = await adminKey(salt, ADMIN_ITER);
  const e = await aesEncrypt(key, JSON.stringify(state));
  return { v: 1, app: 'cuotas-sindicales', salt, iter: ADMIN_ITER, iv: e.iv, ct: e.ct, actualizado: new Date().toISOString(), por: yo() };
}
async function decryptAdminState(file){
  if(!file || file.app !== 'cuotas-sindicales') throw Object.assign(new Error('formato'), { code: 'formato' });
  const key = await adminKey(file.salt, file.iter || ADMIN_ITER);
  try{ return JSON.parse(await aesDecrypt(key, file.iv, file.ct)); }
  catch(e){ throw Object.assign(new Error('clave'), { code: 'clave' }); }
}

/* =====================================================================
   CONEXIÓN CON GITHUB (repositorio compartido por los dirigentes)
   ===================================================================== */
function conn(){ try{ return JSON.parse(lsGet('cs_conn', 'null') || 'null'); }catch(e){ return null; } }
function setConn(c){ lsSet('cs_conn', c ? JSON.stringify(c) : null); _adminKey = null; }
function connected(){ const c = conn(); return !!(c && c.owner && c.repo && c.token && c.clave && c.fileId); }
function yo(){ return lsGet('cs_yo', '') || 'Dirigente'; }
function dataName(){ return 'datos-' + conn().fileId + '.enc.json'; }
function portalName(){ return 'portal-' + conn().fileId + '.json'; }
function ghFullPath(name){ const c = conn(); const f = (c.folder || '').replace(/^\/+|\/+$/g, ''); return (f ? f + '/' : '') + name; }
function ghContentsPath(name){ const c = conn(); return `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${ghFullPath(name).split('/').map(encodeURIComponent).join('/')}`; }
async function gh(path, opts){
  const c = conn();
  const res = await fetch('https://api.github.com' + path, Object.assign({}, opts || {}, {
    headers: Object.assign({ 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28' }, (opts && opts.headers) || {}),
    cache: 'no-store',
  }));
  let body = null;
  try{ body = await res.json(); }catch(e){}
  return { res, body };
}
function ghError(res, body){
  const msg = (body && body.message) || '';
  if(!res) return 'No hay conexión a internet.';
  if(res.status === 401) return 'GitHub no aceptó la llave de acceso (mal copiada o vencida).';
  if(res.status === 403) return 'La llave no tiene permiso para escribir en el repositorio ("Contents: Read and write").';
  if(res.status === 404) return 'No se encontró el repositorio, o la llave no tiene acceso a él.';
  return 'Error de GitHub (' + res.status + ')' + (msg ? ': ' + msg : '');
}
async function ghGetFile(name){
  const c = conn();
  const q = c.branch ? '?ref=' + encodeURIComponent(c.branch) : '';
  const { res, body } = await gh(ghContentsPath(name) + q);
  if(res.status === 404) return null;
  if(!res.ok) throw Object.assign(new Error(ghError(res, body)), { status: res.status });
  let text;
  if(body.content && body.encoding === 'base64') text = b64ToUtf8(body.content);
  else {
    // archivos sobre 1 MB: se leen como blob
    const r2 = await gh(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/blobs/${body.sha}`);
    if(!r2.res.ok) throw Object.assign(new Error(ghError(r2.res, r2.body)), { status: r2.res.status });
    text = b64ToUtf8(r2.body.content);
  }
  return { sha: body.sha, text };
}
async function ghPutFile(name, text, sha, message){
  const c = conn();
  const payload = { message, content: utf8ToB64(text) };
  if(sha) payload.sha = sha;
  if(c.branch) payload.branch = c.branch;
  const { res, body } = await gh(ghContentsPath(name), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if(!res.ok){
    const conflict = res.status === 409 || (res.status === 422 && /sha/i.test((body && body.message) || ''));
    throw Object.assign(new Error(conflict ? 'conflicto' : ghError(res, body)), { status: res.status, conflict });
  }
  return body.content && body.content.sha;
}

/* =====================================================================
   SINCRONIZACIÓN
   Sube y baja el archivo cifrado. Si dos dirigentes guardan a la vez,
   GitHub rechaza al segundo (sha distinto): se vuelve a bajar, se combina
   registro por registro y se reintenta. Nadie pisa los cambios de otro.
   ===================================================================== */
let syncTimer = null, syncRunning = null, syncAgain = false;
let syncState = { st: 'off', msg: '', at: Number(lsGet('cs_last_sync', '0')) || 0 };
function scheduleSync(delay){
  updateChip();
  if(!connected()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=> syncNow(), delay == null ? 1500 : delay);
}
function setSync(st, msg){ syncState.st = st; syncState.msg = msg || ''; if(st === 'ok'){ syncState.at = now(); lsSet('cs_last_sync', String(syncState.at)); } updateChip(); }
function updateChip(){
  const el = $('#syncChip'); if(!el) return;
  el.className = 'sync-chip';
  if(!connected()){ el.textContent = '💾 Solo este equipo'; el.title = 'Datos guardados solo en este dispositivo'; return; }
  const dirty = lsGet('cs_dirty', '0') === '1';
  if(syncState.st === 'busy'){ el.classList.add('busy'); el.textContent = '⟳ Sincronizando…'; }
  else if(syncState.st === 'error'){ el.classList.add('bad'); el.textContent = '⚠ Sin sincronizar'; el.title = syncState.msg; }
  else if(dirty){ el.classList.add('busy'); el.textContent = '● Cambios por subir'; }
  else { el.classList.add('ok'); el.textContent = '✓ Sincronizado'; el.title = syncState.at ? 'Última sincronización: ' + fdatetime(syncState.at) : ''; }
}
async function syncNow(opts){
  if(!connected()) return false;
  if(!navigator.onLine){ setSync('error', 'Sin conexión a internet. Los cambios quedan guardados en este equipo y se subirán al volver la conexión.'); return false; }
  if(syncRunning){ syncAgain = true; return syncRunning; }
  syncRunning = (async ()=>{
    setSync('busy');
    const seqStart = changeSeq;
    const before = canonical(S);
    try{
      let ok = false;
      for(let attempt = 0; attempt < 4 && !ok; attempt++){
        const remote = await ghGetFile(dataName());
        let remoteState = null, sha = null, salt = conn().salt;
        if(remote){
          sha = remote.sha;
          const file = JSON.parse(remote.text);
          salt = file.salt;
          remoteState = normalizeState(await decryptAdminState(file));
        }
        if(!salt){ salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16))); }
        if(conn().salt !== salt){ const c = conn(); c.salt = salt; setConn(c); }
        // S pudo cambiar mientras esperábamos: se combina con lo que haya ahora
        S = remoteState ? mergeStates(S, remoteState) : normalizeState(S);
        saveLocal();
        if(remoteState && canonical(S) === canonical(remoteState)){ ok = true; break; }
        const file = await encryptAdminState(S, salt);
        try{
          await ghPutFile(dataName(), JSON.stringify(file), sha, 'Datos cuotas (' + yo() + ')');
          ok = true;
        }catch(e){ if(!e.conflict) throw e; await new Promise(r=> setTimeout(r, 500 + Math.random() * 800)); }
      }
      if(!ok) throw new Error('No se pudo guardar por cambios simultáneos. Se reintentará.');
      if(changeSeq === seqStart) lsSet('cs_dirty', '0');
      setSync('ok');
      invalidate();
      if(canonical(S) !== before) softRender();
      if(S.config.portalAuto) schedulePortal();
      return true;
    }catch(e){
      let msg = e.message || String(e);
      if(e.code === 'clave') msg = 'La clave compartida no coincide con la del repositorio.';
      if(e instanceof TypeError) msg = 'No se pudo conectar con GitHub (¿sin internet?).';
      setSync('error', msg);
      if(!(opts && opts.silent)) toast('⚠ ' + msg, 'bad');
      return false;
    }finally{
      syncRunning = null;
      if(syncAgain){ syncAgain = false; scheduleSync(300); }
    }
  })();
  return syncRunning;
}
/* Re-dibuja la vista sin interrumpir si el usuario está escribiendo */
function softRender(){
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')){ pendingRender = true; return; }
  renderView();
  refreshOpenModal();
}
let pendingRender = false;
document.addEventListener('focusout', ()=>{ if(pendingRender){ setTimeout(()=>{ const a = document.activeElement; if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendingRender = false; renderView(); refreshOpenModal(); } }, 200); } });
window.addEventListener('online', ()=> scheduleSync(200));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') scheduleSync(300); });
setInterval(()=>{ if(document.visibilityState === 'visible' && connected() && !syncRunning) syncNow({ silent: true }); }, 90000);

/* =====================================================================
   PORTAL DE SOCIOS (archivo cifrado por socio: tarjeta QR + PIN)
   ===================================================================== */
const PORTAL_ITER = 120000;
const _socioKeys = new Map();
async function socioKey(token, pin){
  const tag = token + ':' + pin;
  if(_socioKeys.has(tag)) return _socioKeys.get(tag);
  const salt = (await shaBytes('cs-salt:' + token)).slice(0, 16);
  const key = await pbkdf2Key(tag, salt, PORTAL_ITER);
  _socioKeys.set(tag, key);
  return key;
}
function ensureCredenciales(){
  let n = 0;
  const used = new Set(S.socios.map(s=> s.token).filter(Boolean));
  live('socios').forEach(s=>{
    if(!s.token || !s.pin){
      if(!s.token){ let t; do{ t = randomToken(16); }while(used.has(t)); used.add(t); s.token = t; }
      if(!s.pin) s.pin = randomPin();
      s.u = now(); n++;
    }
  });
  if(n) changed({ noRender: true });
}
function portalBaseUrl(){
  const c = conn();
  if(c && c.portalUrl) return c.portalUrl;
  // si la app está publicada en GitHub Pages, el portal está al lado
  if(/\.github\.io$/i.test(location.hostname)) return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') + 'portal.html';
  if(!c || !c.owner || !c.repo) return '';
  const own = c.owner.toLowerCase();
  const root = c.repo.toLowerCase() === own + '.github.io' ? '' : c.repo + '/';
  const f = (c.folder || '').replace(/^\/+|\/+$/g, '');
  return `https://${own}.github.io/${root}${f ? f + '/' : ''}portal.html`;
}
function socioPortalUrl(s){ const c = conn(); return portalBaseUrl() + '#f=' + (c ? c.fileId : '') + '&t=' + s.token; }
function buildPortalPayload(s){
  const hasta = Math.max(ymToIdx(new Date().getFullYear() + '-12'), ymToIdx(curYm()) + 3);
  const c = cuentaSocio(s, hasta);
  return {
    v: 1,
    sindicato: S.config.nombre || 'Sindicato',
    nombre: s.nombre, rut: s.rut ? formatRut(s.rut) : '',
    cuota: tarifaActual(), dv: diaVenc(),
    ini: socioInicio(s), fin: s.mesTermino || '',
    items: c.items.map(it=> ({ t: it.condonado && it.tipo === 'cuota' ? 'exento' : it.tipo, m: it.mes, c: it.concepto, mo: it.monto, p: it.pagado || 0 })),
    pagos: c.pagos.slice().sort((a, b)=> (b.fecha || '').localeCompare(a.fecha || '')).slice(0, 60).map(p=> ({ f: p.fecha, mo: Number(p.monto) || 0, me: p.medio || '' })),
    desc: c.descuentos.map(d=> ({ m: d.mes, mo: Number(d.monto) || 0, c: d.concepto || 'Descuento' })),
    plan: (()=>{ const pl = (typeof planActivoDe === 'function') && planActivoDe(s.id); if(!pl) return null; const r = planResumen(pl); const nx = planMontoMes(pl, idxToYm(ymToIdx(curYm()) + (planMarca(pl, curYm()) ? 1 : 0))); return { n: r.n, p: r.pagadas, mo: Number(pl.montoCuota) || 0, inc: !!pl.incluyeCuota, fin: r.fin, saldo: r.saldo, prox: nx.total }; })(),
  };
}
let portalTimer = null, portalRunning = null;
function schedulePortal(){ clearTimeout(portalTimer); portalTimer = setTimeout(()=> publishPortal(false, null, true).catch(()=>{}), 4000); }
async function publishPortal(force, onProgress, silent){
  if(!connected()) throw new Error('Primero conecta el repositorio en Ajustes.');
  if(portalRunning) return portalRunning;
  portalRunning = (async ()=>{
    ensureCredenciales();
    const socios = live('socios');
    const payloads = socios.map(s=> ({ s, p: buildPortalPayload(s) }));
    const hash = hex(await shaBytes(JSON.stringify(payloads.map(x=> [x.s.token, x.s.pin, x.p])))).slice(0, 20);
    if(!force && hash === lsGet('cs_portal_hash::' + conn().fileId, '')) return { skipped: true, count: socios.length };
    const entries = {};
    let i = 0;
    for(const { s, p } of payloads){
      const id = hex(await shaBytes('cs-id:' + s.token)).slice(0, 32);
      const key = await socioKey(s.token, s.pin);
      p.generado = new Date().toISOString();
      entries[id] = await aesEncrypt(key, JSON.stringify(p));
      i++;
      if(onProgress) onProgress(i, payloads.length);
    }
    const data = { v: 1, app: 'cuotas-portal', generado: new Date().toISOString(), sindicato: S.config.nombre || '', socios: payloads.length, entries };
    let sha = null;
    try{ const cur = await ghGetFile(portalName()); sha = cur && cur.sha; }catch(e){ if(e.status) throw e; }
    try{ await ghPutFile(portalName(), JSON.stringify(data), sha, 'Portal de socios (' + yo() + ')'); }
    catch(e){ if(e.conflict){ const cur = await ghGetFile(portalName()); await ghPutFile(portalName(), JSON.stringify(data), cur && cur.sha, 'Portal de socios (' + yo() + ')'); } else throw e; }
    lsSet('cs_portal_hash::' + conn().fileId, hash);
    lsSet('cs_portal_at', String(now()));
    if(!silent) toast('✓ Portal publicado (' + payloads.length + ' socios). Puede tardar 1 a 2 minutos en verse.', 'ok');
    if(currentTab === 'portal') renderView();
    return { count: payloads.length };
  })();
  try{ return await portalRunning; } finally { portalRunning = null; }
}

function toast(msg, kind, ms){
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="Cerrar">✕</button>`;
  t.querySelector('button').onclick = ()=> t.remove();
  box.appendChild(t);
  setTimeout(()=> t.remove(), ms || 7000);
}
function confirmar(texto, okLabel, danger){
  return new Promise(resolve=>{
    openModal({
      title: ()=> 'Confirmar',
      body: ()=> `<div>${texto}</div>`,
      foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" id="cfOk">${esc(okLabel || 'Aceptar')}</button>`,
      onMount: (el)=>{
        $('#cfOk', el).onclick = ()=>{ el._onClose = null; closeModal(); resolve(true); };

function monthOptions(selected, fromIdx, toIdx){
  let h = '';
  for(let i = toIdx; i >= fromIdx; i--){ const ym = idxToYm(i); h += `<option value="${ym}" ${ym === selected ? 'selected' : ''}>${esc(mesLabelCap(ym))}</option>`; }
  return h;
}
function chipDeuda(c){
  if(c.deuda > 0) return `<span class="chip bad">Debe ${clp(c.deuda)}</span>`;
  if(c.saldoFavor > 0) return `<span class="chip primary">A favor ${clp(c.saldoFavor)}</span>`;
  return `<span class="chip ok">Al día</span>`;
}
function mesesTxt(list){
  if(!list.length) return '';
  if(list.length <= 3) return list.map(m=> mesLabel(m, true)).join(', ');
  return `${list.length} meses (${mesLabel(list[0], true)} a ${mesLabel(list[list.length - 1], true)})`;
}

/* ---------- Modales (se pueden apilar) ---------- */
const modalStack = [];
function openModal(spec){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.addEventListener('mousedown', e=>{ if(e.target === bg) bg._down = true; });
  bg.addEventListener('click', e=>{ if(e.target === bg && bg._down && !spec.sticky) closeModal(); bg._down = false; });
  $('#modalRoot').appendChild(bg);
  const m = { el: bg, spec };
  modalStack.push(m);
  drawModal(m);
  document.body.style.overflow = 'hidden';
  return m;
}
function drawModal(m){
  const sp = m.spec;
  const scroll = m.el.scrollTop;
  m.el.innerHTML = `<div class="modal${sp.wide ? ' wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-head"><h2>${sp.title()}</h2><button type="button" class="x" data-act="close-modal" aria-label="Cerrar">✕</button></div>
    <div class="modal-body">${sp.body()}</div>
    ${sp.foot ? `<div class="modal-foot">${sp.foot()}</div>` : ''}
  </div>`;
  m.el.scrollTop = scroll;
  if(sp.onMount) sp.onMount(m.el, m);
}
function closeModal(){
  const m = modalStack.pop();
  if(!m) return;
  if(m.el._onClose) m.el._onClose();
  m.el.remove();
  if(!modalStack.length) document.body.style.overflow = '';
}
function refreshOpenModal(){ modalStack.forEach(m=>{ if(m.spec.live) drawModal(m); }); }
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && modalStack.length) closeModal(); });

VIEWS.socios = function(){
  const all = sociosOrdenados();
  const f = ui.sociosFiltro;
  const q = normTxt(ui.sociosBusca);
  const rows = all.map(s=> ({ s, c: cuentaSocio(s) })).filter(({ s, c })=>{
    if(f === 'retirados' && !socioBaja(s)) return false;
    if(f !== 'retirados' && socioBaja(s)) return false;
    if(f === 'suspendidos' && !socioSuspendido(s)) return false;
    if(f === 'deuda' && c.deuda <= 0) return false;
    if(f === 'aldia' && c.deuda > 0) return false;
    if(q && !normTxt(s.nombre + ' ' + (s.rut || '') + ' ' + formatRut(s.rut)).includes(q)) return false;
    return true;
  });
  if(f === 'deuda') rows.sort((a, b)=> b.c.deuda - a.c.deuda);
  const cnt = k=> all.filter(s=> k === 'retirados' ? socioBaja(s) : k === 'suspendidos' ? !socioBaja(s) && socioSuspendido(s) : !socioBaja(s) && (k === 'todos' || (k === 'deuda' ? cuentaSocio(s).deuda > 0 : cuentaSocio(s).deuda <= 0))).length;
  return `
  <div class="card">
    <div class="card-head"><h2>Socios (${all.filter(x=> !socioBaja(x)).length} activos)</h2>
      <div class="btn-row"><button class="btn primary sm" data-act="nuevo-socio">+ Socio</button><button class="btn sm" data-act="importar-socios">📋 Pegar lista</button></div></div>

      </div>

/* ---------- Importar lista ---------- */
function parseMesFlexible(str){
  const t = String(str || '').trim();
  let m = t.match(/^(\d{4})[-/.](\d{1,2})/); if(m) return m[1] + '-' + pad2(m[2]);
  m = t.match(/^(\d{1,2})[-/.](\d{4})$/); if(m) return m[2] + '-' + pad2(m[1]);
  m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); if(m) return m[3] + '-' + pad2(m[2]);
  const n = normTxt(t); const mi = MESES.findIndex(x=> n.startsWith(x.slice(0, 3))); const y = (t.match(/\d{4}/) || [])[0];
  if(mi >= 0 && y) return y + '-' + pad2(mi + 1);
  return '';
}
function parseLista(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const parts = line.split(/\t|;|\|/).map(x=> x.trim());
    let nombre = '', rut = '', mes = '';
    parts.forEach(p=>{
      if(!p) return;
      if(!rut && /^\d{1,2}\.?\d{3}\.?\d{3}-?[\dkK]$/.test(p.replace(/\s/g, ''))) rut = p;
      else if(!mes && parseMesFlexible(p)) mes = parseMesFlexible(p);
      else if(!nombre) nombre = p;
    });
    if(nombre && !/^nombre/i.test(nombre)) out.push({ nombre: nombre.replace(/\s+/g, ' '), rut, mes });
  });
  return out;
}

      <textarea id="iTxt" style="min-height:180px" placeholder="Juana Pérez Soto&#9;12.345.678-5&#9;03/2026&#10;Pedro González&#9;9.876.543-3"></textarea>
      <label class="f" style="margin-top:10px">Si no se indica mes de ingreso, pagan cuota desde<input id="iMes" type="month" value="${esc(S.config.mesInicioDefault || curYm())}"></label>
      <div id="iPrev" class="preview" style="display:none"></div>`,
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="iOk" disabled>Agregar</button>`,

function openPago(opts){

  const st = {
    socioId: editing ? editing.socioId : (opts.socioId || null),
    busca: '',
  };
  const sugerido = sid=>{ const s = getById('socios', sid); if(!s) return tarifaActual(); const c = cuentaSocio(s); return c.deuda > 0 ? c.deuda : tarifaActual(); };
  const form = {
    fecha: editing ? editing.fecha : todayISO(),
    monto: editing ? editing.monto : (st.socioId ? sugerido(st.socioId) : tarifaActual()),
    medio: editing ? editing.medio : (lsGet('cs_ultimo_medio', 'Efectivo')),
    obs: editing ? (editing.obs || '') : '',
  };

    title: ()=> editing ? 'Editar pago' : 'Registrar pago',
    body: ()=>{
      const s = st.socioId ? getById('socios', st.socioId) : null;
      let picker;
      if(s){
        const c = cuentaSocio(s);
        picker = `<div class="sel-socio"><div><div style="font-weight:800">${esc(s.nombre)}</div><div class="small">${c.deuda > 0 ? 'Debe ' + clp(c.deuda) + (c.mesesAdeudados.length ? ' · ' + esc(mesesTxt(c.mesesAdeudados)) : '') : (c.saldoFavor ? 'Saldo a favor ' + clp(c.saldoFavor) : 'Al día')}</div></div>${editing ? '' : '<button class="btn sm" id="pCambiar">Cambiar</button>'}</div>`;
      } else {
        picker = `<label class="f">Socio<input id="pBusca" type="search" placeholder="Escribe el nombre o RUT…" value="${esc(st.busca)}" autocomplete="off"></label><div class="picker-list" id="pList">${pickerItems(st.busca)}</div>`;
      }
      return `${picker}
      <div class="grid3" style="margin-top:12px">
        <label class="f">Monto ($)<input id="pMonto" inputmode="numeric" value="${miles(form.monto)}"></label>
        <label class="f">Fecha de pago<input id="pFecha" type="date" value="${esc(form.fecha)}"></label>
        <label class="f">Medio de pago<select id="pMedio">${MEDIOS.map(x=> `<option ${x === form.medio ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <label class="f span2" style="grid-column:1/-1">Observación (opcional)<input id="pObs" value="${esc(form.obs)}" placeholder="N° de comprobante, transferencia, etc."></label>
      </div>
      ${s ? `<div class="btn-row" style="margin-top:8px">${cuentaSocio(s).deuda > 0 ? `<button class="btn sm" data-monto="${cuentaSocio(s).deuda}">Toda la deuda (${clp(cuentaSocio(s).deuda)})</button>` : ''}<button class="btn sm" data-monto="${tarifaActual()}">1 cuota (${clp(tarifaActual())})</button><button class="btn sm" data-monto="${tarifaActual() * 3}">3 cuotas</button><button class="btn sm" data-monto="${tarifaActual() * 12}">12 cuotas</button></div>` : ''}
      <div id="pPrev"></div>`;
    },
    foot: ()=> `${editing ? '<button class="btn danger" id="pDel">Eliminar pago</button><span style="flex:1"></span>' : ''}<button class="btn" data-act="close-modal">Cancelar</button>${editing ? '' : '<button class="btn" id="pOtro">Guardar y otro</button>'}<button class="btn primary" id="pOk">Guardar</button>`,
    onMount: (el)=>{
      const readForm = ()=>{ form.monto = parseMonto($('#pMonto', el).value); form.fecha = $('#pFecha', el).value; form.medio = $('#pMedio', el).value; form.obs = $('#pObs', el).value; };
      const prev = ()=>{
        const box = $('#pPrev', el);
        const s = st.socioId ? getById('socios', st.socioId) : null;
        const monto = parseMonto($('#pMonto', el).value);
        if(!s || monto <= 0 || editing){ box.innerHTML = ''; return; }
        const pv = previewPago(s, monto);
        const parts = [];
        if(pv.covered.length) parts.push('Cubre: <b>' + pv.covered.map(it=> esc(it.tipo === 'cuota' ? mesLabel(it.mes, true) : it.concepto)).join(', ') + '</b>');
        if(pv.partial) parts.push('Abona ' + clp(pv.partial.p - pv.partial.it.pagado) + ' a ' + esc(pv.partial.it.tipo === 'cuota' ? mesLabel(pv.partial.it.mes, true) : pv.partial.it.concepto));
        if(pv.sobrante > 0) parts.push('Queda ' + clp(pv.sobrante) + ' a favor');
        box.innerHTML = parts.length ? `<div class="preview">${parts.join(' · ')}</div>` : '';
      };
      const b = $('#pBusca', el);
      if(b){
        b.focus();
        b.addEventListener('input', ()=>{ st.busca = b.value; $('#pList', el).innerHTML = pickerItems(st.busca); });

        $('#pList', el).addEventListener('click', e=>{
          const x = e.target.closest('button[data-sid]'); if(!x) return;
          readForm(); st.socioId = x.dataset.sid; form.monto = sugerido(st.socioId); drawModal(m);
          setTimeout(()=>{ const i = $('#pMonto', m.el); if(i){ i.focus(); i.select(); } }, 30);
        });
      }
      const cam = $('#pCambiar', el); if(cam) cam.onclick = ()=>{ readForm(); st.socioId = null; drawModal(m); };
      $$('[data-monto]', el).forEach(x=> x.onclick = ()=>{ $('#pMonto', el).value = miles(x.dataset.monto); prev(); });
      const mi = $('#pMonto', el);
      mi.addEventListener('input', prev);
      mi.addEventListener('blur', ()=>{ const v = parseMonto(mi.value); mi.value = v ? miles(v) : ''; });
      prev();
      const save = (otro)=>{
        readForm();
        if(!st.socioId){ toast('Elige el socio.', 'bad'); return; }
        if(form.monto <= 0){ toast('Indica un monto mayor a cero.', 'bad'); return; }
        if(!form.fecha){ toast('Indica la fecha del pago.', 'bad'); return; }
        const s = getById('socios', st.socioId);
        const rec = editing ? Object.assign({}, editing) : { id: uid(), socioId: st.socioId, por: yo(), creado: now() };
        Object.assign(rec, { monto: form.monto, fecha: form.fecha, medio: form.medio, obs: form.obs.trim() });
        if(editing) rec.editadoPor = yo();
        lsSet('cs_ultimo_medio', form.medio);
        upsert('pagos', rec);
        toast(`✓ Pago de ${clp(form.monto)} registrado para ${s ? s.nombre : ''}`, 'ok');
        if(otro){
          st.socioId = null; st.busca = ''; form.monto = tarifaActual(); form.obs = '';
          drawModal(m);
        } else { closeModal(); }
        refreshOpenModal();
      };
      $('#pOk', el).onclick = ()=> save(false);
      const o = $('#pOtro', el); if(o) o.onclick = ()=> save(true);
      const d = $('#pDel', el);
      if(d) d.onclick = async ()=>{
        if(!await confirmar(`¿Eliminar el pago de <b>${clp(editing.monto)}</b> del ${fdate(editing.fecha)}? La deuda del socio se recalculará.`, 'Eliminar', true)) return;
        closeModal(); removeRec('pagos', editing.id); refreshOpenModal(); toast('Pago eliminado');
      };
    },
  });
}
function pickerItems(q){
  q = normTxt(q);
  const list = sociosOrdenados().filter(s=> !q || normTxt(s.nombre + ' ' + (s.rut || '') + ' ' + String(s.rut || '').replace(/[^0-9kK]/g, '')).includes(q.replace(/\./g, ''))
    || normTxt(s.nombre).includes(q));
  if(!list.length) return `<div class="empty">No hay socios que coincidan.</div>`;
  return list.slice(0, 60).map(s=>{ const c = cuentaSocio(s); return `<button type="button" data-sid="${s.id}"><span><b>${nombreHtml(s, { chip: false })}</b></span>${c.deuda > 0 ? `<span class="val bad">${clp(c.deuda)}</span>` : '<span class="chip ok">Al día</span>'}</button>`; }).join('');
}

      <div class="toolbar"><button class="btn sm" id="mTodos">Marcar todos los pendientes</button><button class="btn sm" id="mNinguno">Desmarcar todos</button><span class="dim small" style="margin-left:auto" id="mInfo">Seleccionados: <b>${st.sel.size}</b> · Total: <b>${clp(total)}</b></span></div>
      <div class="table-wrap" style="max-height:52vh;overflow:auto"><table class="t"><thead><tr><th style="width:36px"></th><th>Socio</th><th>Estado de ${esc(mesLabel(st.mes, true))}</th><th class="r" style="width:130px">Monto</th></tr></thead><tbody>
      ${filas.map(f=> `<tr class="${f.pagado || f.ex ? 'done' : ''}">
        <td><input type="checkbox" class="mChk" data-id="${f.s.id}" ${st.sel.has(f.s.id) ? 'checked' : ''} style="width:20px;height:20px"></td>
        <td><b>${esc(f.s.nombre)}</b>${f.c.deuda > 0 ? `<div class="tiny" style="color:var(--bad)">Deuda total ${clp(f.c.deuda)}</div>` : ''}</td>
        <td>${f.ex ? '<span class="chip neutral">Exento</span>' : f.pagado ? '<span class="chip ok">Ya pagado</span>' : f.it && f.it.estado === 'parcial' ? '<span class="chip warn">Parcial</span>' : '<span class="chip bad">Pendiente</span>'}</td>
        <td class="r"><input class="mMonto" data-id="${f.s.id}" inputmode="numeric" value="${miles(st.montos[f.s.id] != null ? st.montos[f.s.id] : tarifaDe(st.mes))}" style="text-align:right"></td>
      </tr>`).join('') || `<tr><td colspan="4" class="empty">No hay socios activos en ese mes.</td></tr>`}
      </tbody></table></div>`;
    },
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" id="mOk">Registrar ${st.sel ? st.sel.size : 0} pago(s)</button>`,
    onMount: (el)=>{
      const keep = ()=>{ st.fecha = $('#mFecha', el).value; st.medio = $('#mMedio', el).value; };
      $('#mMes', el).onchange = e=>{ keep(); st.mes = e.target.value; st.sel = null; st.montos = {}; drawModal(m); };
      $('#mTodos', el).onclick = ()=>{ keep(); st.sel = null; drawModal(m); };
      $('#mNinguno', el).onclick = ()=>{ keep(); st.sel = new Set(); drawModal(m); };

      $$('.mMonto', el).forEach(i=>{

function openCondonar(ids){
  const lista = ids.map(id=> getById('socios', id)).filter(Boolean);
  const pend = s=> cuentaSocio(s).items.filter(it=> it.vencido && it.monto > 0 && it.estado !== 'pagado');
  const sel = new Set();
  lista.forEach(s=> pend(s).forEach(it=> sel.add(s.id + '§' + itemClave(it))));
  const m = openModal({
    wide: true,
    title: ()=> lista.length === 1 ? 'Borrar deuda · ' + esc(lista[0].nombre) : `Borrar deuda de ${lista.length} socios`,
    body: ()=>{
      let total = 0;
      const bloques = lista.map(s=>{
        const its = pend(s);
        return `${lista.length > 1 ? `<h3>${esc(s.nombre)}</h3>` : ''}${its.map(it=>{ const k = s.id + '§' + itemClave(it); const on = sel.has(k); const v = it.monto - it.pagado; if(on) total += v;
          return `<label class="check" style="padding:6px 0;justify-content:space-between"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="cdChk" data-k="${esc(k)}" ${on ? 'checked' : ''}> ${esc(it.concepto)}${it.pagado ? ` <span class="dim small">(abonado ${clp(it.pagado)})</span>` : ''}</span><b>${clp(v)}</b></label>`; }).join('')}`;
      }).join('');
      return `<p class="dim small">Marca lo que se borra. Las cuotas y cobros marcados quedan en $0 ("condonados"). Se puede deshacer desde la ficha del socio.</p>
        <div class="toolbar"><button class="btn sm" id="cdAll">Marcar todo</button><button class="btn sm" id="cdNone">Desmarcar todo</button><span style="margin-left:auto" class="small">Se borran <b>${clp(total)}</b></span></div>
        <div style="max-height:46vh;overflow:auto">${bloques}</div>
        <label class="f" style="margin-top:10px">Motivo (opcional)<input id="cdMot" placeholder="Ej: Acuerdo de asamblea 28/10/2026"></label>`;
    },
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn danger" id="cdOk">Borrar deuda marcada</button>`,
    onMount: (el)=>{
      const mot = ()=> ($('#cdMot', el) || {}).value || '';
      $$('.cdChk', el).forEach(c=> c.onchange = ()=>{ const v = mot(); c.checked ? sel.add(c.dataset.k) : sel.delete(c.dataset.k); drawModal(m); $('#cdMot', m.el).value = v; });
      $('#cdAll', el).onclick = ()=>{ const v = mot(); lista.forEach(s=> pend(s).forEach(it=> sel.add(s.id + '§' + itemClave(it)))); drawModal(m); $('#cdMot', m.el).value = v; };
      $('#cdNone', el).onclick = ()=>{ const v = mot(); sel.clear(); drawModal(m); $('#cdMot', m.el).value = v; };
      $('#cdOk', el).onclick = async ()=>{
        if(!sel.size){ toast('No hay nada marcado.', 'bad'); return; }
        const motivo = mot().trim();
        let total = 0; const nuevos = [];
        lista.forEach(s=> pend(s).forEach(it=>{ if(sel.has(s.id + '§' + itemClave(it))){ total += it.monto - it.pagado; nuevos.push({ id: uid(), socioId: s.id, tipo: 'condonacion', clave: itemClave(it), mes: it.mes, monto: it.monto, concepto: (it.concepto + (motivo ? ' · ' + motivo : '')), por: yo(), u: now() }); } }));
        if(!await confirmar(`¿Borrar ${clp(total)} de deuda (${nuevos.length} ítem${nuevos.length > 1 ? 's' : ''})?`, 'Borrar deuda', true)) return;
        S.ajustes.push(...nuevos);
        closeModal(); changed(); refreshOpenModal();
        toast(`✓ Deuda borrada: ${clp(total)}`, 'ok');
      };
    },
  });
}

/* =====================================================================
   PLANES DE PAGO (convenios de deuda con descuento por planilla)
   Cada plan reparte una deuda en N cuotas mensuales. Mes a mes, cada
   descuento se marca con un toque: Autorizado → Descontado (crea el pago)
   o No autorizado (esa cuota se corre al mes siguiente).
   ===================================================================== */
const PLAN_EST = {
  autorizado: { lbl: 'Autorizado', ico: '✅', chip: 'info' },
  descontado: { lbl: 'Descontado', ico: '💵', chip: 'ok' },
  rechazado: { lbl: 'No autorizado', ico: '✕', chip: 'bad' },
};
function planMarcas(p){ return live('autoriz').filter(a=> a.planId === p.id); }
function planMarca(p, mes){ return live('autoriz').find(a=> a.planId === p.id && a.mes === mes) || null; }
function planAbono(p, k){
  const n = Number(p.cuotas) || 1, m = Number(p.montoCuota) || 0, tot = Number(p.deudaInicial) || 0;
  if(k < 1 || k > n) return 0;
  return k < n ? m : Math.max(0, tot - m * (n - 1));
}
/* Número de cuota que toca en un mes. Los meses "no autorizado" no cuentan, así que el plan se alarga. */
function planCuotaEn(p, mes){
  if(p.anulado) return 0;
  const i = ymToIdx(mes), start = ymToIdx(p.inicio);
  if(isNaN(i) || i < start) return 0;
  const rech = planMarcas(p).filter(a=> a.estado === 'rechazado' && ymToIdx(a.mes) < i).length;
  const k = i - start + 1 - rech;
  const mk = planMarca(p, mes);
  if(mk && mk.estado === 'rechazado') return k <= (Number(p.cuotas) || 1) ? k : 0;
  return k <= (Number(p.cuotas) || 1) ? k : 0;
}
function planMontoMes(p, mes){
  const k = planCuotaEn(p, mes);
  if(!k) return { k: 0, abono: 0, cuota: 0, total: 0 };
  const abono = planAbono(p, k);
  const cuota = p.incluyeCuota ? tarifaDe(mes) : 0;
  return { k, abono, cuota, total: abono + cuota };
}
function planResumen(p){
  const ms = planMarcas(p);
  const desc = ms.filter(a=> a.estado === 'descontado');
  const pagadas = desc.length;
  const abonado = desc.reduce((a, m)=> a + (Number(m.abono) || 0), 0);
  const n = Number(p.cuotas) || 1;
  const rech = ms.filter(a=> a.estado === 'rechazado').length;
  const fin = idxToYm(ymToIdx(p.inicio) + n - 1 + rech);
  return { pagadas, n, abonado, saldo: Math.max(0, (Number(p.deudaInicial) || 0) - abonado), rech, fin, terminado: pagadas >= n, anulado: !!p.anulado };
}
function planActivoDe(sid){ return live('planes').find(p=> p.socioId === sid && !p.anulado && !planResumen(p).terminado) || null; }

/* ---------- Vista ---------- */
ui.planMes = ui.planMes || curYm();
ui.planFecha = ui.planFecha || todayISO();
VIEWS.planes = function(){
  const mes = ui.planMes;
  const planes = live('planes');

      <div class="tile"><div class="num">${pend}</div><div class="lbl">Sin marcar</div></div>
      <div class="tile"><div class="num">${cnt('autorizado') + cnt('descontado')}<span class="dim small"> · ${clp(totalAut)}</span></div><div class="lbl">Autorizados</div></div>
      <div class="tile"><div class="num ok">${cnt('descontado')}<span class="dim small"> · ${clp(totalDesc)}</span></div><div class="lbl">Descontados</div></div>
    </div>
    ${rows.length ? `
    <div class="toolbar">
      <button class="btn sm" data-act="plan-todos" data-e="autorizado" ${pend ? '' : 'disabled'}>✅ Autorizar todos los pendientes (${pend})</button>
      <button class="btn sm" data-act="plan-todos" data-e="descontado" ${cnt('autorizado') ? '' : 'disabled'}>💵 Marcar autorizados como descontados (${cnt('autorizado')})</button>
      <button class="btn sm" data-act="plan-nomina">🖨️ Nómina para remuneraciones</button>
    </div>
    <div class="note small">Un toque marca el estado; otro toque sobre el mismo botón lo quita. <b>Descontado</b> registra el pago (${'Descuento por planilla'}). <b>No autorizado</b> corre esa cuota del plan al mes siguiente.</div>
    <div id="plRows">${rows.map(planRowHtml).join('')}</div>` : `<div class="empty">No hay planes de pago con cuotas en ${esc(mesLabel(mes))}.${planes.length ? '' : '<br>Crea uno con "+ Nuevo plan de pago".'}</div>`}
  </div>
  <div class="card">
    <h2>Planes de pago (${activos.length} activos)</h2>
    ${planes.length ? sociosOrdenados(planes.map(p=> getById('socios', p.socioId)).filter(Boolean).filter((s, i, a)=> a.indexOf(s) === i)).map(s=> planes.filter(p=> p.socioId === s.id).map(p=>{
      const r = planResumen(p);
      const st = r.anulado ? '<span class="chip neutral">Anulado</span>' : r.terminado ? '<span class="chip ok">Terminado</span>' : ymToIdx(p.inicio) > cur ? '<span class="chip info">Por iniciar</span>' : '<span class="chip primary">En curso</span>';
      return `<div class="row click" data-act="ver-plan" data-id="${p.id}"><div class="main"><div class="title">${nombreHtml(s)}</div>
        <div class="sub">${clp(p.deudaInicial)} en ${r.n} cuotas de ${clp(p.montoCuota)}${p.incluyeCuota ? ' + cuota mensual' : ''} · ${esc(mesLabel(p.inicio, true))} a ${esc(mesLabel(r.fin, true))}${r.rech ? ` · ${r.rech} no autorizada${r.rech > 1 ? 's' : ''}` : ''}</div>
        <div class="sub"><b>${r.pagadas} de ${r.n}</b> descontadas · saldo del plan ${clp(r.saldo)}</div></div>${st}</div>`;
    }).join('')).join('') : '<div class="empty">Aún no hay planes. Los socios con deuda aparecen al crear un plan.</div>'}
  </div>`;
};

/* Marca o desmarca un estado (un solo toque) */
function setPlanEstado(p, mes, estado, quiet){
  const mk = planMarca(p, mes);
  const m = planMontoMes(p, mes);
  // quitar pago asociado si deja de estar descontado
  if(mk && mk.estado === 'descontado' && mk.pagoId && estado !== 'descontado'){
    const pg = S.pagos.find(x=> x.id === mk.pagoId); if(pg){ pg.del = true; pg.u = now(); }
  }
  if(!estado){ if(mk){ mk.del = true; mk.u = now(); } return; }
  const rec = mk || { id: uid(), planId: p.id, mes };
  rec.estado = estado; rec.por = yo(); rec.u = now(); rec.del = false;
  if(estado === 'descontado'){
    if(!rec.pagoId || !S.pagos.some(x=> x.id === rec.pagoId && !x.del)){
      const pago = { id: uid(), socioId: p.socioId, monto: m.total, fecha: ui.planFecha || todayISO(), medio: 'Descuento por planilla', obs: `Plan de pago: cuota ${m.k} de ${p.cuotas}${m.cuota ? ' + cuota ' + mesLabel(mes) : ''}`, por: yo(), creado: now(), u: now(), planId: p.id, mes, imp: 'cuota' };
      S.pagos.push(pago); rec.pagoId = pago.id;
    }
    rec.monto = m.total; rec.abono = m.abono;
  } else { rec.pagoId = null; rec.monto = 0; rec.abono = 0; }
  if(!mk) S.autoriz.push(rec);
}
