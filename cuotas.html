/* ---------- Descripción de cambios ---------- */
const COL_TXT = { tarifas: 'Valor de cuota', socios: 'Socio', pagos: 'Pago', cobros: 'Cuota extraordinaria', ajustes: 'Ajuste / condonación', planes: 'Plan de pago', autoriz: 'Descuento de plan', acuerdos: 'Abono acordado', nominas: 'Planilla de abonos', gastos: 'Gasto', ingresos: 'Ingreso' };
const CAMPOS_OCULTOS = new Set(['u', 'token', 'pin', 'creado', 'por', 'editadoPor', 'del', 'filas', 'id']);
const CAMPO_TXT = { nombre: 'nombre', rut: 'RUT', email: 'correo', telefono: 'teléfono', mesInicio: 'socio desde', mesTermino: 'último mes', suspDesde: 'suspendido desde', suspHasta: 'suspendido hasta', notas: 'notas', monto: 'monto', fecha: 'fecha', medio: 'medio', obs: 'observación', mes: 'mes', concepto: 'concepto', tipo: 'tipo', desde: 'rige desde', item: 'ítem', categoria: 'categoría', detalle: 'detalle', estado: 'estado', cuotas: 'N° de cuotas', montoCuota: 'monto por cuota', inicio: 'inicio', anulado: 'anulado', socioId: 'socio' };
function socioNomD(id){ const s = S.socios.find(x=> x.id === id); return s ? s.nombre : ''; }
function valTxt(k, v){
  if(v === undefined || v === null || v === '') return '—';
  if(k === 'socioId') return socioNomD(v) || v;
  if(/^(monto|montoCuota)$/.test(k) && typeof v === 'number') return clp(v);
  if(/^(mes|mesInicio|mesTermino|suspDesde|suspHasta|desde|inicio)$/.test(k) && /^\d{4}-\d{2}$/.test(v)) return mesLabel(v, true);
  if(k === 'fecha' && /^\d{4}-\d{2}-\d{2}/.test(v)) return fdate(v);
  if(Array.isArray(v)) return v.length + ' elemento(s)';
  if(typeof v === 'object') return '…';
  if(typeof v === 'boolean') return v ? 'sí' : 'no';
  return String(v).slice(0, 80);
}
function descRec(col, r){
  if(!r) return '';
  switch(col){
    case 'socios': return r.nombre;
    case 'pagos': return `${socioNomD(r.socioId)} · ${clp(r.monto)} · ${fdate(r.fecha)}`;
    case 'cobros': return `${r.concepto} · ${clp(r.monto)} · ${mesLabel(r.mes, true)}`;
    case 'tarifas': return `${clp(r.monto)} desde ${mesLabel(r.desde, true)}`;
    case 'ajustes': return `${socioNomD(r.socioId)} · ${r.tipo}${r.monto ? ' ' + clp(r.monto) : ''}${r.mes ? ' · ' + mesLabel(r.mes, true) : ''}`;
    case 'gastos': case 'ingresos': return `${r.item || r.concepto || ''} · ${clp(r.monto)} · ${fdate(r.fecha)}`;
    case 'planes': return `${socioNomD(r.socioId)} · ${r.cuotas || ''} cuotas`;
    case 'acuerdos': return `${socioNomD(r.socioId)} · ${clp(r.monto)}`;
    case 'autoriz': { const p = S.planes.find(x=> x.id === r.planId); return `${p ? socioNomD(p.socioId) : ''} · ${mesLabel(r.mes, true)} · ${r.estado || ''}`; }
    case 'nominas': return `Planilla ${mesLabel(r.mes, true)}`;
    default: return '';
  }
}
function diffCampos(a, b){
  const out = [];
  new Set(Object.keys(a || {}).concat(Object.keys(b || {}))).forEach(k=>{
    if(CAMPOS_OCULTOS.has(k)) return;
    const x = a ? a[k] : undefined, y = b ? b[k] : undefined;
    if(JSON.stringify(x === undefined ? null : x) === JSON.stringify(y === undefined ? null : y)) return;
    if((x === undefined || x === '' || x === null) && (y === undefined || y === '' || y === null)) return;
    out.push([CAMPO_TXT[k] || k, valTxt(k, x), valTxt(k, y)]);
  });
  return out;
}
function itemAccion(it){ return !it.antes || it.antes.del ? (it.despues.del ? '' : 'Nuevo') : it.despues.del ? 'Eliminar' : 'Modificar'; }
function itemTxt(it){ const a = itemAccion(it); return `${a} ${(COL_TXT[it.col] || it.col).toLowerCase()}: ${descRec(it.col, it.despues.del ? it.antes : it.despues)}`; }

/* ---------- Interceptar cambios de finanzas de otros dirigentes ---------- */
const _changedD = changed;
changed = function(opts){
  const d = dirGuardada();
  if(!d || !puedeCambiar() || idEmail() === d.tesorero) return _changedD(opts);
  let prev; try{ prev = normalizeState(JSON.parse(lsGet('cs_state', 'null') || 'null')); }catch(e){ return _changedD(opts); }
  const items = [];
  FIN_COLS.forEach(col=>{
    const pm = new Map(prev[col].map(x=> [x.id, x]));
    for(let i = S[col].length - 1; i >= 0; i--){
      const r = S[col][i], a = pm.get(r.id);
      if(a && (a.u || 0) === (r.u || 0) && !!a.del === !!r.del) continue;
      if(!a && r.del) { S[col].splice(i, 1); continue; }
      const sig = a && !!a.del === !!r.del ? diffCampos(a, r).length : 1;
      if(!sig) continue;   // solo cambió el token o el PIN del portal
      items.push({ col, rid: r.id, antes: a ? JSON.parse(JSON.stringify(a)) : null, despues: JSON.parse(JSON.stringify(r)) });
      if(a) S[col][i] = a; else S[col].splice(i, 1);
    }
  });
  // configuración protegida
  let cfgBloq = false;
  CFG_PROTEGIDA.forEach(k=>{ if(JSON.stringify(S.config[k]) !== JSON.stringify(prev.config[k])){ S.config[k] = prev.config[k]; cfgBloq = true; } });
  // las propuestas solo las resuelve el tesorero
  const pp = new Map(prev.propuestas.map(x=> [x.id, x]));
  S.propuestas.forEach((p, i)=>{ const a = pp.get(p.id); if(a && (a.estado !== p.estado || p.del !== a.del)) S.propuestas[i] = a; });
  if(items.length){
    const e = idEmail(), t = Date.now();
    let lote = S.propuestas.find(p=> !p.del && p.estado === 'pendiente' && p.quien === e && t - (p.t0 || 0) < 8000);
    if(lote){
      items.forEach(it=>{ const j = lote.items.findIndex(x=> x.col === it.col && x.rid === it.rid); if(j >= 0) lote.items[j].despues = it.despues; else lote.items.push(it); });
      lote.u = now();
    } else {
      lote = { id: uid(), quien: e, nombre: yo(), t: new Date().toISOString(), t0: t, estado: 'pendiente', items, u: now() };
      S.propuestas.push(lote);
    }
    toast(`⏳ Enviado al tesorero para aprobación (${lote.items.length} cambio${lote.items.length === 1 ? '' : 's'}). Mientras tanto no cuenta en la deuda ni en la caja.`, 'ok', 9000);
  }
  if(cfgBloq) toast('Ese ajuste solo lo puede cambiar el tesorero.', 'bad', 7000);
  _changedD(opts);
  if(items.length || cfgBloq){ const y = window.scrollY; renderView(); refreshOpenModal(); window.scrollTo(0, y); }
};

/* ---------- Aprobar / rechazar ---------- */
function propsPend(){ return live('propuestas').filter(p=> p.estado === 'pendiente'); }
function aplicarItem(it){
  const i = S[it.col].findIndex(x=> x.id === it.rid);
  const cur = i >= 0 ? S[it.col][i] : null;
  if(!it.antes && it.despues.del) return false;
  const rec = JSON.parse(JSON.stringify(it.despues)); rec.u = now();
  if(cur) S[it.col][i] = rec; else S[it.col].push(rec);
  return !!(cur && it.antes && (cur.u || 0) !== (it.antes.u || 0));
}
function resolver(ids, estado, motivo){
  if(!esTesorero()){ toast('Solo el tesorero puede aprobar o rechazar.', 'bad'); return; }
  let conflictos = 0, n = 0;
  ids.forEach(id=>{
    const p = S.propuestas.find(x=> x.id === id); if(!p || p.estado !== 'pendiente') return;
    if(estado === 'aprobada') p.items.forEach(it=>{ if(aplicarItem(it)) conflictos++; });
    p.estado = estado; p.motivo = motivo || ''; p.resolvio = yo(); p.tr = new Date().toISOString(); p.u = now(); n++;
  });
  changed();
  toast(estado === 'aprobada' ? `✓ ${n} aprobado(s)` + (conflictos ? ` · ${conflictos} registro(s) habían cambiado entre medio; quedó la versión propuesta` : '') : `✕ ${n} rechazado(s)`, estado === 'aprobada' ? 'ok' : '', 8000);
  if(S.config.portalAuto && estado === 'aprobada') schedulePortal();
}
ACT['prop-aprobar'] = el=> resolver([el.dataset.id], 'aprobada');
ACT['prop-todo'] = async ()=>{ const ps = propsPend(); if(!ps.length) return; if(!await confirmar(`¿Aprobar los ${ps.length} cambios pendientes?`, 'Aprobar todos')) return; resolver(ps.map(p=> p.id), 'aprobada'); };
ACT['prop-rechazar'] = el=>{
  const id = el.dataset.id;
  openModal({ title: ()=> 'Rechazar cambio', body: ()=> `<label class="f">Motivo (opcional, lo verá quien hizo el cambio)<input id="prM" placeholder="Ej: el monto no coincide con la transferencia"></label>`,
    foot: ()=> `<button class="btn" data-act="close-modal">Cancelar</button><button class="btn danger" id="prOk">Rechazar</button>`,
    onMount: m=>{ $('#prOk', m).onclick = ()=>{ const mo = $('#prM', m).value.trim(); closeModal(); resolver([id], 'rechazada', mo); }; } });
};
ACT['prop-retirar'] = async el=>{
  const p = getById('propuestas', el.dataset.id); if(!p || p.quien !== idEmail() || p.estado !== 'pendiente') return;
  if(!await confirmar('¿Retirar esta solicitud? Los cambios no se aplicarán.', 'Retirar', true)) return;
  const prev = JSON.parse(lsGet('cs_state', 'null') || 'null'); const i = S.propuestas.findIndex(x=> x.id === p.id);
  S.propuestas[i] = Object.assign({}, p, { estado: 'retirada', u: now() });
  // se guarda directo (el guardián no deja cambiar estados a los dirigentes)
  saveLocal(); invalidate(); scheduleSync(); renderView();
};

  const est = { pendiente: ['⏳ Por aprobar', 'warn'], aprobada: ['✓ Aprobado', 'ok'], rechazada: ['✕ Rechazado', 'bad'], retirada: ['Retirado', 'neutral'] }[p.estado] || ['', 'neutral'];

function gdTokenValid(){ const t = gdToken(); return !!(t && t.access_token && Date.now() < t.expires_at - 60000); }
function gdEnabled(){ return lsGet('cs_gd_on', '0') === '1'; }
function gdEmail(){ return lsGet('cs_gd_email', ''); }
let gdState = { st: 'off', msg: '', at: Number(lsGet('cs_gd_last', '0')) || 0 };
let gdTimer = null, gdRunning = null, gdAgain = false, gdTokenClient = null;

function gdLoadGis(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = ()=> res(); s.onerror = ()=> rej(new Error('No se pudo cargar el inicio de sesión de Google (¿sin internet?).'));
    document.head.appendChild(s);
  });
}
/* Pide permiso a Google. Debe llamarse desde un toque del usuario (abre una ventana). */
/* Importante en celulares: la ventana de Google debe abrirse en el mismo toque del usuario,
   sin esperar descargas antes; por eso el script de Google se precarga al abrir la app. */
function gdLogin(forceConsent){
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    gdLoadGis().catch(()=>{});
    return Promise.reject(new Error('Cargando el inicio de sesión de Google… espera 2 segundos y toca de nuevo.'));
  }
  return new Promise((resolve, reject)=>{
    gdTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(),
      scope: GD_SCOPE,
      callback: async (resp)=>{
        if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
        lsSet('cs_gd_token', JSON.stringify({ access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600) * 1000 }));
        try{
          const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } });
          const u = await r.json();
          if(u.email) lsSet('cs_gd_email', u.email);
        }catch(e){}
        lsSet('cs_gd_on', '1');
        resolve();
      },
      error_callback: (err)=> reject(new Error(err && err.type === 'popup_closed' ? 'Se cerró la ventana de Google antes de terminar.' : 'Google no permitió el inicio de sesión.')),
    });
    gdTokenClient.requestAccessToken({ prompt: forceConsent || !gdEmail() ? 'consent' : '', login_hint: gdEmail() || undefined });
  });
}
async function gdFetch(url, opts){
  const t = gdToken();
  const res = await fetch(url, Object.assign({}, opts || {}, { headers: Object.assign({ Authorization: 'Bearer ' + (t && t.access_token) }, (opts && opts.headers) || {}) }));
  if(res.status === 401){ lsSet('cs_gd_token', null); throw Object.assign(new Error('La sesión de Google venció. Toca "Reconectar Google Drive".'), { auth: true }); }
  if(!res.ok){ let m = ''; try{ m = (await res.json()).error.message; }catch(e){} throw new Error('Error de Google Drive (' + res.status + ')' + (m ? ': ' + m : '')); }
  return res;
}
async function gdFindFile(){
  const q = encodeURIComponent(`name='${GD_FILE}'`);
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const j = await r.json();
  return (j.files && j.files[0]) || null;
}
async function gdDownload(id){ const r = await gdFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); return r.json(); }
async function gdUpload(id, obj){
  const body = JSON.stringify(obj);
  if(id){
    await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    return id;
  }
  const boundary = 'cs' + Math.random().toString(36).slice(2);
  const meta = { name: GD_FILE, parents: ['appDataFolder'], mimeType: 'application/json' };
  const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
  const r = await gdFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart });
  return (await r.json()).id;
}
function gdSet(st, msg){ gdState.st = st; gdState.msg = msg || ''; if(st === 'ok'){ gdState.at = now(); lsSet('cs_gd_last', String(gdState.at)); } updateChip(); }
async function gdSyncNow(opts){
  if(!gdEnabled()) return false;
  if(!gdTokenValid()){ gdSet('auth', 'Hay que volver a conectar Google Drive.'); return false; }
  if(!navigator.onLine){ gdSet('error', 'Sin conexión a internet.'); return false; }
  if(gdRunning){ gdAgain = true; return gdRunning; }
  gdRunning = (async ()=>{
    gdSet('busy');
    const seq = changeSeq;
    const before = canonical(S);
    try{
      const f = await gdFindFile();
      let remote = null;
      if(f){ const data = await gdDownload(f.id); remote = normalizeState(data && data.datos ? data.datos : data); }
      S = remote ? mergeStates(S, remote) : normalizeState(S);
      saveLocal();
      if(!remote || canonical(S) !== canonical(remote)){
        await gdUpload(f && f.id, { app: 'cuotas-sindicales-drive', actualizado: new Date().toISOString(), datos: S });
      }
      if(changeSeq === seq && !connected()) lsSet('cs_dirty', '0');
      gdSet('ok');
      invalidate();
      if(canonical(S) !== before) softRender();
      return true;
    }catch(e){
      gdSet(e.auth ? 'auth' : 'error', e.message || String(e));
      if(!(opts && opts.silent)) toast('⚠ ' + (e.message || e), 'bad');
      return false;
    }finally{
      gdRunning = null;
      if(gdAgain){ gdAgain = false; gdSchedule(400); }
    }
  })();
  return gdRunning;
}
function gdSchedule(delay){ if(!gdEnabled()) return; clearTimeout(gdTimer); gdTimer = setTimeout(()=> gdSyncNow({ silent: true }), delay == null ? 2000 : delay); }

/* Se engancha a los cambios y al indicador de sincronización */
const _scheduleSyncGh = scheduleSync;
scheduleSync = function(delay){ _scheduleSyncGh(delay); gdSchedule(delay == null ? 2000 : delay + 300); };
const _updateChipGh = updateChip;
updateChip = function(){
  _updateChipGh();
  const el = $('#syncChip'); if(!el || connected() || !gdEnabled()) return;
  el.className = 'sync-chip';
  if(gdState.st === 'busy'){ el.classList.add('busy'); el.textContent = '⟳ Drive…'; }
  else if(gdState.st === 'auth'){ el.classList.add('bad'); el.textContent = '⚠ Reconectar Drive'; }
  else if(gdState.st === 'error'){ el.classList.add('bad'); el.textContent = '⚠ Drive sin sincronizar'; el.title = gdState.msg; }
  else { el.classList.add('ok'); el.textContent = '✓ Drive'; el.title = gdEmail() + (gdState.at ? ' · ' + fdatetime(gdState.at) : ''); }
};
ACT['sync-now'] = async ()=>{
  if(connected()) syncNow();
  if(gdEnabled()){
    if(!gdTokenValid()){ const lg = gdLogin(false); try{ await lg; }catch(e){ toast('⚠ ' + e.message, 'bad'); return; } }
    gdSyncNow();
  }
  if(!connected() && !gdEnabled()){ goTab('ajustes'); toast('Conecta Google Drive o el repositorio para no depender de este equipo.'); }
};
ACT['gd-conectar'] = async el=>{
  const login = (gdEnabled() && gdTokenValid()) ? Promise.resolve() : gdLogin(!gdEmail());
  el.disabled = true;
  try{
    await login;
    const ok = await gdSyncNow();
    if(ok) toast('✓ Conectado a Google Drive (' + gdEmail() + ')', 'ok');
  }catch(e){ toast('⚠ ' + e.message, 'bad'); }
  el.disabled = false;
  renderView();
};
ACT['gd-desconectar'] = async ()=>{
  if(!await confirmar('¿Desconectar Google Drive en este equipo? Los datos quedan en este equipo y en tu Drive, pero dejarán de sincronizarse aquí.', 'Desconectar', true)) return;
  const t = gdToken();
  try{ if(t && window.google && google.accounts) google.accounts.oauth2.revoke(t.access_token, ()=>{}); }catch(e){}
  ['cs_gd_token', 'cs_gd_on'].forEach(k=> lsSet(k, null));
  gdSet('off'); renderView();
};
ACT['gd-client'] = ()=>{
  const v = prompt('Client ID de Google (déjalo vacío para usar el predeterminado):', lsGet('cs_gd_client', ''));
  if(v === null) return;
  lsSet('cs_gd_client', v.trim() || null); lsSet('cs_gd_token', null); renderView();
};
function gdCardHtml(){
  const on = gdEnabled(), valid = gdTokenValid();
  return `<div class="card">
    <h2>Google Drive (tu correo)</h2>
    ${on ? `
      <div class="note ${gdState.st === 'error' || gdState.st === 'auth' || !valid ? 'warn' : 'ok'}">${valid ? '✓' : '⚠'} Conectado con <b>${esc(gdEmail() || 'tu cuenta de Google')}</b>. ${gdState.at ? 'Última sincronización: ' + fdatetime(gdState.at) + '.' : ''} ${!valid ? 'La sesión de Google venció: toca "Reconectar".' : ''}${gdState.st === 'error' ? ' ' + esc(gdState.msg) : ''}</div>
      <div class="btn-row"><button class="btn primary" data-act="gd-conectar">${valid ? '⟳ Sincronizar ahora' : '🔑 Reconectar Google Drive'}</button><button class="btn danger" data-act="gd-desconectar">Desconectar</button></div>` : `
      <p class="dim small">Guarda una copia automática en tu Google Drive y tendrás los mismos datos en tu computador y en tu celular, entrando con tu correo. Es tu copia personal: no se ve en "Mi unidad" ni la pueden leer otros.</p>
      <div class="btn-row"><button class="btn primary" data-act="gd-conectar">🔗 Conectar Google Drive</button></div>`}
    <details class="adv" style="margin-top:10px"><summary>Opciones avanzadas</summary>
      <p class="dim tiny">Client ID actual: ${esc(gdClientId())}</p><button class="btn sm" data-act="gd-client">Cambiar Client ID</button></details>

}

document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && gdEnabled() && gdTokenValid()) gdSchedule(500); });
setInterval(()=>{ if(document.visibilityState === 'visible' && gdEnabled() && gdTokenValid() && !gdRunning) gdSyncNow({ silent: true }); }, 120000);

/* =====================================================================
   CARPETA DEL SINDICATO EN GOOGLE DRIVE
   Sube automáticamente a una carpeta normal de "Mi unidad" (que el dueño
   puede compartir con la directiva):
     · Actas: el acta en Word y sus archivos adjuntos (PDF, fotos)
     · Planillas de abonos: el Word para firmas
     · Respaldos: "Respaldo actual" (Excel y respaldo completo) que se
       actualiza en el mismo archivo cuando hay cambios, y una copia fija
       por mes en "Mensuales" 
   Sube el equipo de quien conectó la carpeta. Google entrega permisos por
   1 hora: si vencen, basta un toque en "Subir a Drive".
   ===================================================================== */
const DR_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const DR_SUB = { actas: 'Actas', planillas: 'Planillas de abonos', respaldos: 'Respaldos' };
const DR_DIAS = 30;
['dr-abrir', 'dr-subir'].forEach(a=> ACT_LIBRES.add(a));
function drCfg(){ const c = S.config.carpeta; return c && c.id ? c : null; }
function drTok(){ try{ return JSON.parse(lsGet('cs_dr_tok', 'null') || 'null'); }catch(e){ return null; } }
function drTokOk(){ const t = drTok(); return !!(t && t.access_token && Date.now() < t.expires_at - 60000); }
function drEmail(){ return lsGet('cs_dr_email', ''); }
function drEsDueno(){ const c = drCfg(); return !!(c && drEmail() && drEmail() === c.email); }
let drEstado = { st: '', msg: '', n: 0, hecho: 0, total: 0, at: Number(lsGet('cs_dr_at', '0')) || 0 };
let drCorriendo = null, drTimer = null;

function drLogin(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){ gdLoadGis().catch(()=>{}); return Promise.reject(new Error('Cargando Google… espera 2 segundos y toca de nuevo.')); }
  return new Promise((resolve, reject)=>{
    google.accounts.oauth2.initTokenClient({
      client_id: gdClientId(), scope: DR_SCOPE,
      callback: async resp=>{
        if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
        lsSet('cs_dr_tok', JSON.stringify({ access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600) * 1000 }));
        try{ const u = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } })).json(); if(u.email) lsSet('cs_dr_email', u.email.toLowerCase()); }catch(e){}
        resolve();
      },
      error_callback: err=> reject(new Error(err && err.type === 'popup_closed' ? 'Se cerró la ventana de Google.' : 'No se pudo abrir la ventana de Google.')),
    }).requestAccessToken({ prompt: drEmail() ? '' : 'consent', login_hint: drEmail() || undefined });
  });
}
async function drFetch(url, opts){
  const t = drTok();
  const res = await fetch(url, Object.assign({}, opts || {}, { headers: Object.assign({ Authorization: 'Bearer ' + (t && t.access_token) }, (opts && opts.headers) || {}) }));
  if(res.status === 401){ lsSet('cs_dr_tok', null); throw Object.assign(new Error('El permiso de Google venció.'), { auth: true }); }
  if(!res.ok){ let m = ''; try{ m = (await res.json()).error.message; }catch(e){} throw Object.assign(new Error('Google Drive (' + res.status + ')' + (m ? ': ' + m : '')), { status: res.status }); }
  return res;
}
async function drCrearCarpeta(nombre, padre){
  const r = await drFetch('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nombre, mimeType: 'application/vnd.google-apps.folder', parents: padre ? [padre] : undefined }) });
  return r.json();
}
async function drSubir(blob, nombre, padre, fid){
  if(fid){
    try{
      await drFetch(`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
      await drFetch(`https://www.googleapis.com/drive/v3/files/${fid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nombre }) });
      return fid;
    }catch(e){ if(e.status !== 404) throw e; }
  }
  const b = 'cs' + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({ name: nombre, parents: [padre] });
  const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: ${blob.type || 'application/octet-stream'}\r\n\r\n`, blob, `\r\n--${b}--`]);
  const r = await drFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body });
  return (await r.json()).id;
}
async function drPapelera(fid){ try{ await drFetch(`https://www.googleapis.com/drive/v3/files/${fid}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) }); }catch(e){ if(e.status !== 404) throw e; } }

/* Registro de lo ya subido (viaja con los datos para no duplicar) */
function drDoc(k){ return S.drivedocs.find(x=> x.id === k && !x.del) || null; }
function drMarcar(k, fid, sig, extra){
  const i = S.drivedocs.findIndex(x=> x.id === k);
  const rec = Object.assign({ id: k, fid, sig, t: todayISO(), u: now() }, extra || {});
  if(i >= 0) S.drivedocs[i] = rec; else S.drivedocs.push(rec);
  saveLocal(); lsSet('cs_dirty', '1'); scheduleSync();
}
function drBorrarMarca(k){ const x = S.drivedocs.find(r=> r.id === k); if(x){ x.del = true; x.u = now(); saveLocal(); lsSet('cs_dirty', '1'); scheduleSync(); } }

/* Toma lo que la app normalmente "descarga" y lo entrega como archivo */
async function capturar(fn){
  const out = [];
  const XL = await loadXLSX().catch(()=> window.XLSX);
  const click0 = HTMLAnchorElement.prototype.click, wf0 = XL && XL.writeFile;
  HTMLAnchorElement.prototype.click = function(){
    if(this.download && /^blob:/.test(this.href)){ const n = this.download, h = this.href; out.push(fetch(h).then(r=> r.blob()).then(b=> ({ name: n, blob: b }))); }
    else click0.call(this);
  };
  if(XL) XL.writeFile = (wb, name)=>{ out.push(Promise.resolve({ name, blob: new Blob([XL.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }) })); };
  try{ await fn(); }
  finally{ HTMLAnchorElement.prototype.click = click0; if(XL) XL.writeFile = wf0; }
  return Promise.all(out);
}
const limpio = s=> String(s || '').replace(/[\\/:*?"<>|#]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 90);

/* ---------- Qué falta subir ---------- */
function drPendientes(){
  const c = drCfg(); if(!c) return [];
  const p = [];
  live('actas').forEach(a=>{
    const base = limpio(`${a.fecha} ${a.titulo || a.tipo}`);
    const d = drDoc('acta:' + a.id); if(!d || d.sig !== String(a.u)) p.push({ k: 'acta:' + a.id, sig: String(a.u), tipo: 'acta', a, nombre: base + '.docx', fid: d && d.fid });
    (a.archivos || []).forEach(f=>{ const dk = 'arch:' + f.id; const n = limpio(base + ' - ' + f.nombre); const dd = drDoc(dk); if(!dd || dd.n !== n) p.push({ k: dk, sig: '1', tipo: 'arch', a, f, nombre: n, fid: dd && dd.fid }); });
  });
  const vivos = new Set(live('actas').flatMap(a=> ['acta:' + a.id].concat((a.archivos || []).map(f=> 'arch:' + f.id))));
  S.drivedocs.filter(x=> !x.del && /^(acta|arch):/.test(x.id) && !vivos.has(x.id)).forEach(x=> p.push({ k: x.id, tipo: 'borrar', fid: x.fid }));
  live('nominas').forEach(nm=>{ const d = drDoc('nom:' + nm.id); if(!d || d.sig !== String(nm.u)) p.push({ k: 'nom:' + nm.id, sig: String(nm.u), tipo: 'nomina', nm, fid: d && d.fid }); });
  const sig = drFirma(), ra = drDoc('ract');
  if(!ra || (ra.sig !== sig && Date.now() - (ra.at || 0) > DR_ESPERA)) p.push({ k: 'ract', tipo: 'ractual', sig });
  const mes = todayISO().slice(0, 7); if(!drDoc('rmes:' + mes)) p.push({ k: 'rmes:' + mes, tipo: 'rmes', mes });
  S.drivedocs.filter(x=> !x.del && /^resp:/.test(x.id)).forEach(x=> p.push({ k: x.id, tipo: 'borrar', fid: x.fid }));
  return p;
}

/* ---------- Subir ---------- */
async function drEjecutar(manual){
  if(drCorriendo) return drCorriendo;
  const c = drCfg(); if(!c || !drEsDueno()) return;
  if(!drTokOk()){ drEstado.st = 'auth'; drPintar(); return; }
  drCorriendo = (async ()=>{
    const lista = drPendientes();
    drEstado = Object.assign(drEstado, { st: 'busy', total: lista.length, hecho: 0, msg: '' }); drPintar();
    let err = 0;
    for(const it of lista){
      try{
        if(it.tipo === 'acta'){
          const [f] = await capturar(()=> ACT['acta-word']({ dataset: { id: it.a.id } }));
          if(f){ const fid = await drSubir(f.blob, it.nombre, c.sub.actas, it.fid); drMarcar(it.k, fid, it.sig); }
        } else if(it.tipo === 'arch'){
          const blob = await bajarArchivo(it.f);
          const fid = await drSubir(blob, it.nombre, c.sub.actas, it.fid); drMarcar(it.k, fid, '1', { n: it.nombre });
        } else if(it.tipo === 'borrar'){
          await drPapelera(it.fid); drBorrarMarca(it.k);
        } else if(it.tipo === 'nomina'){
          const [f] = await capturar(()=> nominaWord(it.nm));
          if(f){ const fid = await drSubir(f.blob, limpio(f.name.replace(/\.docx$/, '')) + '.docx', c.sub.planillas, it.fid); drMarcar(it.k, fid, it.sig); }
        } else if(it.tipo === 'ractual'){
          await drRespaldoActual(c, it.sig);
        } else if(it.tipo === 'rmes'){
          await drRespaldoMes(c, it.mes);
        }
      }catch(e){
        if(e.auth){ drEstado.st = 'auth'; drPintar(); drCorriendo = null; return; }
        err++; drEstado.msg = e.message || String(e);
      }
      drEstado.hecho++; drPintar();
    }
    drEstado.st = err ? 'error' : 'ok'; drEstado.at = now(); lsSet('cs_dr_at', String(drEstado.at));
    drPintar();
    if(manual) toast(err ? `⚠ ${err} documento(s) no se pudieron subir: ${drEstado.msg}` : `✓ Carpeta de Drive al día${lista.length ? ' (' + lista.length + ' documento(s))' : ''}`, err ? 'bad' : 'ok', 8000);
  })();
  try{ await drCorriendo; } finally { drCorriendo = null; }
}
function drFirma(){ return COLS.filter(c=> c !== 'drivedocs' && c !== 'correos').map(c=> S[c].length + '.' + S[c].reduce((m, x)=> Math.max(m, x.u || 0), 0)).join('|') + '|' + (S.config.u || 0); }
const DR_ESPERA = 30 * 60000;
const DR_FIJOS = [[/^respaldo-/, 'Respaldo completo.json'], [/^cuotas-/, 'Cuotas y pagos.xlsx'], [/^socios-/, 'Socios e historial.xlsx'], [/^gastos-/, 'Gastos ' + new Date().getFullYear() + '.xlsx'], [/^ingresos-/, 'Ingresos ' + new Date().getFullYear() + '.xlsx']];
async function drArchivosRespaldo(){
  const anio = String(new Date().getFullYear()), fa = ui.finAnio;
  return capturar(async ()=>{
    ACT['respaldo']();
    await ACT['excel']();
    await ACT['excel-socios']();
    ui.finAnio = anio;
    try{ await ACT['mv-excel']({ dataset: { col: 'gastos' } }); await ACT['mv-excel']({ dataset: { col: 'ingresos' } }); } finally { ui.finAnio = fa; }
  });
}
async function drSubcarpeta(k, nombre, padre){ const d = drDoc(k); if(d) return d.fid; const f = await drCrearCarpeta(nombre, padre); drMarcar(k, f.id, '1'); return f.id; }
/* Respaldo actual: mismos archivos, se reemplaza su contenido (Drive guarda las versiones anteriores) */
async function drRespaldoActual(c, sig){
  const dir = await drSubcarpeta('ractdir', 'Respaldo actual', c.sub.respaldos);
  for(const f of await drArchivosRespaldo()){
    const fijo = DR_FIJOS.find(([re])=> re.test(f.name)); if(!fijo) continue;
    const k = 'ract:' + fijo[1].split(' ')[0].toLowerCase(), d = drDoc(k);
    const fid = await drSubir(f.blob, fijo[1], dir, d && d.fid); drMarcar(k, fid, '1');
  }
  drMarcar('ract', dir, sig, { at: Date.now() });
}
/* Copia fija del mes (historial) */
async function drRespaldoMes(c, mes){
  const dir = await drSubcarpeta('rmesdir', 'Mensuales', c.sub.respaldos);
  const sub = await drCrearCarpeta('Respaldo ' + mes, dir);
  for(const f of await drArchivosRespaldo()) await drSubir(f.blob, f.name, sub.id);
  drMarcar('rmes:' + mes, sub.id, '1');
}
function drProgramar(ms){ clearTimeout(drTimer); if(!drCfg() || !drEsDueno() || !drTokOk()) return; drTimer = setTimeout(()=> drEjecutar(false), ms == null ? 15000 : ms); }

/* ---------- Conectar ---------- */
ACT['dr-conectar'] = async ()=>{
  try{ await drLogin(); }catch(e){ toast('⚠ ' + e.message, 'bad'); return; }
  try{
    const raiz = await drCrearCarpeta('Gestión Sindical · ' + (S.config.nombre || 'Sindicato'));
    const sub = {};
    for(const [k, n] of Object.entries(DR_SUB)) sub[k] = (await drCrearCarpeta(n, raiz.id)).id;
    S.drivedocs.forEach(x=>{ if(!x.del){ x.del = true; x.u = now(); } });
    setConfig({ carpeta: { id: raiz.id, url: raiz.webViewLink || ('https://drive.google.com/drive/folders/' + raiz.id), email: drEmail(), sub } });
    toast('✓ Carpeta creada en tu Google Drive. Subiendo documentos…', 'ok', 8000);
    drEjecutar(true);
  }catch(e){ toast('⚠ ' + e.message, 'bad'); }
};
ACT['dr-subir'] = async ()=>{
  if(!drEsDueno()){ toast('Los documentos se suben desde el equipo de ' + (drCfg() ? drCfg().email : 'quien conectó la carpeta') + '.', 'bad', 8000); return; }
  if(!drTokOk()){ try{ await drLogin(); }catch(e){ toast('⚠ ' + e.message, 'bad'); return; } }
  if(drEmail() !== drCfg().email){ toast(`Entraste con ${drEmail()}, pero la carpeta es de ${drCfg().email}.`, 'bad', 8000); return; }
  drEjecutar(true);
};
ACT['dr-abrir', 'dr-subir'] = ()=>{ const c = drCfg(); if(c) window.open(c.url, '_blank'); };
ACT['dr-quitar'] = async ()=>{ if(!await confirmar('¿Dejar de subir documentos a la carpeta? La carpeta y lo que ya se subió quedan en Drive.', 'Dejar de subir', true)) return; setConfig({ carpeta: null }); };

/* ---------- Indicador y tarjeta en Ajustes ---------- */
function drPintar(){
  const box = $('#drBox'); if(box) box.innerHTML = drEstadoHtml();
  let ch = $('#drChip');
  const pend = drCfg() && drEsDueno() ? drPendientes().length : 0;
  const ver = drCfg() && drEsDueno() && (drEstado.st === 'busy' || (pend && !drTokOk()) || drEstado.st === 'error');
  if(!ver){ if(ch) ch.remove(); return; }
  if(!ch){ ch = document.createElement('button'); ch.type = 'button'; ch.id = 'drChip'; ch.className = 'sync-chip'; ch.dataset.act = 'dr-subir'; const sc = $('#syncChip'); sc.parentNode.insertBefore(ch, sc); }
  ch.className = 'sync-chip' + (drEstado.st === 'busy' ? ' busy' : drEstado.st === 'error' ? ' bad' : '');
  ch.textContent = drEstado.st === 'busy' ? `📁 ${drEstado.hecho}/${drEstado.total}` : drEstado.st === 'error' ? '📁 ⚠ Drive' : `📁 Subir ${pend}`;
  ch.title = drEstado.st === 'busy' ? 'Subiendo documentos a la carpeta de Drive' : 'Documentos por subir a la carpeta de Drive';
}
function drEstadoHtml(){
  const c = drCfg(); if(!c) return '';
  if(!drEsDueno()) return `<div class="note small">Los documentos se suben automáticamente desde el equipo de <b>${esc(c.email)}</b>.</div>`;
  const pend = drPendientes().length;
  if(drEstado.st === 'busy') return `<div class="note small">⟳ Subiendo ${drEstado.hecho} de ${drEstado.total}…</div>`;
  return `<div class="note ${drEstado.st === 'error' ? 'bad' : pend && !drTokOk() ? 'warn' : 'ok'} small">${drEstado.st === 'error' ? '⚠ ' + esc(drEstado.msg) + '<br>' : ''}${pend ? `${pend} documento(s) por subir.${drTokOk() ? '' : ' El permiso de Google dura 1 hora: toca "Subir ahora".'}` : '✓ Todo subido.'}${drEstado.at ? ' Última subida: ' + fdatetime(drEstado.at) + '.' : ''}</div>`;
}
function carpetaCardHtml(){
  const c = drCfg();
  if(!c) return `<div class="card"><h2>📁 Carpeta del sindicato en Google Drive</h2>
    <p class="dim small">Crea una carpeta en <b>tu</b> Google Drive ("Mi unidad") donde la app sube sola: las <b>actas</b> en Word con sus PDF y fotos, las <b>planillas de abonos</b>, y un <b>respaldo</b> en Excel y completo que se mantiene al día. Después la compartes con la directiva desde Drive.</p>
    <div class="btn-row"><button class="btn primary" data-act="dr-conectar">📁 Crear carpeta y conectar</button></div></div>`;
  return `<div class="card"><h2>📁 Carpeta del sindicato en Google Drive</h2>
    <p class="small">Carpeta de <b>${esc(c.email)}</b>: <i>Actas</i>, <i>Planillas de abonos</i> y <i>Respaldos</i> (<i>Respaldo actual</i>, que se actualiza en los mismos archivos cuando hay cambios, y una copia fija por mes en <i>Mensuales</i>).</p>
    <div id="drBox">${drEstadoHtml()}</div>
    <div class="btn-row"><a class="btn" href="${esc(c.url || ('https://drive.google.com/drive/folders/' + c.id))}" target="_blank" rel="noopener">📂 Abrir carpeta</a>${drEsDueno() || !drEmail() ? '<button class="btn primary" data-act="dr-subir">⟳ Subir ahora</button>' : ''}</div>
    <p class="dim tiny" style="margin-top:8px">Para compartirla: ábrela, toca <b>Compartir</b> y agrega los correos de la directiva como <b>Lectores</b> (o Editores). El respaldo completo (.json) no va cifrado: compártela solo con la directiva.</p>
    ${drEsDueno() ? '<details class="adv"><summary>Más opciones</summary><button class="btn sm danger" data-act="dr-quitar">Dejar de subir a esta carpeta</button></details>' : ''}
  </div>`;
}
const _vAjDr = VIEWS.ajustes, _mAjDr = VIEWS.ajustes.mount;
VIEWS.ajustes = function(){ const h = _vAjDr(); const i = h.indexOf('<div class="card">', 10); return i > 0 ? h.slice(0, i) + carpetaCardHtml() + h.slice(i) : h + carpetaCardHtml(); };
VIEWS.ajustes.mount = _mAjDr;
const _renderDr = renderView;
renderView = function(){ _renderDr(); drPintar(); };

/* Automático: al abrir la app, tras cada cambio y cada 10 minutos (si el permiso de Google sigue vigente) */
const _schedDr = scheduleSync;
scheduleSync = function(d){ _schedDr(d); drProgramar(); };
setTimeout(()=>{ drPintar(); drProgramar(4000); }, 2000);
setInterval(()=>{ if(document.visibilityState === 'visible') drProgramar(1000); }, 600000);

/* =====================================================================
   QUÉ SE MUESTRA EN EL PORTAL DE SOCIOS
   Lo que se desmarca no solo se oculta: tampoco se publica.
   ===================================================================== */
const PV_GRUPOS = [
  ['Cuotas y deuda', [
    ['deuda', 'Estado de deuda (al día / monto pendiente) y resumen'],
    ['grilla', 'Calendario de cuotas por mes'],
    ['pendiente', 'Detalle de lo pendiente'],
    ['pagos', 'Historial de pagos'],
    ['cobros', 'Cobros extraordinarios'],
    ['plan', 'Plan de pago'],
    ['desc', 'Descuentos y condonaciones'],
  ]],
  ['Gestión', [
    ['avisos', 'Avisos y comunicados'],
    ['actas', 'Actas publicadas'],
    ['archivos', 'Archivos adjuntos de las actas (PDF, fotos)'],
    ['acuerdos', 'Acuerdos y tareas públicas'],
    ['mistareas', 'Tareas a cargo del propio socio'],
  ]],
];
function pvCfg(){ const v = {}; PV_GRUPOS.forEach(g=> g[1].forEach(([k])=> v[k] = !S.config.portalVer || S.config.portalVer[k] !== false)); return v; }

const _bppV = buildPortalPayload;
buildPortalPayload = function(s){
  const p = _bppV(s), v = pvCfg();
  p.ver = {}; Object.keys(v).forEach(k=> p.ver[k] = v[k] ? 1 : 0);
  if(!v.pagos) p.pagos = [];
  if(!v.plan) p.plan = null;
  if(!v.desc) p.desc = [];
  if(!v.mistareas) delete p.mt;
  if(!v.avisos && !v.actas && !v.acuerdos) delete p.gk;
  if(!(v.deuda || v.grilla || v.pendiente || v.cobros)) p.items = [];
  return p;
};
function filtrarComun(data){
  const v = pvCfg();
  if(!v.actas) data.actas = [];
  else if(!v.archivos) data.actas.forEach(a=> a.ar = []);
  if(!v.acuerdos) data.tareas = [];
  if(!v.avisos) data.avisos = [];
}

function pvCardHtml(){
  const v = pvCfg();
  return `<div class="card">
    <h2>¿Qué se muestra en el portal?</h2>
    <p class="dim small">Marca lo que los socios pueden ver con su QR. Lo que desmarques no se publica. Los socios nunca ven notas internas ni datos de otros socios.</p>
    ${PV_GRUPOS.map(([t, it])=> `<h3 style="margin:12px 0 4px">${t}</h3>${it.map(([k, l])=> `<label class="check" style="display:flex;margin:6px 0"><input type="checkbox" class="pvChk" data-k="${k}" ${v[k] ? 'checked' : ''}> ${l}</label>`).join('')}`).join('')}
    <p class="dim tiny" style="margin-top:10px">Los cambios se aplican al publicar el portal${S.config.portalAuto ? ' (se publica solo en unos segundos)' : ''}.</p>
  </div>`;
}
const _vPortV = VIEWS.portal, _mPortV = VIEWS.portal.mount;
VIEWS.portal = function(){
  const h = _vPortV();
  const i = h.indexOf('<h2>¿Qué ve el socio?</h2>');
  if(i < 0) return h + pvCardHtml();
  const ini = h.lastIndexOf('<div class="card">', i);
  return h.slice(0, ini) + pvCardHtml();
};
VIEWS.portal.mount = function(v){
  if(_mPortV) _mPortV(v);
  $$('.pvChk', v).forEach(ch=> ch.onchange = ()=>{
    const cur = Object.assign({}, S.config.portalVer || {});
    cur[ch.dataset.k] = ch.checked;
    setConfig({ portalVer: cur }, { noRender: true });
    if(S.config.portalAuto && connected()) schedulePortal();
    toast(ch.checked ? '✓ Se mostrará en el portal' : 'Ya no se mostrará en el portal', 'ok');
  });
};

</script>
